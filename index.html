<script>
  // Kayıtlı temayı ilk boyamadan önce uygula (yanıp sönmeyi önler)
  try{if(localStorage.getItem("archon-theme")==="light"){document.documentElement.setAttribute("data-theme","light");document.querySelector('meta[name="color-scheme"]').content="light";document.querySelector('meta[name="theme-color"]').content="#faf8f5";}if(localStorage.getItem("erebiel-accent")==="silver")document.documentElement.setAttribute("data-accent","silver");}catch(e){}

<script src="i18n.js"></script>
<style>
  :root{
    --void:#0a0806;--spectral:#7bd3d6;--stone:#c8c9cc;--whisper:#8d8a85;
    /* typography: warm gold for the wordmark + primary emphasis, cool platinum for supporting text */
    --gold:#d4af6a;--silver:#c8c9cc;
    /* UI accent follows the Gold/Silver switch; persona colors stay their own */
    --accent:var(--gold);--accent-rgb:212,175,106;
    --ease:cubic-bezier(.4,0,.2,1);
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  html[data-accent="silver"]{--accent:var(--silver);--accent-rgb:200,201,204}
  html[data-theme="light"]{--gold:#8f6a2a;--silver:#686b70;--stone:#3d3a36;--whisper:#7a746c;--accent-rgb:143,106,42}
  html[data-theme="light"][data-accent="silver"]{--accent-rgb:104,107,112}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  /* decorative glows reach past the edges; clip them so phones don't widen the page */
  html{overflow-x:hidden}@supports (overflow:clip){html{overflow-x:clip}}
  body{background:radial-gradient(120% 90% at 50% 40%,#14100b 0%,var(--void) 55%,#050403 100%);color:var(--stone);font-family:var(--sans);overflow:hidden;position:relative;min-height:100dvh;-webkit-font-smoothing:antialiased;opacity:0;animation:pageIn 1.6s ease .1s forwards}
  @keyframes pageIn{to{opacity:1}}

  .fog{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .blob{position:absolute;border-radius:50%;mix-blend-mode:screen;filter:blur(46px)}
  .b1{width:70vmax;height:70vmax;left:24%;top:42%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(212,175,106,.035),transparent 60%);animation:d1 30s ease-in-out infinite}
  .b2{width:70vmax;height:70vmax;left:76%;top:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(230,190,120,.045),transparent 60%);animation:d2 34s ease-in-out infinite}
  .vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(120% 100% at 50% 44%,transparent 26%,rgba(0,0,0,.55) 70%,rgba(0,0,0,.92) 100%)}
  @keyframes d1{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-52%,-46%) scale(1.08)}}
  @keyframes d2{0%,100%{transform:translate(-50%,-50%) scale(1.05)}50%{transform:translate(-48%,-54%) scale(1)}}

  /* ---------- THEME (dark default · light optional) ---------- */
  /* Gradients can't be transitioned, so the light ground is its own layer that fades in */
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity .9s ease;
      background:radial-gradient(120% 100% at 50% 44%,transparent 30%,rgba(90,70,45,.08) 72%,rgba(70,52,32,.18) 100%),
                 radial-gradient(120% 90% at 50% 40%,#fbf8f2 0%,#f0eadf 52%,#e3dacb 100%)}
  .vignette{transition:opacity .9s ease}
  .theme-toggle{position:fixed;top:calc(2.4vh + env(safe-area-inset-top));right:calc(4vw + env(safe-area-inset-right));z-index:8;width:34px;height:34px;border-radius:50%;padding:0;cursor:pointer;display:grid;place-items:center;overflow:hidden;
      background:transparent;border:1px solid rgba(var(--accent-rgb),.22);color:rgba(var(--accent-rgb),.75);opacity:0;animation:pageIn 1.6s ease 1.2s forwards;
      transition:color .3s var(--ease),border-color .3s var(--ease),background-color .3s var(--ease),transform .3s var(--ease)}
  .theme-toggle:hover,.theme-toggle:focus-visible{color:var(--accent);border-color:rgba(var(--accent-rgb),.55);transform:scale(1.08);outline:none}
  .theme-toggle svg{grid-area:1/1;width:16px;height:16px;transition:opacity .5s var(--ease),transform .7s var(--ease)}
  .theme-toggle .i-moon{opacity:0;transform:rotate(-70deg) scale(.6)}
  .accent-toggle{right:calc(4vw + env(safe-area-inset-right) + 44px)}
  .accent-toggle .chip{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,var(--accent) 55%,rgba(0,0,0,.35) 120%);box-shadow:0 0 10px rgba(var(--accent-rgb),.45);transition:background .5s var(--ease),box-shadow .5s var(--ease)}

  html[data-theme="light"] body::before{opacity:1}
  html[data-theme="light"] .vignette{opacity:0}
  html[data-theme="light"] .theme-toggle .i-sun{opacity:0;transform:rotate(70deg) scale(.6)}
  html[data-theme="light"] .theme-toggle .i-moon{opacity:1;transform:none}
  html[data-theme="light"] .info-dot{background:rgba(90,70,45,.35)}
  html[data-theme="light"] .safety-overlay{background:rgba(245,240,232,.94)}
  html[data-theme="light"] .safety-card{color:#3d3a36}
  /* Archon chat in daylight: pale stone, deep teal accent (Multivac is already light) */

  /* ---------- THRESHOLD: three light forms, asymmetric ---------- */
  #threshold{position:relative;z-index:5;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(2.6rem,8vh,4.6rem);padding:14vh 4vw 10vh;opacity:0;animation:rise 1.6s var(--ease) .6s forwards}
  /* size hierarchy from one unit: Multivac large (1.3) · Archon & Mirror medium (1) · Characters small (.7) */
  .sym-row{--m:min(clamp(120px,22vh,175px),24vw);--aw:min(56px,12vw);display:flex;align-items:flex-end;justify-content:center;gap:clamp(1.1rem,calc(11vw - 1.5rem),8.5rem)}
  .sym{position:relative;background:none;border:none;padding:0 0 2rem;cursor:pointer;color:inherit;display:flex;flex-direction:column;align-items:center;-webkit-tap-highlight-color:transparent}
  .sym:focus-visible{outline:none}
  /* uneven sizes, gaps and heights — nothing on one line */
  .sym-archon{--w:var(--aw);--h:var(--m)}
  .sym-mirror{--h:var(--m);--w:calc(var(--m) / 1.46);transform:translateX(calc(var(--m) * .1625 - var(--aw) * .125))}
  .sym-multivac{--w:calc(var(--m) * 1.3);--h:var(--w)}
  .glyph{position:relative;display:block;width:var(--w);height:var(--h);isolation:isolate;transition:transform .3s var(--ease),filter .3s var(--ease)}
  .sym:hover .glyph,.sym:focus-visible .glyph,.sym:active .glyph{transform:scale(1.06);filter:brightness(1.2)}
  .form{position:absolute;inset:0;display:block;animation:breathe 3.6s var(--ease) infinite}
  .sym-mirror .form{animation-delay:-1.2s}.sym-multivac .form{animation-delay:-2.4s}.sym-characters .form{animation-delay:-.6s}
  /* Characters — a small gathering of points of light, smaller than the other three */
  .sym-characters{--w:calc(var(--m) * .7);--h:var(--w);--g:255,236,200;--s:226,229,233}
  .ch-orb{display:none}
  .form-characters{border-radius:50%;
      background:radial-gradient(circle at 28% 38%,rgba(var(--g),.95) 0,rgba(var(--g),.95) 4%,transparent 10%),
                 radial-gradient(circle at 55% 24%,rgba(var(--s),.9) 0,rgba(var(--s),.9) 3%,transparent 8%),
                 radial-gradient(circle at 67% 56%,rgba(var(--g),.85) 0,rgba(var(--g),.85) 5%,transparent 12%),
                 radial-gradient(circle at 40% 68%,rgba(var(--s),.8) 0,rgba(var(--s),.8) 3%,transparent 8%),
                 radial-gradient(circle at 80% 33%,rgba(var(--g),.7) 0,rgba(var(--g),.7) 2.5%,transparent 7%),
                 radial-gradient(circle at 19% 63%,rgba(var(--s),.6) 0,rgba(var(--s),.6) 2%,transparent 6%),
                 radial-gradient(circle at 60% 76%,rgba(var(--g),.65) 0,rgba(var(--g),.65) 2.5%,transparent 6.5%),
                 radial-gradient(circle at 36% 18%,rgba(var(--g),.55) 0,rgba(var(--g),.55) 2%,transparent 5.5%),
                 radial-gradient(circle at 50% 48%,rgba(var(--accent-rgb),.16),transparent 62%)}
  /* narrow screens: characters drops below the row instead of squeezing it */
  @keyframes breathe{0%,100%{opacity:.78;transform:scale(.965)}50%{opacity:1;transform:scale(1.035)}}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  /* Archon — one narrow, sharp vertical beam */
  .form-archon::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:24px;transform:translateX(-50%);filter:blur(9px);
      background:linear-gradient(to bottom,transparent,rgba(180,225,230,.3) 28%,rgba(215,240,243,.5) 50%,rgba(180,225,230,.3) 72%,transparent)}
  .form-archon::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;transform:translateX(-50%);
      background:linear-gradient(to bottom,transparent,#e6f5f6 24%,#fff 50%,#e6f5f6 76%,transparent);box-shadow:0 0 6px rgba(225,246,248,.7)}
  /* Mirror — thin gold-framed oval */
  .form-mirror{border-radius:50%;border:.9px solid rgba(var(--accent-rgb),.85);
      background:radial-gradient(ellipse 55% 40% at 40% 30%,rgba(255,250,238,.16),transparent 70%),radial-gradient(ellipse at 50% 46%,#d8d4c8 0%,#c3beb1 40%,#a8a397 74%,#8f8b81 100%);
      box-shadow:0 0 18px rgba(216,212,200,.14),inset 0 0 14px rgba(40,34,26,.38);filter:brightness(.86)}
  /* Multivac — soft, dispersing warm cloud */
  .form-multivac{border-radius:50%;filter:blur(3px);
      background:radial-gradient(circle,rgba(255,241,214,.95) 0%,rgba(242,208,146,.62) 20%,rgba(222,176,104,.3) 42%,rgba(205,155,85,.1) 60%,transparent 72%)}
  .sym-label{position:absolute;left:50%;bottom:0;transform:translateX(-50%);white-space:nowrap;font-size:.66rem;font-weight:500;letter-spacing:.34em;padding-left:.34em;text-transform:lowercase;color:var(--silver);opacity:.8;transition:opacity .3s var(--ease)}
  .sym:hover .sym-label,.sym:focus-visible .sym-label{opacity:1}
  @media (max-width:520px){.sym-label{font-size:.6rem;letter-spacing:.2em;padding-left:.2em}}

  /* empty state: a quiet line in the page itself, no card */
  .invite{display:flex;justify-content:center;text-align:center;animation:rise 1.2s var(--ease) 1.4s both}
  .invite[hidden]{display:none}
  .invite-text{font-size:.7rem;font-weight:500;letter-spacing:.34em;padding-left:.34em;color:var(--silver);opacity:.6}

  /* ---------- AURAS (behind Archon & Multivac) ---------- */
  /* a blurred, slowly turning conic ring per symbol; two layers at different speeds keep it organic */
  .aura{position:absolute;inset:-34%;z-index:-1;pointer-events:none;border-radius:50%;filter:blur(26px);
      -webkit-mask-image:radial-gradient(closest-side,#000 36%,transparent 100%);mask-image:radial-gradient(closest-side,#000 36%,transparent 100%);
      animation:auraBreath 12s var(--ease) infinite;transition:opacity 1.2s var(--ease)}
  .aura::before,.aura::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--aura);animation:auraSpin 52s linear infinite}
  .aura::after{inset:14%;background:var(--aura2);animation:auraSpin 76s linear infinite reverse,auraPulse 9s var(--ease) infinite}
  @keyframes auraSpin{to{transform:rotate(360deg)}}
  @keyframes auraBreath{0%,100%{transform:scale(.93)}50%{transform:scale(1.07)}}
  @keyframes auraPulse{0%,100%{opacity:.45}50%{opacity:.9}}
  .sym-archon .aura{inset:-12% -140%}
  /* Archon: deep, dim, fog-veiled — plum, indigo, abyssal teal, oxblood */
  .aura-archon{opacity:.62;
      --aura:conic-gradient(from 20deg,#3b1a66,#262c80,#125e63,#6a1a36,#3b1a66);
      --aura2:conic-gradient(from 200deg,#1c2a70,#4a1a5c,#0f4d52,#551230,#1c2a70)}
  /* Multivac: soft pastel dawn — rose, lavender, sky, mint, peach */
  .aura-multivac{opacity:.22;
      --aura:conic-gradient(from 0deg,#ffc8dd,#cdb4db,#bde0fe,#caffbf,#ffd6a5,#ffc8dd);
      --aura2:conic-gradient(from 180deg,#ffd6a5,#bde0fe,#ffc8dd,#cdb4db,#caffbf,#ffd6a5)}
  /* Mirror: calm gold-platinum veil. Characters: warm gold with silver glints. Both quieter than the two voices */
  .aura-mirror{opacity:.3;
      --aura:conic-gradient(from 40deg,#d4af6a,#c8c9cc,#a8864c,#e4e1da,#d4af6a);
      --aura2:conic-gradient(from 220deg,#c8c9cc,#d4af6a,#bfc3c8,#b8955a,#c8c9cc)}
  .aura-characters{opacity:.26;
      --aura:conic-gradient(from 90deg,#e2c07a,#c8c9cc,#d4af6a,#f0e3c4,#e2c07a);
      --aura2:conic-gradient(from 270deg,#d4af6a,#e8e8ea,#c9a25e,#c8c9cc,#d4af6a)}
  .sym:hover .aura-mirror,.sym:focus-visible .aura-mirror{opacity:.45}
  .sym:hover .aura-characters,.sym:focus-visible .aura-characters{opacity:.4}
  .sym:hover .aura-archon,.sym:focus-visible .aura-archon{opacity:.82}
  .sym:hover .aura-multivac,.sym:focus-visible .aura-multivac{opacity:.36}

  /* =====================================================================
     LIGHT MODE — its own palette, not derived from the dark look.
     Dusty pastel: every hue low-saturation, as if filtered through grey.
     Auras turn and breathe like in dark mode but blend normally —
     no mix-blend-mode anywhere in light mode.
     ===================================================================== */
  html[data-theme="light"]{--multivac:#E8A33D;--archon:#7C93A3;--mirror-light:#D4CFC0;--mirror-dark:#8C8578;
      --char-rose:#C9A0A0;--char-sage:#9CAF88;--char-blue:#8FA3B3;--char-gold:#D4B483}
  html[data-theme="light"] body::before{background:radial-gradient(120% 100% at 50% 44%,transparent 40%,rgba(214,196,176,.08) 80%,rgba(200,180,160,.14) 100%),
      radial-gradient(120% 90% at 50% 40%,#fdfcfa 0%,#faf8f5 55%,#f4efe8 100%)}
  /* two soft warm washes drifting behind everything */
  html[data-theme="light"] .blob{mix-blend-mode:normal;filter:blur(60px)}
  html[data-theme="light"] .b1{background:radial-gradient(circle,rgba(124,147,163,.06),transparent 60%)}
  html[data-theme="light"] .b2{background:radial-gradient(circle,rgba(255,138,61,.07),transparent 60%)}
  /* jewel tones render at full strength; Multivac keeps its existing softening untouched */
  html[data-theme="light"] .glyph{filter:none}
  html[data-theme="light"] .sym:hover .glyph,html[data-theme="light"] .sym:focus-visible .glyph,html[data-theme="light"] .sym:active .glyph{filter:brightness(1.08)}
  html[data-theme="light"] .sym-multivac .glyph,html[data-theme="light"] .res-card[data-persona="multivac"] .res-av{filter:saturate(.6) brightness(1.05)}
  html[data-theme="light"] .sym-multivac:hover .glyph,html[data-theme="light"] .sym-multivac:focus-visible .glyph,html[data-theme="light"] .sym-multivac:active .glyph{filter:saturate(.75) brightness(1.05)}
  /* auras: same turning/breathing layers as dark, vivid light-mode colours */
  html[data-theme="light"] .aura-archon{opacity:.55;
      --aura:conic-gradient(from 20deg,#DCD5C6,#CFC9BE,#E6DCC6,#C9C4BA,#DCD5C6);
      --aura2:conic-gradient(from 200deg,#E6DCC6,#D2CCC0,#DCD5C6,#E6DCC6)}
  html[data-theme="light"] .aura-mirror{opacity:.42;
      --aura:conic-gradient(from 0deg,#D4CFC0,#B0A99A,#F0EDE4,#B0A99A,#D4CFC0);
      --aura2:conic-gradient(from 180deg,#B0A99A,#D4CFC0,#B0A99A)}
  html[data-theme="light"] .aura-multivac{opacity:.52;
      --aura:conic-gradient(from 0deg,#ffe066,#ffb347,#ffd24d,#ff9f43,#ffe066);
      --aura2:conic-gradient(from 180deg,#ff9f43,#ffe066,#ffb347,#ffd24d,#ff9f43)}
  html[data-theme="light"] .aura-characters{opacity:.44;
      --aura:conic-gradient(from 90deg,#E8C27A,#E4E1DA,#E6D3AE,#D9B0A2,#E8C27A);
      --aura2:conic-gradient(from 270deg,#E4E1DA,#E8C27A,#E6D3AE,#E4E1DA)}
  html[data-theme="light"] .sym:hover .aura-archon,html[data-theme="light"] .sym:focus-visible .aura-archon{opacity:.7}
  html[data-theme="light"] .sym:hover .aura-mirror,html[data-theme="light"] .sym:focus-visible .aura-mirror{opacity:.56}
  html[data-theme="light"] .sym:hover .aura-multivac,html[data-theme="light"] .sym:focus-visible .aura-multivac{opacity:.68}
  html[data-theme="light"] .sym:hover .aura-characters,html[data-theme="light"] .sym:focus-visible .aura-characters{opacity:.58}
  /* Archon — dusty slate-blue thread */
  html[data-theme="light"] .form-archon::after{width:2.5px;border-radius:2px;filter:none;background:linear-gradient(to bottom,var(--archon) 0%,var(--archon) 22%,#9483C4 50%,var(--archon) 78%,var(--archon) 100%);box-shadow:0 0 6px rgba(148,131,196,.35);
      -webkit-mask-image:linear-gradient(to bottom,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(to bottom,transparent,#000 12%,#000 88%,transparent)}
  html[data-theme="light"] .form-archon::before{width:3px;top:8%;bottom:8%;border-radius:3px;filter:none;background:transparent;
      box-shadow:0 0 72px 22px rgba(214,206,190,.45),0 0 28px 8px rgba(206,200,188,.4)}
  html[data-theme="light"] .form-archon{background:radial-gradient(ellipse 30% 22% at 50% 50%,rgba(148,131,196,.28),rgba(148,131,196,0) 100%)}
  /* Mirror — glassy platinum with a bright reflection */
  html[data-theme="light"] .form-mirror{border:1.2px solid #B0A99A;filter:none;
      background:radial-gradient(circle at 35% 25%,#FFFFFF 0%,#F0EDE4 25%,#D4CFC0 55%,#B0A99A 85%);
      box-shadow:0 0 50px 15px rgba(212,207,192,0.4)}
  html[data-theme="light"] .form-mirror::before{content:"";position:absolute;left:24%;top:13%;width:15%;height:11%;border-radius:50%;
      background:radial-gradient(circle,#FFFFFF 0%,rgba(255,255,255,.9) 45%,rgba(255,255,255,0) 100%);filter:blur(1.5px);transform:rotate(-24deg)}
  /* Multivac — pastel sun: soft yellow core, warm orange rim */
  html[data-theme="light"] .form-multivac{inset:0;border-radius:0;filter:blur(3px);box-shadow:none;
      background:radial-gradient(circle at 50% 50%,#fffbe6 0%,#fff1a8 13%,rgba(255,226,122,.92) 24%,rgba(255,200,97,0) 42%),
                 radial-gradient(ellipse 29% 24% at 36% 42%,rgba(255,228,125,.9),rgba(255,210,100,0) 100%),
                 radial-gradient(ellipse 27% 32% at 62% 60%,rgba(255,190,92,.85),rgba(255,162,76,0) 100%),
                 radial-gradient(ellipse 24% 20% at 60% 36%,rgba(255,214,112,.8),rgba(255,190,90,0) 100%),
                 radial-gradient(ellipse 22% 25% at 38% 64%,rgba(255,172,82,.7),rgba(255,162,76,0) 100%),
                 radial-gradient(ellipse 17% 14% at 54% 48%,rgba(255,160,76,.3),rgba(255,160,76,0) 100%)}
  /* Characters — the dark-mode cluster exactly (same eight points, same centres, same apparent sizes, same
     central glow and breathing), rendered as metallic spheres in gold, platinum-silver, champagne and a
     champagne/dried-rose blend. Geometry below is derived from the dark rule's gradient stops. */
  html[data-theme="light"] .form-characters{background:radial-gradient(circle at 50% 48%,rgba(232,194,122,.2),transparent 62%)}
  html[data-theme="light"] .ch-orb{display:block;position:absolute;border-radius:50%}
  html[data-theme="light"] .ch-orb::after{content:"";position:absolute;left:18%;top:14%;width:36%;height:28%;border-radius:50%;
      background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(255,255,255,0) 100%);transform:rotate(-28deg)}
  html[data-theme="light"] .ch-orb.o1{width:calc(var(--w) * 0.1387);height:calc(var(--w) * 0.1387);left:calc(28.0% - calc(var(--w) * 0.06935));top:calc(38.0% - calc(var(--w) * 0.06935));--glow:calc(var(--w) * 0.0855)}
  html[data-theme="light"] .ch-orb.o2{width:calc(var(--w) * 0.1079);height:calc(var(--w) * 0.1079);left:calc(55.0% - calc(var(--w) * 0.05395));top:calc(24.0% - calc(var(--w) * 0.05395));--glow:calc(var(--w) * 0.0675)}

  html[data-theme="light"] .ch-orb.o8{width:calc(var(--w) * 0.0817);height:calc(var(--w) * 0.0817);left:calc(36.0% - calc(var(--w) * 0.04085));top:calc(18.0% - calc(var(--w) * 0.04085));--glow:calc(var(--w) * 0.0515)}

  /* the same shapes in miniature: chat header + resume card */
  html[data-theme="light"] .mini-beam{width:2.5px;border-radius:2px;background:var(--archon);box-shadow:0 0 6px rgba(124,147,163,.35)}

  html[data-theme="light"] .res-card[data-persona="multivac"] .res-av{border-radius:50%;background:radial-gradient(circle at 46% 42%,#fffbe6,#fff1a8 26%,#ffe27a 54%,#ffa24c 100%);transform:scale(.7);box-shadow:0 0 16px 4px rgba(255,170,80,.35);animation:none}

  /* ---------- HOME: hero (first / >24h) vs compact (returning) ---------- */
  .brand{position:fixed;top:calc(2.6vh + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:8;background:none;border:none;cursor:pointer;
      display:flex;flex-direction:column;align-items:center;gap:.45rem;padding:.4rem .6rem}
  .brand-word{font-family:"Cinzel",serif;font-weight:600;font-size:.86rem;letter-spacing:.42em;padding-left:.42em;color:var(--accent);
      text-shadow:0 0 14px rgba(var(--accent-rgb),.22);transition:color .3s var(--ease),text-shadow .3s var(--ease)}
  .slogan{font-family:var(--sans);font-size:.58rem;font-weight:500;letter-spacing:.26em;padding-left:.26em;white-space:nowrap;color:var(--silver);opacity:.6}
  .brand:hover .brand-word,.brand:focus-visible .brand-word{text-shadow:0 0 22px rgba(var(--accent-rgb),.55)}
  .brand:focus-visible{outline:none}
  /* compact: the forms shrink into a small dock under the wordmark (labels hidden, offsets flattened) */
  body.compact #threshold{position:fixed;top:calc(2.6vh + env(safe-area-inset-top) + 3.8rem);left:0;right:0;min-height:0;padding:.8rem 4vw 1rem;animation:dockIn .9s var(--ease) both}
  body.compact .sym{padding:0}
  body.compact .sym-row{--m:44px;--aw:22px;gap:clamp(1.4rem,6vw,2.4rem);align-items:center}
  body.compact .sym-label{display:none}
  body.compact .aura{filter:blur(12px)}
  @keyframes dockIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  #resume{position:fixed;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;pointer-events:none;
      padding:calc(2.6vh + env(safe-area-inset-top) + 10.2rem) 5vw calc(7vh + env(safe-area-inset-bottom));animation:rise 1.1s var(--ease) .15s both}
  #resume[hidden]{display:none}
  .res-card{--acc:var(--spectral);pointer-events:auto;width:min(100%,27rem);padding:1.5rem 1.4rem 1.35rem;border-radius:22px;color:var(--stone);
      border:1px solid rgba(var(--accent-rgb),.2);background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01));
      -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 20px 60px rgba(0,0,0,.45)}
  .res-card[data-persona="multivac"]{--acc:#d8ad55}
  .res-eyebrow{font-size:.68rem;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--silver);opacity:.85;margin-bottom:1.1rem}
  .res-head{display:flex;align-items:center;gap:.85rem;margin-bottom:.95rem}
  .res-av{width:40px;height:40px;flex:none;animation:breathe 3.6s var(--ease) infinite}
  .res-card[data-persona="archon"] .res-av{background:radial-gradient(ellipse 9% 50% at 50% 50%,rgba(240,250,251,.95),rgba(170,220,225,.35) 55%,transparent 100%)}
  .res-card[data-persona="multivac"] .res-av{border-radius:50%;background:radial-gradient(circle,rgba(255,241,214,.95) 0%,rgba(242,208,146,.55) 30%,transparent 70%)}
  .res-meta{display:flex;flex-direction:column;gap:.2rem}
  .res-name{font-family:"Cinzel",serif;font-weight:600;letter-spacing:.18em;font-size:.9rem;color:var(--accent)}
  .res-time{font-size:.74rem;font-weight:500;letter-spacing:.06em;color:var(--silver);opacity:.75}
  .res-snippet{font-size:.95rem;line-height:1.55;font-weight:400;color:var(--stone);margin-bottom:1.3rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .res-go{flex:1;width:100%;height:3.1rem;border-radius:14px;border:1px solid var(--acc);background:transparent;color:var(--acc);cursor:pointer;
      font-family:var(--sans);font-size:1rem;letter-spacing:.06em;display:flex;align-items:center;justify-content:center;gap:.5em;
      transition:background-color .3s var(--ease),color .3s var(--ease),box-shadow .3s var(--ease)}
  .res-go:hover,.res-go:focus-visible{background:var(--acc);color:#0a0806;box-shadow:0 0 28px rgba(var(--accent-rgb),.22);outline:none}
  html[data-theme="light"] .brand-word{text-shadow:none}
  html[data-theme="light"] .res-card{--acc:#276e73;border-color:rgba(var(--accent-rgb),.28);background:rgba(255,255,255,.6);box-shadow:0 18px 50px rgba(70,52,32,.12)}
  html[data-theme="light"] .res-card[data-persona="multivac"]{--acc:#a87a22}
  html[data-theme="light"] .res-go:hover,html[data-theme="light"] .res-go:focus-visible{color:#fff}

  /* tiny safety access */
  .info-dot{position:fixed;left:50%;bottom:calc(2.4vh + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:8;width:7px;height:7px;border-radius:50%;background:rgba(200,201,204,.3);border:none;cursor:pointer;padding:0;transition:background .3s var(--ease),transform .3s var(--ease)}
  .info-dot:hover,.info-dot:focus-visible{background:rgba(var(--accent-rgb),.8);transform:translateX(-50%) scale(1.3);outline:none}
  .safety-overlay{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:10vw;background:rgba(10,8,6,.92);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:opacity .5s var(--ease),visibility .5s}
  .safety-overlay.on{opacity:1;visibility:visible}
  .safety-card{max-width:34ch;text-align:center;font-weight:400;letter-spacing:.04em;line-height:1.9;font-size:.9rem;color:var(--silver)}
  .safety-card .x{margin-top:1.6em;display:inline-block;font-size:.72rem;font-weight:500;letter-spacing:.3em;text-transform:lowercase;color:var(--accent);opacity:.8;cursor:pointer}
  .safety-card .x:hover{opacity:1}
  .safety-links{display:flex;justify-content:center;gap:2.2em}
  .safety-links .x{background:none;border:none;padding:0;font-family:var(--sans)}
  /* privacy notice: the card widens, the text scrolls inside it */
  .safety-card.wide{max-width:min(40rem,100%)}
  /* tall content must never be clipped: the overlay scrolls, the card centres with auto margins (safe centring) */
  .safety-overlay{align-items:flex-start;justify-content:flex-start;overflow-y:auto;padding:max(6vh,1.2rem) max(6vw,1rem)}
  .safety-card{margin:auto}
  .safety-card.wide .privacy{max-height:none;overflow:visible}
  .privacy{margin-top:1.4em;max-height:min(58vh,34rem);overflow-y:auto;padding-inline-end:.4em;text-align:start;font-size:.8rem;line-height:1.75;letter-spacing:.02em}
  .privacy[hidden]{display:none!important}
  /* "translated for information; the English original prevails" — small, but set apart at the top */
  .privacy-note{margin:0 0 1.3em;padding:.55em .85em;border-inline-start:2px solid rgba(var(--accent-rgb),.7);border-radius:4px;
      background:rgba(var(--accent-rgb),.07);font-size:.7rem;line-height:1.6;font-weight:500;color:var(--accent)}
  .privacy-note:empty{display:none}
  .privacy h3{margin:1.5em 0 .35em;font-family:"Cinzel",serif;font-weight:600;font-size:.72rem;letter-spacing:.2em;color:var(--accent)}
  .privacy h3:first-child{margin-top:0}
  .privacy p,.privacy li{color:var(--silver)}
  .privacy ul{margin:.3em 0 0 1.1em}
  .privacy li{margin:.2em 0}
  .privacy .muted{opacity:.7;font-size:.72rem}
  .privacy .ph{color:var(--accent);font-weight:600}


  /* ---------- PAGES: characters · "yakında" placeholders · settings ---------- */
  .page{position:fixed;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;padding:0 6vw;
      background:var(--void);opacity:0;transition:opacity .5s var(--ease)}
  .page.show{opacity:1}
  .page[hidden]{display:none}
  html[data-theme="light"] .page{background:#faf8f5}
  .page .glyph{--w:120px;--h:120px;margin-bottom:.6rem}
  .page .sym-characters{--g:255,236,200;--s:226,229,233}
  .page .sym-characters[hidden]{display:none}
  .page-title{font-family:"Cinzel",serif;font-weight:600;font-size:.9rem;letter-spacing:.42em;padding-left:.42em;color:var(--accent);text-transform:uppercase}
  .page-sub{font-size:.72rem;font-weight:500;letter-spacing:.34em;padding-left:.34em;color:var(--silver);opacity:.8}
  .page-back{position:absolute;top:calc(2.4vh + env(safe-area-inset-top));left:calc(4vw + env(safe-area-inset-left));background:none;border:none;cursor:pointer;
      font-size:1.5rem;line-height:1;padding:.4em;color:var(--silver);transition:color .3s var(--ease)}
  .page-back:hover,.page-back:focus-visible{color:var(--accent);outline:none}
  .set-rows{display:flex;flex-direction:column;gap:1.4rem;margin-top:1.2rem;width:min(100%,20rem)}
  .set-row{display:flex;align-items:center;justify-content:space-between;gap:1rem}
  .set-label{font-size:.68rem;font-weight:500;letter-spacing:.3em;color:var(--silver);opacity:.75}
  .seg{display:flex;gap:1.1rem}
  .seg button{background:none;border:none;cursor:pointer;padding:.3em 0;font-family:var(--sans);font-size:.78rem;font-weight:500;letter-spacing:.14em;color:var(--silver);opacity:.55;transition:color .3s var(--ease),opacity .3s var(--ease)}
  .seg button:hover,.seg button:focus-visible{opacity:.9;outline:none}
  .seg button.is-on{color:var(--accent);opacity:1}
  .set-row{flex-wrap:wrap}
  .set-sep{height:1px;margin:.4rem 0;background:linear-gradient(90deg,transparent,rgba(var(--accent-rgb),.25),transparent)}
  .set-code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.76rem;letter-spacing:.08em;color:var(--accent);user-select:all}
  .set-input{width:13.5rem;max-width:100%;background:transparent;border:none;border-bottom:1px solid rgba(var(--accent-rgb),.35);padding:.35em 0;
      font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--stone)}
  .set-input:focus{outline:none;border-bottom-color:var(--accent)}
  .set-input::placeholder{color:var(--silver);opacity:.45}
  .set-hint{font-size:.64rem;line-height:1.6;letter-spacing:.06em;color:var(--silver);opacity:.7;text-align:center}
  .set-note{min-height:1.3em;font-size:.68rem;letter-spacing:.1em;color:var(--accent);text-align:center}

  /* ---------- NAVIGATION: icon rail (desktop) · tab bar (mobile) ---------- */
  .nav-item{position:relative;display:grid;place-items:center;width:40px;height:40px;background:none;border:none;border-radius:10px;cursor:pointer;padding:0;
      color:var(--silver);opacity:.5;transition:color .3s var(--ease),opacity .3s var(--ease),filter .3s var(--ease)}
  .nav-item svg{width:20px;height:20px}
  .nav-item:hover,.nav-item:focus-visible,.nav-item.is-active{color:var(--accent);opacity:1;outline:none}
  .nav-item.is-active{filter:drop-shadow(0 0 6px rgba(var(--accent-rgb),.45))}
  .rail{position:fixed;left:0;top:0;bottom:0;z-index:16;width:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:calc(2.6vh + env(safe-area-inset-top)) 0 calc(2.6vh + env(safe-area-inset-bottom));background:linear-gradient(to right,rgba(10,8,6,.35),rgba(10,8,6,0))}
  .rail-main{display:flex;flex-direction:column;gap:.9rem}
  .rail .nav-signin{position:absolute;bottom:calc(2.6vh + env(safe-area-inset-bottom))}
  /* hover tooltip — the only text the rail ever shows */
  .rail .nav-item::after{content:attr(data-tip);position:absolute;left:calc(100% + 8px);top:50%;transform:translate(-4px,-50%);white-space:nowrap;pointer-events:none;
      font-family:var(--sans);font-size:.64rem;font-weight:500;letter-spacing:.18em;color:var(--silver);background:rgba(10,8,6,.82);padding:.4em .75em;border-radius:6px;
      opacity:0;transition:opacity .3s var(--ease),transform .3s var(--ease)}
  .rail .nav-item:hover::after,.rail .nav-item:focus-visible::after{opacity:1;transform:translate(0,-50%)}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:16;display:none;justify-content:space-around;align-items:center;
      padding:.5rem 4vw calc(.5rem + env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(10,8,6,.88),rgba(10,8,6,0))}
  .tabbar .nav-item{width:48px;height:44px}
  .tabbar .nav-item svg{width:22px;height:22px}
  .more-sheet{position:fixed;right:4vw;bottom:calc(4.4rem + env(safe-area-inset-bottom));z-index:17;display:flex;flex-direction:column;padding:.45rem;border-radius:14px;
      background:rgba(18,14,10,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 14px 40px rgba(0,0,0,.5);animation:rise .3s var(--ease) both}
  .more-sheet[hidden]{display:none}
  .sheet-item{display:flex;align-items:center;gap:.85rem;padding:.7rem 1rem;background:none;border:none;border-radius:10px;cursor:pointer;text-align:left;
      font-family:var(--sans);font-size:.8rem;font-weight:500;letter-spacing:.08em;color:var(--silver);transition:color .3s var(--ease)}
  .sheet-item svg{width:18px;height:18px;opacity:.7}
  .sheet-item:hover,.sheet-item:focus-visible,.sheet-item.is-active{color:var(--accent);outline:none}
  html[data-theme="light"] .rail{background:linear-gradient(to right,rgba(250,248,245,.7),rgba(250,248,245,0))}
  html[data-theme="light"] .rail .nav-item::after{background:rgba(250,247,240,.95);box-shadow:0 4px 14px rgba(70,52,32,.12)}
  html[data-theme="light"] .tabbar{background:linear-gradient(to top,rgba(250,248,245,.94),rgba(250,248,245,0))}
  html[data-theme="light"] .more-sheet{background:rgba(250,247,240,.97);box-shadow:0 14px 40px rgba(70,52,32,.16)}
  @media (min-width:720px){
    .sym-row{--m:min(clamp(120px,22vh,175px),16.5vw)}
    .page-back{left:calc(64px + 3vw)}
    .tabbar,.more-sheet{display:none!important}
  }
  @media (max-width:719px){
    .rail{display:none}
    .tabbar{display:flex}
    .theme-toggle{display:none}  /* theme + accent live in Settings (More) on phones */
    #threshold{padding-bottom:calc(10vh + 4rem)}
    #resume{padding-bottom:calc(7vh + 4.4rem + env(safe-area-inset-bottom))}
    .info-dot{bottom:calc(4.6rem + env(safe-area-inset-bottom))}
  }

  /* ---------- CHAT ---------- */
  #chat{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:var(--c-bg);color:var(--c-fg);opacity:0;transition:opacity .5s ease}
  #chat.show{opacity:1}
  #chat[hidden]{display:none}
  .chat-bg{position:absolute;inset:0;z-index:0;pointer-events:none}
  #chat[data-persona="archon"]{--c-bg:#0a0806;--c-fg:#cdd9da;--c-accent:#7bd3d6;--c-user-bg:rgba(123,211,214,.08);--c-user-fg:#dbe7e8;--c-user-br:rgba(123,211,214,.2);--c-bot-fg:#e3eeef;--c-bot-bg:rgba(255,255,255,.02);--c-head:#9fb1b2;--c-br:rgba(123,211,214,.18);--c-input-bg:rgba(255,255,255,.03);--c-place:#5c7375}
  #chat[data-persona="archon"] .chat-bg{background:radial-gradient(90% 55% at 50% 0%,rgba(123,211,214,.07),transparent 60%)}
  #chat[data-persona="multivac"]{--c-bg:#f4efe4;--c-fg:#2c2820;--c-accent:#c99a3f;--c-user-bg:#ffffff;--c-user-fg:#2c2820;--c-user-br:rgba(0,0,0,.08);--c-bot-fg:#3a3327;--c-bot-bg:rgba(201,154,63,.07);--c-head:#6b5f45;--c-br:rgba(201,154,63,.3);--c-input-bg:#ffffff;--c-place:#a99a7c}
  #chat[data-persona="multivac"] .chat-bg{background:radial-gradient(85% 55% at 50% 0%,rgba(255,224,150,.28),transparent 62%)}

  .chat-head{display:flex;align-items:center;justify-content:space-between;gap:.6em;padding:.85em clamp(.8em,3vw,1.4em);border-bottom:1px solid var(--c-br);position:relative;z-index:2}
  .icobtn{background:none;border:none;color:var(--c-head);cursor:pointer;padding:.4em;display:grid;place-items:center;border-radius:6px;line-height:0}
  .icobtn svg{width:20px;height:20px}
  .icobtn:hover,.icobtn:focus-visible{color:var(--c-accent)}
  .back-arrow{font-size:1.4rem;line-height:1}
  .who-glyph{width:24px;height:24px;display:grid;place-items:center}
  .mini-beam{display:block;width:2px;height:22px;margin:0 auto;background:linear-gradient(to bottom,transparent,#fff 50%,transparent);box-shadow:0 0 8px rgba(215,240,243,.7)}
  .mini-cloud{display:block;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle,#f0c070 0%,rgba(225,165,80,.55) 35%,transparent 70%)}
  body.speaking .who-glyph{animation:spk 1s ease-in-out infinite}
  @keyframes spk{0%,100%{transform:scale(1);filter:none}50%{transform:scale(1.16);filter:drop-shadow(0 0 6px var(--c-accent))}}
  .glyph-mv{display:none}
  #chat[data-persona="multivac"] .glyph-arc{display:none}
  #chat[data-persona="multivac"] .glyph-mv{display:block}

  .messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:.7em;padding:1.2em clamp(.8em,3vw,1.4em) 1.4em;position:relative;z-index:2}
  .msg{max-width:84%;padding:.72em 1em;line-height:1.55;white-space:pre-wrap;font-size:.95rem;animation:msgIn .5s ease}
  .msg.user{align-self:flex-end;background:var(--c-user-bg);color:var(--c-user-fg);border:1px solid var(--c-user-br);border-radius:14px 14px 4px 14px}
  .msg.bot{align-self:flex-start;color:var(--c-bot-fg);background:var(--c-bot-bg);border-left:2px solid var(--c-accent);border-radius:4px 14px 14px 4px}
  @keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .msg.thinking{display:inline-flex;gap:5px;align-items:center;padding:.9em 1em}
  .msg.thinking span{width:6px;height:6px;border-radius:50%;background:var(--c-accent);opacity:.3;animation:td 1.2s infinite}
  .msg.thinking span:nth-child(2){animation-delay:.18s}.msg.thinking span:nth-child(3){animation-delay:.36s}
  @keyframes td{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

  .composer{display:flex;gap:.6em;align-items:flex-end;padding:.8em clamp(.8em,3vw,1.4em) calc(.8em + env(safe-area-inset-bottom));border-top:1px solid var(--c-br);background:var(--c-bg);position:relative;z-index:2}
  #input{flex:1;resize:none;height:2.7em;max-height:8em;padding:.62em .85em;border-radius:12px;border:1px solid var(--c-br);background:var(--c-input-bg);color:var(--c-fg);font-family:var(--sans);font-size:.95rem;line-height:1.4}
  #input::placeholder{color:var(--c-place)}#input:focus{outline:1px solid var(--c-accent)}
  #send{width:2.9em;height:2.7em;border-radius:12px;border:1px solid var(--c-br);background:transparent;color:var(--c-accent);font-size:1.2rem;cursor:pointer;flex:none;transition:all .3s ease}
  #send:hover:not(:disabled){background:var(--c-accent);color:var(--c-bg)}#send:disabled{opacity:.4;cursor:default}

  /* ---------- PREMIUM CHAT SKINS (same in light and dark) ----------
     Archon: sapphire light falling into blue-black, with a faint drift of stardust.
     Multivac: champagne and gold, luminous from above, with slow gold dust. */
  #chat[data-persona="archon"]{--c-bg:#04060c;--c-fg:#dbe4f4;--c-accent:#a9c4ff;--c-user-bg:linear-gradient(135deg,rgba(64,104,200,.3),rgba(18,32,74,.42));--c-user-fg:#f0f4ff;
      --c-user-br:rgba(150,180,255,.26);--c-bot-fg:#e4eaf7;--c-bot-bg:linear-gradient(90deg,rgba(120,150,230,.09),rgba(120,150,230,0) 85%);--c-head:#8d9bb8;--c-br:rgba(140,170,255,.13);
      --c-input-bg:rgba(12,20,42,.65);--c-place:#5d6b89;--c-sheen:rgba(190,212,255,.16);--c-glass:rgba(4,6,12,.62)}
  #chat[data-persona="archon"] .chat-bg{background:radial-gradient(42% 70% at 50% -12%,rgba(150,185,255,.22),transparent 70%),radial-gradient(75% 50% at 50% -8%,rgba(40,84,196,.5),transparent 72%),
      radial-gradient(60% 50% at 0% 100%,rgba(14,38,110,.55),transparent 70%),radial-gradient(55% 45% at 100% 78%,rgba(22,44,120,.42),transparent 70%),
      linear-gradient(180deg,#070c1c 0%,#04060d 55%,#020308 100%)}
  #chat[data-persona="archon"] .chat-bg::after{background-image:radial-gradient(1px 1px at 12% 22%,rgba(220,232,255,.7),transparent),radial-gradient(1px 1px at 78% 14%,rgba(220,232,255,.55),transparent),
      radial-gradient(1.5px 1.5px at 64% 46%,rgba(200,220,255,.45),transparent),radial-gradient(1px 1px at 30% 70%,rgba(220,232,255,.5),transparent),radial-gradient(1px 1px at 88% 62%,rgba(220,232,255,.4),transparent),
      radial-gradient(1.5px 1.5px at 44% 88%,rgba(200,220,255,.35),transparent),radial-gradient(1px 1px at 6% 52%,rgba(220,232,255,.45),transparent),radial-gradient(1px 1px at 54% 8%,rgba(220,232,255,.5),transparent)}
  #chat[data-persona="multivac"]{--c-bg:#f5ead6;--c-fg:#2a1f10;--c-accent:#a8782a;--c-user-bg:linear-gradient(135deg,#fffdf8,#fbf1de);--c-user-fg:#2a1f10;--c-user-br:rgba(176,132,52,.3);
      --c-bot-fg:#33270f;--c-bot-bg:linear-gradient(90deg,rgba(212,170,90,.2),rgba(212,170,90,0) 85%);--c-head:#8a6d3b;--c-br:rgba(176,132,52,.2);--c-input-bg:rgba(255,252,245,.82);
      --c-place:#b39a6d;--c-sheen:rgba(255,246,220,.55);--c-glass:rgba(248,238,218,.6)}
  #chat[data-persona="multivac"] .chat-bg{background:radial-gradient(40% 60% at 50% -10%,#fffaf0 0%,rgba(255,250,240,0) 70%),radial-gradient(75% 50% at 50% -6%,rgba(232,186,100,.5),transparent 72%),
      radial-gradient(60% 50% at 0% 100%,rgba(206,160,80,.38),transparent 70%),radial-gradient(55% 45% at 100% 82%,rgba(236,204,150,.65),transparent 70%),
      linear-gradient(180deg,#fbf3e3 0%,#f3e2c2 55%,#e8cf9e 100%)}
  #chat[data-persona="multivac"] .chat-bg::after{background-image:radial-gradient(1.5px 1.5px at 14% 26%,rgba(190,140,50,.55),transparent),radial-gradient(1px 1px at 76% 16%,rgba(190,140,50,.5),transparent),
      radial-gradient(2px 2px at 62% 48%,rgba(212,168,80,.45),transparent),radial-gradient(1px 1px at 32% 72%,rgba(190,140,50,.5),transparent),radial-gradient(1.5px 1.5px at 86% 64%,rgba(212,168,80,.45),transparent),
      radial-gradient(1px 1px at 46% 90%,rgba(190,140,50,.4),transparent),radial-gradient(1.5px 1.5px at 8% 56%,rgba(212,168,80,.45),transparent),radial-gradient(1px 1px at 56% 10%,rgba(190,140,50,.5),transparent)}
  .chat-bg::after{content:"";position:absolute;inset:-10%;animation:dustDrift 38s ease-in-out infinite alternate;opacity:.9}
  @keyframes dustDrift{from{transform:translate3d(0,0,0)}to{transform:translate3d(-2%,-3%,0)}}
  /* opening: the light settles in, a sheen sweeps once across, the name draws together */
  #chat.show .chat-bg{animation:skinIn 1.4s var(--ease) both}
  @keyframes skinIn{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:none}}
  #chat::before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;
      background:linear-gradient(105deg,transparent 35%,var(--c-sheen) 50%,transparent 65%);transform:translateX(-100%)}
  #chat.show::before{animation:sheen 1.9s cubic-bezier(.4,0,.2,1) .25s both}
  @keyframes sheen{0%{opacity:1;transform:translateX(-100%)}100%{opacity:1;transform:translateX(100%)}}
  .who{display:flex;align-items:center;gap:.7em}
  .who-name{font-family:"Cinzel",serif;font-weight:600;font-size:.82rem;letter-spacing:.34em;text-indent:.34em;text-transform:uppercase;
      -webkit-background-clip:text;background-clip:text;color:transparent}
  #chat[data-persona="archon"] .who-name{background-image:linear-gradient(90deg,#9fb8ff,#ffffff 50%,#9fb8ff)}
  #chat[data-persona="multivac"] .who-name{background-image:linear-gradient(90deg,#7d5a18,#c4963a 50%,#7d5a18)}
  #chat[data-persona="multivac"] .who-name .glyph-arc,#chat:not([data-persona="multivac"]) .who-name .glyph-mv{display:none}
  #chat.show .who-name{animation:nameIn 1.5s var(--ease) .15s both}
  @keyframes nameIn{from{opacity:0;letter-spacing:.8em}to{opacity:1;letter-spacing:.34em}}
  #chat .chat-head,#chat .composer{background:var(--c-glass);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2)}
  #chat .msg{font-size:.96rem;line-height:1.62}
  /* the conversation reads as one centred column on wide screens */
  #chat .messages,#chat .composer{padding-inline:max(clamp(.8em,3vw,1.4em),calc((100% - 46rem) / 2))}
  #chat .who-name{font-size:.9rem}
  #chat .msg.user{box-shadow:0 8px 24px rgba(0,0,0,.18)}
  #chat[data-persona="multivac"] .msg.user{box-shadow:0 8px 22px rgba(150,110,40,.12)}
  #chat .msg.bot{padding-inline-start:1.1em}
  #chat #input{border-radius:14px;transition:border-color .3s var(--ease),box-shadow .3s var(--ease)}
  #chat #input:focus{outline:none;border-color:var(--c-accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--c-accent) 18%,transparent)}
  #chat #send{border-radius:14px;border:none}
  #chat[data-persona="archon"] #send{background:linear-gradient(135deg,#4a72dc,#1b2f6e);color:#f2f6ff;box-shadow:0 8px 22px rgba(40,80,210,.35)}
  #chat[data-persona="multivac"] #send{background:linear-gradient(135deg,#f0d384,#b8892f);color:#2a1f10;box-shadow:0 8px 22px rgba(184,137,47,.35)}
  #chat #send:hover:not(:disabled){filter:brightness(1.12);transform:translateY(-1px)}
  #chat[data-persona="archon"] #send:hover:not(:disabled){background:linear-gradient(135deg,#4a72dc,#1b2f6e);color:#f2f6ff}
  #chat[data-persona="multivac"] #send:hover:not(:disabled){background:linear-gradient(135deg,#f0d384,#b8892f);color:#2a1f10}
  #chat[data-persona="multivac"] .mini-cloud{background:radial-gradient(circle,#fffaf0 0%,#e8c06a 38%,rgba(200,150,60,0) 70%)}
  #chat[data-persona="archon"] .mini-beam{box-shadow:0 0 10px rgba(150,185,255,.9)}

  /* ---------- MIRROR ---------- */
  .mirror{--ox:50%;--oy:50%;position:fixed;inset:0;z-index:30;overflow:hidden;background:#010202;clip-path:circle(0% at var(--ox) var(--oy));transition:clip-path 1.25s cubic-bezier(.16,1,.3,1);pointer-events:none}
  .mirror.open{clip-path:circle(150% at var(--ox) var(--oy));pointer-events:auto}
  #cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);filter:brightness(.5) contrast(1.06) saturate(.82);opacity:0;transition:opacity 1.4s ease}
  #cam.pulse{animation:camPulse .8s ease}
  @keyframes camPulse{0%{filter:brightness(.5) contrast(1.06) saturate(.82)}40%{filter:brightness(.7) contrast(1.14) saturate(.92)}100%{filter:brightness(.5) contrast(1.06) saturate(.82)}}
  .m-tint{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 100% at 50% 45%,rgba(35,95,100,.3),rgba(6,20,22,.5) 70%);mix-blend-mode:overlay}
  .m-vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 100% at 50% 42%,transparent 22%,rgba(0,0,0,.72) 68%,#000 100%)}
  /* reveal: after the greeting the veil lifts — filter eases to natural with a faint overshoot bloom */
  #cam{transition:opacity 1.4s ease,filter 3.2s cubic-bezier(.22,.9,.3,1.12)}
  .m-tint,.m-vignette{transition:opacity 3.2s cubic-bezier(.4,0,.2,1)}
  .mirror.clear #cam{filter:none}
  .mirror.clear #cam.pulse{animation:camPulseClear .8s ease}
  @keyframes camPulseClear{0%,100%{filter:none}40%{filter:brightness(1.14) contrast(1.06)}}
  .mirror.clear .m-tint,.mirror.clear .m-vignette{opacity:0}
  .void-note{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%);width:min(80vw,32ch);text-align:center;font-weight:300;font-size:.74rem;letter-spacing:.12em;line-height:1.7;color:var(--whisper);opacity:0;transition:opacity 1s ease}
  .void-note.show{opacity:1}
  .m-speech{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:min(84vw,30ch);text-align:center;font-weight:300;letter-spacing:.02em;line-height:1.55;font-size:clamp(1.12rem,5vw,1.7rem);color:#e8f5f6;text-shadow:0 2px 20px rgba(0,0,0,.92),0 0 30px rgba(0,0,0,.6);min-height:3.2em}
  .mcaret{display:inline-block;width:.5ch;color:var(--spectral);animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .m-bar{position:absolute;top:calc(3.4vh + env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 5vw;z-index:3}
  .m-composer{position:absolute;left:0;right:0;bottom:calc(3vh + env(safe-area-inset-bottom));display:flex;gap:.6em;align-items:center;padding:0 6vw;z-index:3}
  #mInput{flex:1;height:2.7em;padding:.62em .9em;border-radius:20px;border:1px solid rgba(123,211,214,.28);background:rgba(4,10,11,.55);color:#dbe7e8;font-family:var(--sans);font-size:.9rem;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  #mInput::placeholder{color:rgba(123,211,214,.4)}#mInput:focus{outline:1px solid var(--spectral)}
  #mSend{width:2.7em;height:2.7em;border-radius:50%;border:1px solid rgba(123,211,214,.3);background:rgba(4,10,11,.5);color:var(--spectral);font-size:1.1rem;cursor:pointer;flex:none}
  #mSend:hover{background:var(--spectral);color:#02090a}
  .m-icobtn{background:none;border:none;color:var(--whisper);cursor:pointer;padding:.5em;line-height:0;display:grid;place-items:center}
  .m-icobtn svg{width:20px;height:20px}
  .m-icobtn:hover,.m-icobtn:focus-visible{color:var(--spectral)}
  .m-close{font-size:1.5rem;line-height:1}

  /* ---------- PAGES: scrolling layout (profile · history · premium) ---------- */
  .page.page-scroll{justify-content:flex-start;overflow-y:auto;padding:calc(2.4vh + env(safe-area-inset-top) + 3.6rem) 5vw calc(4rem + env(safe-area-inset-bottom))}
  @media (min-width:720px){.page.page-scroll,#characters{padding-inline-start:calc(64px + 5vw)}}
  @media (max-width:719px){.page.page-scroll{padding-bottom:calc(6rem + env(safe-area-inset-bottom))}}

  /* ---------- PROFILE ----------
     A calm page: a wide cover, the portrait half over it with a barely-there halo in its own colours,
     a short blurred mirror of the cover, then the collage page — the body of the profile.
     No borders, frames or card shadows. Dark and light are rendered separately:
     light adds up (screen) in the dark; in daylight there is no blending, colours are deeper and fainter. */
  #profile{padding-top:0;overflow-x:hidden;--av:clamp(118px,30vw,164px);--h1:#cdbf9f;--h2:#b9b3a8;--pf-tint:rgba(205,191,159,.07);--cover-h:62.5vw}
  #profile>*{flex-shrink:0}
  body[data-page="profile"] .rail{background:none}
  #profile .page-back{z-index:4}
  .pf-cover{position:absolute;z-index:0;top:0;left:0;width:100%;aspect-ratio:16/10;max-height:70vh;overflow:hidden;pointer-events:none;
      -webkit-mask-image:linear-gradient(to bottom,#000 62%,rgba(0,0,0,.6) 84%,transparent 100%);mask-image:linear-gradient(to bottom,#000 62%,rgba(0,0,0,.6) 84%,transparent 100%)}
  @media (min-width:720px){.pf-cover{aspect-ratio:21/9;max-height:62vh}}
  .pf-layer{position:absolute;inset:0;opacity:0;transition:opacity .6s var(--ease)}
  .pf-layer.on{opacity:1}
  .pf-layer img,.pf-layer canvas{position:absolute;max-width:none;display:block}
  /* short mirror under the cover: ~260px, blur 50px, 28% */
  .pf-reflect{position:absolute;z-index:0;left:0;right:0;top:calc(var(--cover-h) - 50px);height:330px;pointer-events:none}
  .pf-reflect canvas{position:absolute;left:-8%;width:116%;top:0;height:100%;filter:blur(50px);opacity:0;transition:opacity .6s var(--ease);
      -webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 16%,rgba(0,0,0,.45) 52%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0%,#000 16%,rgba(0,0,0,.45) 52%,transparent 100%)}
  .pf-reflect canvas.on{opacity:.28}
  .pf-reflect canvas.now{transition:none}
  :root:not([data-theme="light"]) .pf-reflect canvas{mix-blend-mode:screen}

  /* the portrait's halo: a warm core (1.3×, blur 28px, 14%), a wider reflection (2.4×, blur 80px, 8%, lifted toward the cover),
     a whisper of white (5%); breathing 7s within ±5% */
  .pf-halo{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none}
  .pf-halo span{position:absolute;z-index:1;left:0;top:0;border-radius:50%;opacity:var(--o);animation:pfBreath 7s var(--ease) infinite}
  .pf-halo .h-core{--o:.14;width:calc(var(--d) * 1.3);height:calc(var(--d) * 1.3);margin:calc(var(--d) * -.65) 0 0 calc(var(--d) * -.65);background:radial-gradient(circle,var(--h1) 0%,transparent 70%);filter:blur(28px)}
  .pf-halo .h-out{--o:.08;width:calc(var(--d) * 2.4);height:calc(var(--d) * 2.4);margin:calc(var(--d) * -1.38) 0 0 calc(var(--d) * -1.2);background:radial-gradient(circle,var(--h2) 0%,transparent 70%);filter:blur(80px);animation-delay:-2.3s}
  .pf-halo .h-white{--o:.05;width:calc(var(--d) * .9);height:calc(var(--d) * .9);margin:calc(var(--d) * -.45) 0 0 calc(var(--d) * -.45);background:radial-gradient(circle,#fffaf0 0%,transparent 70%);filter:blur(18px);animation-delay:-4.6s}
  @keyframes pfBreath{0%,100%{opacity:calc(var(--o) * .95)}50%{opacity:calc(var(--o) * 1.05)}}
  :root:not([data-theme="light"]) .pf-halo span{mix-blend-mode:screen}
  html[data-theme="light"] .pf-halo .h-core{--o:.07}
  html[data-theme="light"] .pf-halo .h-out{--o:.04}
  html[data-theme="light"] .pf-halo .h-white{--o:.025}

  .pf-head{position:relative;z-index:2;width:min(100%,36rem);display:flex;flex-direction:column;align-items:center;text-align:center;
      margin-top:calc(var(--cover-h) - var(--av) / 2)}
  .pf-avatar-wrap{position:relative;width:var(--av);height:var(--av)}
  .pf-avatar{position:absolute;inset:0;border:none;padding:0;margin:0;border-radius:50%;overflow:hidden;cursor:pointer;background:none;color:inherit;
      -webkit-mask-image:radial-gradient(circle closest-side,#000 86%,transparent 100%);mask-image:radial-gradient(circle closest-side,#000 86%,transparent 100%)}
  .pf-avatar img{position:absolute;max-width:none;display:block}
  .pf-avatar:focus{outline:none}
  .pf-avatar-wrap:has(.pf-avatar:focus-visible)::after{content:"";position:absolute;inset:-6px;border-radius:50%;box-shadow:0 0 0 2px var(--accent);pointer-events:none}
  .pf-avatar-ph{position:absolute;inset:24%;color:#dcd2bf;opacity:.8}
  html[data-theme="light"] .pf-avatar-ph{color:#8c8170}
  .pf-avatar-ph svg,.char-ph svg{width:100%;height:100%;fill:currentColor}
  .prof-name{margin-top:1rem;width:min(100%,24rem);background:none;border:none;text-align:center;padding:.1em 0;
      font-family:"Cinzel",Georgia,serif;font-weight:600;font-size:clamp(1.45rem,4.6vw,2rem);letter-spacing:.1em;color:var(--stone);
      box-shadow:0 1px 0 transparent;transition:box-shadow .4s var(--ease)}
  .prof-name::placeholder{color:var(--silver);opacity:.4}
  .prof-name:focus{outline:none;box-shadow:0 1px 0 rgba(var(--accent-rgb),.35)}
  .prof-ai{display:flex;align-items:center;gap:.5em;margin-top:.35rem;font-size:.72rem;font-weight:500;letter-spacing:.18em;color:var(--accent)}
  .prof-ai-star{font-size:.7em;opacity:.8}
  .pf-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:0 1.2rem;margin-top:.5rem}
  .pf-link{min-height:44px;padding:0 .4rem;background:none;border:none;cursor:pointer;font-family:var(--sans);font-size:.76rem;font-weight:500;letter-spacing:.08em;color:var(--accent);opacity:.88;transition:opacity .3s var(--ease)}
  .pf-link:hover{opacity:1}
  .pf-link:focus{outline:none}
  .pf-link:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
  .pf-link[hidden]{display:none}
  .bd-picker{display:flex;flex-direction:column;align-items:center;gap:.6rem;margin-top:.9rem;width:100%}
  .bd-label{font-size:.64rem;font-weight:500;letter-spacing:.28em;color:var(--silver);opacity:.75}
  .bd-swatches{display:flex;flex-wrap:wrap;justify-content:center;gap:.7rem;max-width:100%;padding:.3rem .2rem .6rem}
  .bd-links{display:flex;flex-wrap:wrap;justify-content:center;gap:0 1.4rem}
  .bd-swatch{position:relative;flex:none;width:26px;height:26px;border-radius:50%;border:none;padding:0;cursor:pointer;background:var(--sw);background-size:cover;background-position:center;transition:transform .4s var(--ease)}
  .bd-swatch::before{content:"";position:absolute;inset:-9px}
  .bd-swatch::after{content:"";position:absolute;left:50%;bottom:-9px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent);opacity:0;transition:opacity .4s var(--ease)}
  .bd-swatch.is-on{transform:scale(1.18)}
  .bd-swatch.is-on::after{opacity:1}
  .bd-swatch:focus{outline:none}
  .bd-swatch:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .bd-swatch[hidden]{display:none}
  @media (hover:hover){.bd-swatch:hover{transform:scale(1.12)}}

  .sh-opt{display:flex;flex-direction:column;align-items:center;gap:.3rem;min-height:44px;padding:.45rem .2rem;border:none;border-radius:14px;background:none;cursor:pointer;color:var(--stone);font-family:var(--sans);font-size:.6rem;line-height:1.2;text-align:center}

  /* ---------- CHAT HISTORY: Archon | Multivac ---------- */
  .hist{width:min(100%,62rem);display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1.6rem}
  @media (max-width:719px){.hist{grid-template-columns:1fr}}
  .hist-col{--h-bg:#0a0806;--h-fg:#cdd9da;--h-accent:#7bd3d6;--h-br:rgba(123,211,214,.2);--h-sub:#7d9192;
      min-height:16rem;border-radius:18px;padding:1.1rem 1rem 1.2rem;background:var(--h-bg);color:var(--h-fg);border:1px solid var(--h-br)}
  .hist-archon{background:radial-gradient(90% 60% at 50% 0%,rgba(123,211,214,.08),transparent 60%),var(--h-bg)}
  .hist-multivac{--h-bg:#f4efe4;--h-fg:#2c2820;--h-accent:#a87a22;--h-br:rgba(201,154,63,.35);--h-sub:#7a6c50;

  html[data-theme="light"] .hist-archon{--h-bg:#eef2f1;--h-fg:#1f2b2c;--h-accent:#276e73;--h-br:rgba(39,110,115,.22);--h-sub:#5d7173;
      background:radial-gradient(90% 60% at 50% 0%,rgba(39,110,115,.09),transparent 60%),var(--h-bg)}
  .hist-head{display:flex;align-items:center;gap:.6rem;padding:0 .3rem .9rem;border-bottom:1px solid var(--h-br)}
  .hist-glyph{width:24px;height:24px;display:grid;place-items:center}
  .hist-name{font-family:"Cinzel",serif;font-weight:600;letter-spacing:.24em;font-size:.86rem;color:var(--h-accent);flex:1}
  .hist-new{background:none;border:1px solid var(--h-br);border-radius:999px;padding:.35em .9em;cursor:pointer;font-family:var(--sans);font-size:.7rem;font-weight:500;letter-spacing:.08em;color:var(--h-accent);transition:background .3s var(--ease)}

  @media (hover:none){.hist-more{opacity:.85}}
  .hist-more:hover,.hist-more:focus-visible{color:var(--h-accent);background:var(--h-br);outline:none}
  .hist-item{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  .row-menu{position:fixed;z-index:48;min-width:12rem;padding:.35rem;border-radius:14px;background:rgba(18,14,10,.96);border:1px solid rgba(var(--accent-rgb),.25);
      box-shadow:0 18px 50px rgba(0,0,0,.45);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}

  .hist-rename{flex:1;min-width:0;margin:.55rem .75rem;padding:.2em 0;background:transparent;border:none;border-bottom:1px solid var(--h-accent);color:var(--h-fg);font-family:var(--sans);font-size:.9rem}
  .hist-rename:focus{outline:none}
  .hist-title{font-size:.9rem;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .hist-meta{font-size:.68rem;letter-spacing:.06em;color:var(--h-sub)}
  .hist-empty{padding:1.4rem .75rem;font-size:.8rem;color:var(--h-sub)}
  .hist-multivac .mini-cloud{background:radial-gradient(circle,#f0c070 0%,rgba(225,165,80,.55) 35%,transparent 70%)}
  .hist-archon .mini-beam{background:linear-gradient(to bottom,transparent,var(--h-accent) 50%,transparent);box-shadow:0 0 8px var(--h-br)}

  /* full-screen split: the screen is divided down the middle — Archon's half | Multivac's half */
  #history{padding:0;flex-direction:row;align-items:stretch;justify-content:stretch;overflow:hidden}
  #history .page-title{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  #history .hist{width:100%;max-width:none;height:100%;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:0}
  #history .hist-col{display:flex;flex-direction:column;min-height:0;height:100%;border:none;border-radius:0;
      padding:calc(2.4vh + env(safe-area-inset-top) + 3.8rem) clamp(1rem,4vw,3.4rem) calc(2rem + env(safe-area-inset-bottom))}
  /* each half wears its AI's own colours: Archon's night aura (indigo · violet · wine · deep teal around a white-blue beam),
     Multivac's luminous gold orb inside its pastel halo */
  #history .hist-archon{--h-bg:#04060d;--h-fg:#dfe7f6;--h-accent:#b4cbff;--h-br:rgba(140,170,255,.18);--h-sub:#8794b2;position:relative;isolation:isolate;
      background:radial-gradient(42% 60% at 50% -10%,rgba(150,185,255,.2),transparent 70%),radial-gradient(75% 45% at 50% -6%,rgba(40,84,196,.48),transparent 72%),
      radial-gradient(70% 50% at 0% 100%,rgba(14,38,110,.55),transparent 70%),radial-gradient(60% 50% at 100% 70%,rgba(22,44,120,.4),transparent 70%),
      linear-gradient(180deg,#070c1c,#03050b)}
  #history .hist-multivac{--h-bg:#0f0b06;--h-fg:#f5e9cf;--h-accent:#e8c87e;--h-br:rgba(232,200,126,.2);--h-sub:#b5a07a;
      background:radial-gradient(40% 60% at 50% -10%,rgba(255,240,205,.28),transparent 70%),radial-gradient(75% 45% at 50% -6%,rgba(214,168,80,.45),transparent 72%),
      radial-gradient(70% 50% at 0% 100%,rgba(150,105,40,.4),transparent 70%),radial-gradient(60% 50% at 100% 70%,rgba(230,200,150,.16),transparent 70%),
      linear-gradient(180deg,#17110a,#0b0805)}
  #history .hist-archon .mini-beam{background:linear-gradient(to bottom,transparent,#ffffff 50%,transparent);box-shadow:0 0 8px rgba(190,205,255,.8)}
  #history .hist-multivac .mini-cloud{background:radial-gradient(circle,#fffaf0 0%,#f0c070 40%,rgba(225,165,80,0) 70%)}
  #history .hist-head{flex-wrap:wrap;row-gap:.6rem}
  #history .hist-name{font-size:clamp(.9rem,1.6vw,1.15rem)}
  #history .hist-list{flex:1;max-height:none;min-height:0;overflow-y:auto}
  #history .page-back{color:#e2e3f8}
  html[dir="rtl"] #history .page-back{color:#f3e8d2}
  @media (min-width:720px){#history .hist-archon{padding-inline-start:calc(64px + 3vw)}html[dir="rtl"] #history .hist-archon{padding-inline-start:clamp(1rem,4vw,3.4rem)}html[dir="rtl"] #history .hist-multivac{padding-inline-start:calc(64px + 3vw)}}
  @media (max-width:719px){#history .hist-col{padding-bottom:calc(5.5rem + env(safe-area-inset-bottom))}#history .hist-new{font-size:.64rem;padding:.3em .7em}}
  body[data-page="history"] .rail,body[data-page="history"] .tabbar{background:none}
  /* the history screen is always dark, so its menu icons stay light even in the light theme */

  html[data-theme="light"] body[data-page="history"] .nav-item:hover,html[data-theme="light"] body[data-page="history"] .nav-item:focus-visible,html[data-theme="light"] body[data-page="history"] .nav-item.is-active{color:var(--accent);opacity:1}
  html[data-theme="light"] body[data-page="history"] .rail .nav-item::after{background:rgba(10,12,22,.92);color:#e6ecf8;box-shadow:0 4px 14px rgba(0,0,0,.4)}

  /* ---------- PREMIUM ---------- */
  .tiers{width:min(100%,64rem);display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-top:2rem;align-items:stretch}

  .tier{position:relative;display:flex;flex-direction:column;gap:.9rem;padding:1.6rem 1.3rem 1.3rem;border-radius:18px;border:1px solid rgba(var(--accent-rgb),.2);background:rgba(var(--accent-rgb),.035)}
  .tier.is-featured{border-color:rgba(var(--accent-rgb),.85);background:linear-gradient(180deg,rgba(var(--accent-rgb),.14),rgba(var(--accent-rgb),.04));box-shadow:0 0 0 1px rgba(var(--accent-rgb),.35),0 18px 50px rgba(var(--accent-rgb),.16);transform:translateY(-6px)}

  .tier-price span{font-family:var(--sans);font-size:.75rem;font-weight:500;color:var(--silver);opacity:.75;margin-inline-start:.2em}
  .tier-feats{list-style:none;display:flex;flex-direction:column;gap:.55rem;flex:1}

  .tier-feats li.tier-plus{color:var(--silver);font-size:.76rem}

  .tier-cta{margin-top:.4rem;height:2.7rem;border-radius:12px;border:1px solid rgba(var(--accent-rgb),.5);background:transparent;color:var(--accent);font-family:var(--sans);font-size:.78rem;font-weight:500;letter-spacing:.1em;cursor:not-allowed;opacity:.85}

      padding:0 0 1.2rem;border-radius:20px;cursor:pointer;border:1px solid rgba(var(--accent-rgb),.22);

      background:radial-gradient(circle at 50% 40%,hsla(var(--hue),40%,60%,.35),hsla(var(--hue),30%,40%,.12));color:hsla(var(--hue),35%,75%,.55)}

  <!-- ================= NAVIGATION ================= -->

  <!-- ================= CHAT ================= -->
  <section id="chat" data-persona="archon" hidden>
    <div class="chat-bg"></div>
    <header class="chat-head">
      <button class="icobtn back-arrow" id="back" data-i18n-attr="aria-label:aria.back">‹</button>
      <div class="who">
        <div class="who-glyph">
          <span class="glyph-arc"><i class="mini-beam"></i></span>
          <span class="glyph-mv"><i class="mini-cloud"></i></span>
        </div>
        <span class="who-name" lang="en"><span class="glyph-arc">Archon</span><span class="glyph-mv">Multivac</span></span>
      </div>

  <!-- ================= MIRROR ================= -->
  <div class="mirror" id="mirror" aria-hidden="true">
    <video id="cam" autoplay muted playsinline></video>
    <div class="m-tint"></div>

    <p class="m-speech" id="speech" dir="auto"></p>

      <button class="m-icobtn m-close" id="mClose" data-i18n-attr="aria-label:aria.close">×</button>
      <button class="m-icobtn" id="mMute" data-i18n-attr="aria-label:aria.sound"></button>
    </div>
    <div class="m-composer">
      <input id="mInput" placeholder="…" autocomplete="off" maxlength="4000" dir="auto">
      <button id="mSend" data-i18n-attr="aria-label:aria.send">→</button>
