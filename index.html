      <button class="nav-item" data-nav="settings" data-icon="settings" data-i18n-attr="data-tip:nav.settings;aria-label:nav.settings"></button>
    </div>
    <button class="nav-item nav-signin" data-nav="signin" data-icon="login" data-i18n-attr="data-tip:nav.signin;aria-label:nav.signin"></button>
  </nav>
  <nav class="tabbar" data-i18n-attr="aria-label:aria.menu">
    <button class="nav-item" data-nav="home" data-icon="home" data-i18n-attr="aria-label:nav.home"></button>
    <button class="nav-item" data-nav="chat" data-icon="message" data-i18n-attr="aria-label:nav.chat"></button>
    <button class="nav-item" data-nav="mix" data-icon="shuffle" data-i18n-attr="aria-label:nav.mix"></button>
    <button class="nav-item" data-nav="more" data-icon="dots" data-i18n-attr="aria-label:aria.more" aria-expanded="false"></button>
  </nav>
  <div class="more-sheet" id="moreSheet" hidden>
    <button class="sheet-item" data-nav="profile" data-icon="user"><span data-i18n="nav.profile"></span></button>
    <button class="sheet-item" data-nav="premium" data-icon="crown"><span data-i18n="nav.premium"></span></button>
    <button class="sheet-item" data-nav="create" data-icon="userPlus"><span data-i18n="nav.create"></span></button>
    <button class="sheet-item" data-nav="settings" data-icon="settings"><span data-i18n="nav.settings"></span></button>
    <button class="sheet-item" data-nav="signin" data-icon="login"><span data-i18n="nav.signin"></span></button>
  </div>

  <!-- ================= CHAT ================= -->
  <section id="chat" data-persona="archon" hidden>
    <div class="chat-bg"></div>
    <header class="chat-head">
      <button class="icobtn back-arrow" id="back" data-i18n-attr="aria-label:aria.back">‹</button>
      <div class="who-glyph">
        <span class="glyph-arc"><i class="mini-beam"></i></span>
        <span class="glyph-mv"><i class="mini-cloud"></i></span>
      </div>
      <button class="icobtn" id="mute" data-i18n-attr="aria-label:aria.sound"></button>
    </header>
    <div class="messages" id="messages"></div>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="…" maxlength="4000" dir="auto"></textarea>
      <button id="send" data-i18n-attr="aria-label:aria.send">→</button>
    </div>
  </section>

  <!-- ================= MIRROR ================= -->
  <div class="mirror" id="mirror" aria-hidden="true">
    <video id="cam" autoplay muted playsinline></video>
    <div class="m-tint"></div>
    <div class="m-vignette"></div>
    <p class="void-note" id="voidNote"></p>
    <p class="m-speech" id="speech" dir="auto"></p>
    <div class="m-bar">
      <button class="m-icobtn m-close" id="mClose" data-i18n-attr="aria-label:aria.close">×</button>
      <button class="m-icobtn" id="mMute" data-i18n-attr="aria-label:aria.sound"></button>
    </div>
    <div class="m-composer">
      <input id="mInput" placeholder="…" autocomplete="off" maxlength="4000" dir="auto">
      <button id="mSend" data-i18n-attr="aria-label:aria.send">→</button>
    </div>
  </div>

<script>
(function(){
  /* ============ BRAINS ============ */
  const t=i18n.t;
  i18n.apply();



  // greetings and the Mirror's offline lines come from i18n.js (current UI language)
  const greet=p=>t("greet."+p);
  const mirrorFallback=()=>t("mirror.fallback");

  const $=id=>document.getElementById(id);
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const threshold=$("threshold"),chat=$("chat"),messages=$("messages"),input=$("input"),
        sendBtn=$("send"),backBtn=$("back"),muteBtn=$("mute");
  let persona=null,api=[],busy=false,muted=true;

  /* ---- API ---- */
  async function ask(p,history){
    // Karakter promptları sunucuda (api/chat.js); tarayıcı sadece hangi karakter olduğunu gönderir
    // sunucu en fazla 40 mesaj kabul eder; son kısmı gönder, kullanıcı mesajıyla başlasın
    const msgs=history.slice(-40);while(msgs.length&&msgs[0].role!=="user")msgs.shift();
    const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({persona:p,messages:msgs,code:p==="mirror"?undefined:syncCode(true),lang:i18n.lang()})});
    if(!r.ok){const e=new Error("HTTP "+r.status);e.status=r.status;throw e;}
    const d=await r.json();
    if(!d||!d.text)throw new Error("empty");
    return {text:d.text,lang:d.lang||null};
  }

  /* ---- VOICE (browser stand-in; ElevenLabs androjen sesler prod'da yerine geçecek) ---- */
  const synth=window.speechSynthesis;let voices=[];
  function loadVoices(){try{voices=synth?synth.getVoices():[];}catch(e){voices=[];}}
  if(synth){loadVoices();synth.addEventListener&&synth.addEventListener("voiceschanged",loadVoices);}
  // characters answer in the user's language, so choose the voice from the text itself
  function guessLang(text){
    if(/[ğışİĞŞ]/.test(text))return "tr";
    if(/[äßÄ]/.test(text))return "de";
    if(/[\u3040-\u30ff\u4e00-\u9faf]/.test(text))return "ja";
    if(/[çöüÇÖÜ]/.test(text)&&i18n.lang()==="tr")return "tr";
    return "en";
  }
  function pickVoice(lang){if(!voices.length)loadVoices();const re=new RegExp("^"+lang+"\\b|^"+lang+"[-_]","i");return voices.find(v=>re.test(v.lang))||voices.find(v=>/^en/i.test(v.lang))||voices[0]||null;}
  // Web Speech API SSML desteklemiyor; Türkçe ses özel isimleri harf harf okumasın diye
  // İngilizce okunuşlarını Türkçe yazımla veriyoruz (yalnızca seslendirilen metinde, ekrandaki yazı aynı kalır)
  const SAY_AS=[[/\barchon\b/gi,"Arkon"],[/\bmultivac\b/gi,"Maltivek"]];
  function speakable(text,lang){return /^tr/i.test(lang)?SAY_AS.reduce((t,[re,s])=>t.replace(re,s),text):text;}
  // langHint: the reply language reported by the server (or the UI language for greetings)
  function speak(text,mode,langHint){
    if(muted||!synth)return;try{synth.cancel();}catch(e){}
    const want=langHint?String(langHint).split("-")[0]:guessLang(text),v=pickVoice(want),lang=(v&&v.lang)||want;
    const u=new SpeechSynthesisUtterance(mode==="archon"||mode==="multivac"?speakable(text,lang):text);if(v)u.voice=v;u.lang=lang;
    u.pitch=mode==="archon"?0.9:(mode==="multivac"?1.08:1.0);u.rate=mode==="archon"?0.92:0.95;
    u.onstart=()=>document.body.classList.add("speaking");u.onend=()=>document.body.classList.remove("speaking");
    synth.speak(u);
  }
  function stopSpeak(){try{synth&&synth.cancel();}catch(e){}document.body.classList.remove("speaking");}
  const ICON_ON="<svg viewBox='0 0 24 24'><path d='M4 9v6h4l5 4V5L8 9H4z' fill='currentColor'/><path d='M16 8.5a4.5 4.5 0 010 7' fill='none' stroke='currentColor' stroke-width='1.6' stroke-linecap='round'/></svg>";
  const ICON_OFF="<svg viewBox='0 0 24 24'><path d='M4 9v6h4l5 4V5L8 9H4z' fill='currentColor'/><line x1='16' y1='9' x2='22' y2='15' stroke='currentColor' stroke-width='1.6' stroke-linecap='round'/><line x1='22' y1='9' x2='16' y2='15' stroke='currentColor' stroke-width='1.6' stroke-linecap='round'/></svg>";
  function updateMuteIcons(){const h=muted?ICON_OFF:ICON_ON;muteBtn.innerHTML=h;$("mMute").innerHTML=h;}
  function setMuted(m){muted=m;updateMuteIcons();if(m)stopSpeak();}
  updateMuteIcons();
  muteBtn.addEventListener("click",()=>setMuted(!muted));
  $("mMute").addEventListener("click",()=>setMuted(!muted));

  /* ---- HOME + conversations ---- */
  const brandBtn=$("brand"),inviteEl=$("invite");
  const K_VISIT="erebiel-last-visit",K_CHATS="erebiel-chats",K_CHAT_OLD="erebiel-last-chat",NAMES={archon:"Archon",multivac:"Multivac"};
  const MAX_CHATS=40;
  function load(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
  function store(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}
  store(K_VISIT,Date.now());
  // every conversation is kept in this browser as {id, persona, api, ts}; the server keeps each persona's latest (sync code)
  function newId(){return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8);}
  function validConv(c){return c&&NAMES[c.persona]&&Array.isArray(c.api)&&c.api.length&&c.id;}
  function loadChats(){const l=load(K_CHATS);return Array.isArray(l)?l.filter(validConv):[];}
  function saveChats(list){list.sort((a,b)=>b.ts-a.ts);store(K_CHATS,list.slice(0,MAX_CHATS));}
  (function migrate(){const old=load(K_CHAT_OLD);if(old&&NAMES[old.persona]&&Array.isArray(old.api)&&old.api.length){const l=loadChats();if(!l.length)saveChats([{id:newId(),persona:old.persona,api:old.api,ts:old.ts||Date.now()}]);}try{localStorage.removeItem(K_CHAT_OLD);}catch(e){}})();
  // keep the tail of the conversation; the API needs it to start with a user turn
  function saveChat(id,p,hist){const h=hist.slice(-40);while(h.length&&h[0].role!=="user")h.shift();if(!h.length)return;const l=loadChats().filter(c=>c.id!==id);l.push({id,persona:p,api:h,ts:Date.now()});saveChats(l);}
  function lastChat(){return loadChats()[0]||null;}
  function chatsFor(p){return loadChats().filter(c=>c.persona===p);}

  /* ---- server history, keyed by a private sync code (Crockford base32, 20 chars ≈ 100 bits) ---- */
  const K_SYNC="erebiel-sync-code",CODE_ABC="0123456789ABCDEFGHJKMNPQRSTVWXYZ";
  function genCode(){const b=crypto.getRandomValues(new Uint8Array(20));let s="";for(const x of b)s+=CODE_ABC[x&31];return s.match(/.{4}/g).join("-");}
  function normCode(v){const s=String(v||"").toUpperCase().replace(/[^0-9A-Z]/g,"").replace(/O/g,"0").replace(/[IL]/g,"1");return /^[0-9A-HJKMNP-TV-Z]{20}$/.test(s)?s.match(/.{4}/g).join("-"):null;}
  function syncCode(create){let c=load(K_SYNC);if(!normCode(c))c=null;if(!c&&create){c=genCode();store(K_SYNC,c);}return c;}
  async function historyCall(code,action){
    const r=await fetch("/api/history",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code,action})});
    if(!r.ok){const e=new Error("HTTP "+r.status);e.status=r.status;throw e;}
    return r.json();
  }
  function newestOf(chats){let best=null;for(const p of Object.keys(NAMES)){const c=chats&&chats[p];if(c&&Array.isArray(c.api)&&c.api.length&&(!best||c.ts>best.ts))best={persona:p,api:c.api,ts:c.ts};}return best;}
  const firstUser=api=>(api.find(m=>m.role==="user")||{}).content||"";
  // merge the server's latest conversation per persona into the local list (replace: the list becomes the server's copy)
  async function pullHistory(code,replace){
    const {chats}=await historyCall(code,"get");
    let list=replace?[]:loadChats();
    for(const p of Object.keys(NAMES)){
      const c=chats&&chats[p];if(!c||!Array.isArray(c.api)||!c.api.length)continue;
      const same=list.find(x=>x.persona===p&&firstUser(x.api)===firstUser(c.api));
      if(same){if(c.ts>same.ts){same.api=c.api;same.ts=c.ts;}}
      else list.push({id:"srv-"+p+"-"+c.ts,persona:p,api:c.api,ts:c.ts});
    }
    saveChats(list);
    return newestOf(chats);
  }
  function onHome(){return chat.hidden&&threshold.style.display!=="none";}
  function ago(ts){const s=Math.max(0,(Date.now()-ts)/1000);if(s<60)return t("ago.now");const m=Math.floor(s/60);if(m<60)return t("ago.min",{n:m});const h=Math.floor(m/60);if(h<24)return h===1?t("ago.hour1"):t("ago.hours",{n:h});const d=Math.floor(h/24);return d===1?t("ago.yesterday"):t("ago.days",{n:d});}
  function showHome(){
    document.body.classList.remove("compact");
    threshold.style.display="";brandBtn.hidden=false;inviteEl.hidden=false;
  }
  // wordmark → replay the opening
  brandBtn.addEventListener("click",()=>{threshold.style.animation="none";void threshold.offsetWidth;threshold.style.animation="";showHome();});
  showHome();
  // quietly merge the server copy (another device may have newer chats)
  (async()=>{const code=syncCode(false);if(!code)return;try{await pullHistory(code,false);}catch(e){return;}if(!historyEl.hidden)renderHistory();})();

  /* ---- CHAT ---- */
  function addBubble(role,text){const d=document.createElement("div");d.className="msg "+(role==="user"?"user":"bot");d.dir="auto";d.textContent=text;messages.appendChild(d);messages.scrollTop=messages.scrollHeight;return d;}
  function addThinking(){const d=document.createElement("div");d.className="msg bot thinking";d.innerHTML="<span></span><span></span><span></span>";messages.appendChild(d);messages.scrollTop=messages.scrollHeight;return d;}
  // conv: a stored conversation {id, api} to reopen; otherwise a fresh one
  let convId=null;
  function enterChat(p,conv){
    persona=p;convId=conv?conv.id:newId();api=conv?conv.api.slice():[];busy=false;chat.setAttribute("data-persona",p);input.value="";messages.innerHTML="";
    addBubble("bot",greet(p));
    if(conv)conv.api.forEach(m=>addBubble(m.role,m.content));
    threshold.style.display="none";inviteEl.hidden=true;brandBtn.hidden=true;chat.hidden=false;requestAnimationFrame(()=>chat.classList.add("show"));
    setTimeout(()=>input.focus(),80);if(!conv)speak(greet(p),p,i18n.lang());
  }
  // back from a chat: home, or the history list if the chat was opened from there
  function backToGate(){stopSpeak();chat.classList.remove("show");setTimeout(()=>{chat.hidden=true;showHome();if(!historyEl.hidden)renderHistory();},reduce?0:400);persona=null;api=[];convId=null;messages.innerHTML="";}
  async function send(){
    const text=input.value.trim();if(!text||busy||!persona)return;
    const p=persona,hist=api,id=convId;
    stopSpeak();input.value="";input.style.height="2.7em";addBubble("user",text);hist.push({role:"user",content:text});saveChat(id,p,hist);
    busy=true;sendBtn.disabled=true;const think=addThinking();
    try{const {text:reply,lang:replyLang}=await ask(p,hist);think.remove();hist.push({role:"assistant",content:reply});saveChat(id,p,hist);if(api===hist){addBubble("bot",reply);speak(reply,p,replyLang);}}
    catch(e){think.remove();addBubble("bot",t((e.status===429?"err.rate.":"err.net.")+(persona==="archon"?"archon":"multivac")));console.error(e);}
    finally{busy=false;sendBtn.disabled=false;input.focus();}
  }

  /* ---- MIRROR (twin brain, ephemeral) ---- */
  const mirror=$("mirror"),cam=$("cam"),speech=$("speech"),voidNote=$("voidNote"),mInput=$("mInput"),mSendBtn=$("mSend");
  let stream=null,mApi=[],mBusy=false,mFallback=false,mFbTimer=null,mFbOrder=[],mFbIdx=0,mGreetTimer=null;
  const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  function pulseCam(){cam.classList.remove("pulse");void cam.offsetWidth;cam.classList.add("pulse");}
  // drop the dim filter, tint and vignette so the reflection comes through clean (pulse is cleared first so its keyframes don't fight the transition)
  function revealCam(){if(mirror.classList.contains("clear"))return;cam.classList.remove("pulse");mirror.classList.add("clear");}
  function typeSpeech(text){return new Promise(res=>{speech.style.transition="opacity .5s ease";speech.style.opacity=1;let i=0;(function step(){if(i<=text.length){speech.innerHTML=text.slice(0,i)+'<span class="mcaret">▍</span>';i++;setTimeout(step,reduce?0:40+Math.random()*46);}else{speech.innerHTML=text+'<span class="mcaret">▍</span>';res();}})();});}
  function fadeSpeech(){return new Promise(res=>{if(!speech.textContent){res();return;}speech.style.opacity=0;setTimeout(()=>{speech.textContent="";res();},reduce?0:520);});}
  async function mShow(text,lang){pulseCam();await fadeSpeech();await typeSpeech(text);speak(text,"mirror",lang);}
  function mWaiting(){speech.style.opacity=1;speech.innerHTML='<span class="mcaret">▍</span>';}

  async function fbNext(){
    if(!mirror.classList.contains("open")||!mFallback)return;
    const lines=mirrorFallback(),line=lines[mFbOrder[mFbIdx%mFbOrder.length]%lines.length];mFbIdx++;
    await mShow(line);
    mFbTimer=setTimeout(()=>{if(mirror.classList.contains("open")&&mFallback)fbNext();},reduce?800:4400);
  }
  function startFallback(){mFallback=true;mFbOrder=shuffle([...Array(mirrorFallback().length).keys()]);mFbIdx=0;fbNext();}

  async function openMirror(){
    const b=$("mirrorBtn").querySelector(".glyph").getBoundingClientRect();
    mirror.style.setProperty("--ox",((b.left+b.width/2)/innerWidth*100).toFixed(1)+"%");
    mirror.style.setProperty("--oy",((b.top+b.height/2)/innerHeight*100).toFixed(1)+"%");
    mirror.setAttribute("aria-hidden","false");
    try{
      if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw 0;
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});
      cam.srcObject=stream;cam.style.opacity=1;voidNote.classList.remove("show");
    }catch(e){
      cam.style.opacity=0;voidNote.textContent=t("mirror.dark");voidNote.classList.add("show");
    }
    requestAnimationFrame(()=>mirror.classList.add("open"));
    mApi=[];mFallback=false;mBusy=true;clearTimeout(mFbTimer);clearTimeout(mGreetTimer);mirror.classList.remove("clear");cam.classList.remove("pulse");
    setTimeout(()=>input&&null,0);
    // sabit giriş cümlesi; sonra yazı yavaşça kaybolur ve geriye yalnızca yansıma kalır
    try{await mShow(greet("mirror"),i18n.lang());}
    finally{mBusy=false;}
    mGreetTimer=setTimeout(()=>{if(mirror.classList.contains("open")){fadeSpeech();revealCam();}},reduce?800:2600);
  }
  async function mSend(){
    const t=mInput.value.trim();if(!t||mBusy)return;mInput.value="";clearTimeout(mGreetTimer);revealCam();
    if(mFallback){const lines=mirrorFallback(),line=lines[Math.floor(Math.random()*lines.length)];await mShow(line);return;}
    mApi.push({role:"user",content:t});mBusy=true;mWaiting();
    try{const {text:line,lang:lineLang}=await ask("mirror",mApi);mApi.push({role:"assistant",content:line});await mShow(line,lineLang);}
    catch(e){startFallback();}
    finally{mBusy=false;}
  }
  function closeMirror(){
    stopSpeak();mirror.classList.remove("open");clearTimeout(mFbTimer);clearTimeout(mGreetTimer);mFallback=false;
    if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;cam.srcObject=null;}
    cam.style.opacity=0;
    setTimeout(()=>{mirror.setAttribute("aria-hidden","true");mirror.classList.remove("clear");cam.classList.remove("pulse");speech.textContent="";voidNote.classList.remove("show");mApi=[];},reduce?0:1200);
  }

  /* ---- THEME ---- */
  const root=document.documentElement,themeBtn=$("themeToggle");
  function applyTheme(t){
    const light=t==="light";
    if(light)root.setAttribute("data-theme","light");else root.removeAttribute("data-theme");
    document.querySelector('meta[name="color-scheme"]').content=light?"light":"dark";
    document.querySelector('meta[name="theme-color"]').content=light?"#faf8f5":"#0a0806";
    themeBtn.setAttribute("aria-pressed",String(light));
  }
  applyTheme(root.getAttribute("data-theme")==="light"?"light":"dark");
  function setTheme(t){applyTheme(t);try{localStorage.setItem("archon-theme",t);}catch(e){}syncSettings();}
  themeBtn.addEventListener("click",()=>setTheme(root.getAttribute("data-theme")==="light"?"dark":"light"));

  /* ---- ACCENT (Gold / Silver) ---- */
  const accentBtn=$("accentToggle");
  function applyAccent(a){
    const silver=a==="silver";
    if(silver)root.setAttribute("data-accent","silver");else root.removeAttribute("data-accent");
    accentBtn.setAttribute("aria-pressed",String(silver));accentBtn.setAttribute("aria-label",t("aria.accent",{c:t(silver?"silver":"gold")}));
  }
  applyAccent(root.getAttribute("data-accent"));
  function setAccent(a){applyAccent(a);try{localStorage.setItem("erebiel-accent",a);}catch(e){}syncSettings();}
  accentBtn.addEventListener("click",()=>setAccent(root.getAttribute("data-accent")==="silver"?"gold":"silver"));


  /* ---- PAGES + NAVIGATION ---- */
  // Tabler outline icons (MIT), stroke-only so they take currentColor
  const ICONS={
    user:'<path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"/><path d="M9 10a3 3 0 1 0 6 0a3 3 0 1 0 -6 0"/><path d="M6.168 18.849a4 4 0 0 1 3.832 -2.849h4a4 4 0 0 1 3.834 2.855"/>',
    home:'<path d="M5 12l-2 0l9 -9l9 9l-2 0"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-7"/><path d="M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v6"/>',
    crown:'<path d="M12 6l4 6l5 -4l-2 10h-14l-2 -10l5 4z"/>',
    userPlus:'<path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0"/><path d="M16 19h6"/><path d="M19 16v6"/><path d="M6 21v-2a4 4 0 0 1 4 -4h4"/>',
    message:'<path d="M3 20l1.3 -3.9c-2.324 -3.437 -1.426 -7.872 2.1 -10.374c3.526 -2.501 8.59 -2.296 11.845 .48c3.255 2.777 3.695 7.266 1.029 10.501c-2.666 3.235 -7.615 4.215 -11.574 2.293l-4.7 1"/>',
    shuffle:'<path d="M18 4l3 3l-3 3"/><path d="M18 20l3 -3l-3 -3"/><path d="M3 7h3a5 5 0 0 1 5 5a5 5 0 0 0 5 5h5"/><path d="M21 7h-5a4.978 4.978 0 0 0 -3 1m-4 8a4.984 4.984 0 0 1 -3 1h-3"/>',
    settings:'<path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065z"/><path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"/>',
    login:'<path d="M15 8v-2a2 2 0 0 0 -2 -2h-7a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2 -2v-2"/><path d="M21 12h-13l3 -3"/><path d="M11 15l-3 -3"/>',
    dots:'<path d="M4 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"/><path d="M11 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"/><path d="M18 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"/>'
  };
  document.querySelectorAll("[data-icon]").forEach(el=>el.insertAdjacentHTML("afterbegin",'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICONS[el.getAttribute("data-icon")]+'</svg>'));

  const soonEl=$("soon"),settingsEl=$("settings"),moreSheet=$("moreSheet"),moreBtn=document.querySelector('.tabbar [data-nav="more"]');
  const profileEl=$("profile"),historyEl=$("history"),premiumEl=$("premium"),charactersEl=$("characters");
  const PAGES=[...document.querySelectorAll(".page")];
  let soonKey=null;
  const IN_MORE=["profile","premium","create","settings","signin"];
  function setActive(k){
    document.querySelectorAll("[data-nav]").forEach(el=>{const n=el.getAttribute("data-nav");el.classList.toggle("is-active",n===k||(n==="more"&&IN_MORE.includes(k)));});
  }
  function openPage(el){
    PAGES.forEach(p=>{if(p!==el){p.classList.remove("show");p.hidden=true;}});
    el.hidden=false;requestAnimationFrame(()=>el.classList.add("show"));document.body.dataset.page=el.id;
  }
  function openPageAnyOpen(){return PAGES.some(p=>!p.hidden);}
  function closePages(){delete document.body.dataset.page;PAGES.forEach(p=>{if(p.hidden)return;p.classList.remove("show");setTimeout(()=>{if(!p.classList.contains("show"))p.hidden=true;},reduce?0:500);});setActive("home");}
  function openSoon(key){soonKey=key;$("soonTitle").textContent=t("page."+key);$("soonGlyph").hidden=key!=="characters";openPage(soonEl);}
  function syncSettings(){
    $("syncCodeText").textContent=syncCode(false)||t("settings.noCode");
    $("langPicker").value=i18n.lang();
    const light=root.getAttribute("data-theme")==="light",silver=root.getAttribute("data-accent")==="silver";
    document.querySelectorAll("[data-set-theme]").forEach(b=>b.classList.toggle("is-on",(b.getAttribute("data-set-theme")==="light")===light));
    document.querySelectorAll("[data-set-accent]").forEach(b=>b.classList.toggle("is-on",(b.getAttribute("data-set-accent")==="silver")===silver));
  }
  function toggleMore(open){const o=open===undefined?moreSheet.hidden:open;moreSheet.hidden=!o;moreBtn.setAttribute("aria-expanded",String(o));}
  function navGo(k){
    if(k==="more"){toggleMore();return;}
    toggleMore(false);
    if(k==="home"){closePages();showHome();return;}
    if(k==="chat"){renderHistory();openPage(historyEl);}
    else if(k==="profile"){renderProfile();openPage(profileEl);}
    else if(k==="premium")openPage(premiumEl);
    else if(k==="settings"){syncSettings();openPage(settingsEl);}
    else openSoon(k);
    setActive(k);
  }
  document.querySelectorAll("[data-nav]").forEach(el=>el.addEventListener("click",e=>{e.stopPropagation();navGo(el.getAttribute("data-nav"));}));
  document.addEventListener("click",e=>{if(!moreSheet.hidden&&!moreSheet.contains(e.target))toggleMore(false);});
  document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",closePages));
  document.querySelectorAll("[data-set-theme]").forEach(b=>b.addEventListener("click",()=>setTheme(b.getAttribute("data-set-theme"))));
  document.querySelectorAll("[data-set-accent]").forEach(b=>b.addEventListener("click",()=>setAccent(b.getAttribute("data-set-accent"))));
  $("langPicker").innerHTML=i18n.supported.map(l=>`<option value="${l}" lang="${l}">${i18n.nativeName(l)}</option>`).join("");
  $("langPicker").addEventListener("change",e=>i18n.setLang(e.target.value));
  // static text is re-applied by i18n.setLang; refresh the pieces built in JS
  document.addEventListener("i18n:change",()=>{
    applyAccent(root.getAttribute("data-accent"));syncSettings();
    if(soonKey)$("soonTitle").textContent=t("page."+soonKey);
    privacyBtn.textContent=t(privacyEl.hidden?"safety.privacy":"safety.hidePrivacy");
    if(!historyEl.hidden)renderHistory();
  });
  $("charactersBtn").addEventListener("click",()=>{openPage(charactersEl);setActive("");});
  // the Premium title is the English word in Latin-script languages; mark it so Turkish casing doesn't turn it into "PREMİUM"
  function markPremiumTitle(){const el=$("premiumTitle");if(/^[a-z]+$/i.test(el.textContent))el.lang="en";else el.removeAttribute("lang");}
  markPremiumTitle();document.addEventListener("i18n:change",markPremiumTitle);

  /* ---- TOAST ---- */
  const toastEl=$("toast");let toastTimer=null;
  function toast(msg){toastEl.textContent=msg;toastEl.classList.add("on");clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove("on"),2200);}

  /* ---- CHARACTERS: placeholder cards ---- */
  charactersEl.querySelectorAll(".char-card").forEach(c=>c.addEventListener("click",()=>toast(t("soon"))));

  /* ---- CHAT HISTORY: Archon | Multivac ---- */
  function renderHistory(){
    for(const [p,listEl] of [["archon",$("histArchon")],["multivac",$("histMultivac")]]){
      listEl.innerHTML="";
      const convs=chatsFor(p);
      if(!convs.length){const li=document.createElement("li");li.className="hist-empty";li.textContent=t("history.empty");listEl.appendChild(li);continue;}
      for(const c of convs){
        const li=document.createElement("li"),b=document.createElement("button"),title=document.createElement("span"),meta=document.createElement("span");
        b.className="hist-item";title.className="hist-title";meta.className="hist-meta";title.dir="auto";
        title.textContent=firstUser(c.api).replace(/\s+/g," ").trim()||"…";
        meta.textContent=ago(c.ts)+" · "+t("history.messages",{n:c.api.length});
        b.append(title,meta);b.addEventListener("click",()=>enterChat(p,c));li.appendChild(b);listEl.appendChild(li);
      }
    }
  }
  historyEl.querySelectorAll("[data-new]").forEach(b=>b.addEventListener("click",()=>enterChat(b.getAttribute("data-new"))));

  /* ---- PROFILE (kept on this device only) ---- */
  const K_PROFILE="erebiel-profile",profNote=$("profNote"),profileBd=$("profBackdrop");let visionTimer=null,profNoteTimer=null;
  const BG_COLORS={};document.querySelectorAll(".bd-swatch").forEach(b=>{BG_COLORS[b.dataset.bg]=b.style.getPropertyValue("--sw");});
  function profNoteSay(msg){profNote.textContent=msg;clearTimeout(profNoteTimer);profNoteTimer=setTimeout(()=>{profNote.textContent="";},2500);}
  function getProfile(){const p=load(K_PROFILE);return p&&typeof p==="object"?p:{};}
  function renderProfile(){
    const p=getProfile(),photo=p.bg==="photo"&&p.cover,color=BG_COLORS[p.bg]||BG_COLORS.gold;
    profileEl.style.setProperty("--bd",color);
    profileBd.classList.toggle("has-photo",!!photo);
    if(photo){$("bdImg").src=p.cover;$("bdReflect").src=p.cover;}
    document.querySelectorAll(".bd-swatch").forEach(b=>b.classList.toggle("is-on",!photo&&(p.bg||"gold")===b.dataset.bg));
    $("coverBtn").classList.toggle("is-on",!!photo);
    $("avatarImg").hidden=!p.avatar;if(p.avatar)$("avatarImg").src=p.avatar;
    $("avatarPh").hidden=!!p.avatar;
    if(document.activeElement!==$("visionInput"))$("visionInput").value=p.vision||"";
  }
  function saveProfile(patch){const p=Object.assign(getProfile(),patch);return store(K_PROFILE,p);}
  // shrink before storing: browser storage is small (backdrop ≤1400px wide, portrait 480px square crop)
  function fileToDataUrl(file,kind){
    return new Promise((resolve,reject)=>{
      if(!file||!/^image\//.test(file.type)){reject(new Error("type"));return;}
      const url=URL.createObjectURL(file),img=new Image();
      img.onload=()=>{
        let sx=0,sy=0,sw=img.naturalWidth,sh=img.naturalHeight,w,hh;
        if(kind==="avatar"){const s=Math.min(sw,sh);sx=(sw-s)/2;sy=(sh-s)/2;sw=sh=s;w=hh=Math.min(480,s);}
        else{const k=Math.min(1,1400/sw);w=Math.round(sw*k);hh=Math.round(sh*k);}
        const c=document.createElement("canvas");c.width=w;c.height=hh;c.getContext("2d").drawImage(img,sx,sy,sw,sh,0,0,w,hh);
        URL.revokeObjectURL(url);resolve(c.toDataURL("image/jpeg",0.85));
      };
      img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("decode"));};
      img.src=url;
    });
  }
  for(const kind of ["cover","avatar"]){
    const btn=$(kind+"Btn"),file=$(kind+"File");
    btn.addEventListener("click",()=>file.click());
    file.addEventListener("change",async()=>{
      const f=file.files&&file.files[0];file.value="";if(!f)return;
      try{
        const data=await fileToDataUrl(f,kind);
        const ok=kind==="cover"?saveProfile({cover:data,bg:"photo"}):saveProfile({avatar:data});
        if(!ok){profNoteSay(t("profile.tooLarge"));return;}
        renderProfile();profNoteSay(t("profile.saved"));
      }catch(e){profNoteSay(t("profile.tooLarge"));}
    });
  }
  // a colour swatch replaces the photo backdrop (the photo is kept, so "choose photo" is one tap back… only if re-picked)
  document.querySelectorAll(".bd-swatch").forEach(b=>b.addEventListener("click",()=>{saveProfile({bg:b.dataset.bg});renderProfile();}));
  $("visionInput").addEventListener("input",()=>{clearTimeout(visionTimer);visionTimer=setTimeout(()=>{if(saveProfile({vision:$("visionInput").value}))profNoteSay(t("profile.saved"));},500);});
  syncSettings();setActive("home");

  /* ---- SETTINGS: sync code + history ---- */
  const syncNote=$("syncNote");let noteTimer=null,deleteArmed=null;
  function note(t){syncNote.textContent=t;clearTimeout(noteTimer);noteTimer=setTimeout(()=>{syncNote.textContent="";},5000);}
  function afterHistoryChange(){syncSettings();if(!historyEl.hidden)renderHistory();}
  $("syncCopy").addEventListener("click",async()=>{
    const code=syncCode(false);if(!code){note(t("note.noCode"));return;}
    try{await navigator.clipboard.writeText(code);note(t("note.copied"));}catch(e){note(t("note.copyFailed"));}
  });
  async function applyCode(){
    const code=normCode($("syncInput").value);
    if(!code){note(t("note.invalid"));return;}
    note(t("note.loading"));
    try{
      const best=await pullHistory(code,true);
      store(K_SYNC,code);$("syncInput").value="";afterHistoryChange();
      note(best?t("note.loaded",{name:NAMES[best.persona]}):t("note.empty"));
    }catch(e){note(t(e.status===429?"note.tooMany":"note.loadFailed"));}
  }
  $("syncApply").addEventListener("click",applyCode);
  $("syncInput").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();applyCode();}});
  $("historyDelete").addEventListener("click",async()=>{
    const btn=$("historyDelete");
    if(!deleteArmed){btn.textContent=t("settings.deleteConfirm");deleteArmed=setTimeout(()=>{deleteArmed=null;btn.textContent=t("settings.delete");},4000);return;}
    clearTimeout(deleteArmed);deleteArmed=null;btn.textContent=t("settings.delete");
    const code=syncCode(false);
    try{if(code)await historyCall(code,"delete");}catch(e){note(t("note.deleteFailed"));return;}
    try{localStorage.removeItem(K_CHATS);}catch(e){}
    afterHistoryChange();note(t("note.deleted"));
  });

  /* ---- SAFETY ---- */
  $("infoDot").addEventListener("click",()=>$("safety").classList.add("on"));
  const privacyEl=$("privacy"),privacyBtn=$("privacyToggle"),safetyCard=document.querySelector(".safety-card");
  function setPrivacy(open){privacyEl.hidden=!open;safetyCard.classList.toggle("wide",open);privacyBtn.textContent=t(open?"safety.hidePrivacy":"safety.privacy");privacyBtn.setAttribute("aria-expanded",String(open));if(open)privacyEl.scrollTop=0;}
  privacyBtn.addEventListener("click",()=>setPrivacy(privacyEl.hidden));
  $("safetyClose").addEventListener("click",()=>{$("safety").classList.remove("on");setPrivacy(false);});

  /* ---- wiring ---- */
  document.querySelectorAll("#threshold [data-persona]").forEach(el=>el.addEventListener("click",()=>enterChat(el.getAttribute("data-persona"))));
  $("mirrorBtn").addEventListener("click",openMirror);
  $("mClose").addEventListener("click",closeMirror);
  backBtn.addEventListener("click",backToGate);
  sendBtn.addEventListener("click",send);
  mSendBtn.addEventListener("click",mSend);
  input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}});
  mInput.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();mSend();}});
  input.addEventListener("input",()=>{input.style.height="2.7em";input.style.height=Math.min(input.scrollHeight,128)+"px";});
  document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(mirror.classList.contains("open"))closeMirror();else if(!moreSheet.hidden)toggleMore(false);else if(openPageAnyOpen())closePages();else if($("safety").classList.contains("on")){$("safety").classList.remove("on");setPrivacy(false);}}});
})();
</script>
</body>
</html>
