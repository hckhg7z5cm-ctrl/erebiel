<script>
(function(){
  /* ============ BRAINS ============ */
  const t=i18n.t;
  i18n.apply();



  // greetings and the Mirror's offline lines come from i18n.js (current UI language)
  const greet=p=>t("greet."+p);
  const mirrorFallback=()=>t("mirror.fallback");

  const $=id=>document.getElementById(id);
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const threshold=$("threshold"),chat=$("chat"),messages=$("messages"),input=$("input"),
        sendBtn=$("send"),backBtn=$("back"),muteBtn=$("mute");
  let persona=null,api=[],busy=false,muted=true;

  /* ---- API ---- */
  async function ask(p,history){
    // Karakter promptları sunucuda (api/chat.js); tarayıcı sadece hangi karakter olduğunu gönderir
    // sunucu en fazla 40 mesaj kabul eder; son kısmı gönder, kullanıcı mesajıyla başlasın
    const msgs=history.slice(-40);while(msgs.length&&msgs[0].role!=="user")msgs.shift();
    const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({persona:p,messages:msgs,code:p==="mirror"?undefined:syncCode(true),lang:i18n.lang()})});
    if(!r.ok){const e=new Error("HTTP "+r.status);e.status=r.status;throw e;}
    const d=await r.json();
    if(!d||!d.text)throw new Error("empty");
    return {text:d.text,lang:d.lang||null};
  }

  /* ---- VOICE (browser stand-in; ElevenLabs androjen sesler prod'da yerine geçecek) ---- */
  const synth=window.speechSynthesis;let voices=[];
  function loadVoices(){try{voices=synth?synth.getVoices():[];}catch(e){voices=[];}}
  if(synth){loadVoices();synth.addEventListener&&synth.addEventListener("voiceschanged",loadVoices);}
  // characters answer in the user's language, so choose the voice from the text itself
  function guessLang(text){
    if(/[ğışİĞŞ]/.test(text))return "tr";
    if(/[äßÄ]/.test(text))return "de";
    if(/[\u3040-\u30ff\u4e00-\u9faf]/.test(text))return "ja";
    if(/[çöüÇÖÜ]/.test(text)&&i18n.lang()==="tr")return "tr";
    return "en";
  }
  function pickVoice(lang){if(!voices.length)loadVoices();const re=new RegExp("^"+lang+"\\b|^"+lang+"[-_]","i");return voices.find(v=>re.test(v.lang))||voices.find(v=>/^en/i.test(v.lang))||voices[0]||null;}
  // Web Speech API SSML desteklemiyor; Türkçe ses özel isimleri harf harf okumasın diye
  // İngilizce okunuşlarını Türkçe yazımla veriyoruz (yalnızca seslendirilen metinde, ekrandaki yazı aynı kalır)
  const SAY_AS=[[/\barchon\b/gi,"Arkon"],[/\bmultivac\b/gi,"Maltivek"]];
  function speakable(text,lang){return /^tr/i.test(lang)?SAY_AS.reduce((t,[re,s])=>t.replace(re,s),text):text;}
  // langHint: the reply language reported by the server (or the UI language for greetings)
  function speak(text,mode,langHint){
    if(muted||!synth)return;try{synth.cancel();}catch(e){}
    const want=langHint?String(langHint).split("-")[0]:guessLang(text),v=pickVoice(want),lang=(v&&v.lang)||want;
    const u=new SpeechSynthesisUtterance(mode==="archon"||mode==="multivac"?speakable(text,lang):text);if(v)u.voice=v;u.lang=lang;
    u.pitch=mode==="archon"?0.9:(mode==="multivac"?1.08:1.0);u.rate=mode==="archon"?0.92:0.95;
    u.onstart=()=>document.body.classList.add("speaking");u.onend=()=>document.body.classList.remove("speaking");
    synth.speak(u);
  }
  function stopSpeak(){try{synth&&synth.cancel();}catch(e){}document.body.classList.remove("speaking");}
  const ICON_ON="<svg viewBox='0 0 24 24'><path d='M4 9v6h4l5 4V5L8 9H4z' fill='currentColor'/><path d='M16 8.5a4.5 4.5 0 010 7' fill='none' stroke='currentColor' stroke-width='1.6' stroke-linecap='round'/></svg>";
  const ICON_OFF="<svg viewBox='0 0 24 24'><path d='M4 9v6h4l5 4V5L8 9H4z' fill='currentColor'/><line x1='16' y1='9' x2='22' y2='15' stroke='currentColor' stroke-width='1.6' stroke-linecap='round'/><line x1='22' y1='9' x2='16' y2='15' stroke='currentColor' stroke-width='1.6' stroke-linecap='round'/></svg>";
  function updateMuteIcons(){const h=muted?ICON_OFF:ICON_ON;muteBtn.innerHTML=h;$("mMute").innerHTML=h;}
  function setMuted(m){muted=m;updateMuteIcons();if(m)stopSpeak();}
  updateMuteIcons();
  muteBtn.addEventListener("click",()=>setMuted(!muted));
  $("mMute").addEventListener("click",()=>setMuted(!muted));

  /* ---- HOME + conversations ---- */
  const brandBtn=$("brand"),inviteEl=$("invite");
  const K_VISIT="erebiel-last-visit",K_CHATS="erebiel-chats",K_CHAT_OLD="erebiel-last-chat",NAMES={archon:"Archon",multivac:"Multivac"};
  const MAX_CHATS=40,K_GONE="erebiel-chats-deleted";
  function load(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
  function store(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}
  store(K_VISIT,Date.now());
  // every conversation is kept in this browser as {id, persona, api, ts}; the server keeps each persona's latest (sync code)
  function newId(){return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8);}
  function validConv(c){return c&&NAMES[c.persona]&&Array.isArray(c.api)&&c.api.length&&c.id;}
  function loadChats(){const l=load(K_CHATS);return Array.isArray(l)?l.filter(validConv):[];}
  function saveChats(list){list.sort((a,b)=>b.ts-a.ts);store(K_CHATS,list.slice(0,MAX_CHATS));}
  (function migrate(){const old=load(K_CHAT_OLD);if(old&&NAMES[old.persona]&&Array.isArray(old.api)&&old.api.length){const l=loadChats();if(!l.length)saveChats([{id:newId(),persona:old.persona,api:old.api,ts:old.ts||Date.now()}]);}try{localStorage.removeItem(K_CHAT_OLD);}catch(e){}})();
  // keep the tail of the conversation; the API needs it to start with a user turn
  function saveChat(id,p,hist){const h=hist.slice(-40);while(h.length&&h[0].role!=="user")h.shift();if(!h.length)return;const all=loadChats(),prev=all.find(c=>c.id===id),l=all.filter(c=>c.id!==id);const conv={id,persona:p,api:h,ts:Date.now()};if(prev&&prev.title)conv.title=prev.title;l.push(conv);saveChats(l);}
  function lastChat(){return loadChats()[0]||null;}
  function chatsFor(p){return loadChats().filter(c=>c.persona===p);}

  /* ---- server history, keyed by a private sync code (Crockford base32, 20 chars ≈ 100 bits) ---- */
  const K_SYNC="erebiel-sync-code",CODE_ABC="0123456789ABCDEFGHJKMNPQRSTVWXYZ";
  function genCode(){const b=crypto.getRandomValues(new Uint8Array(20));let s="";for(const x of b)s+=CODE_ABC[x&31];return s.match(/.{4}/g).join("-");}
  function normCode(v){const s=String(v||"").toUpperCase().replace(/[^0-9A-Z]/g,"").replace(/O/g,"0").replace(/[IL]/g,"1");return /^[0-9A-HJKMNP-TV-Z]{20}$/.test(s)?s.match(/.{4}/g).join("-"):null;}
  function syncCode(create){let c=load(K_SYNC);if(!normCode(c))c=null;if(!c&&create){c=genCode();store(K_SYNC,c);}return c;}
  async function historyCall(code,action,persona){
    const r=await fetch("/api/history",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code,action,persona})});
    if(!r.ok){const e=new Error("HTTP "+r.status);e.status=r.status;throw e;}
    return r.json();
  }
  function newestOf(chats){let best=null;for(const p of Object.keys(NAMES)){const c=chats&&chats[p];if(c&&Array.isArray(c.api)&&c.api.length&&(!best||c.ts>best.ts))best={persona:p,api:c.api,ts:c.ts};}return best;}
  const firstUser=api=>(api.find(m=>m.role==="user")||{}).content||"";
  // merge the server's latest conversation per persona into the local list (replace: the list becomes the server's copy)
  async function pullHistory(code,replace){
    const {chats}=await historyCall(code,"get");
    let list=replace?[]:loadChats();
    for(const p of Object.keys(NAMES)){
      const c=chats&&chats[p];if(!c||!Array.isArray(c.api)||!c.api.length)continue;
      const gone=(load(K_GONE)||{})[p+"|"+firstUser(c.api)];if(gone&&c.ts<=gone)continue;
      const same=list.find(x=>x.persona===p&&firstUser(x.api)===firstUser(c.api));
      if(same){if(c.ts>same.ts){same.api=c.api;same.ts=c.ts;}}
      else list.push({id:"srv-"+p+"-"+c.ts,persona:p,api:c.api,ts:c.ts});
    }
    saveChats(list);
    return newestOf(chats);
  }
  function onHome(){return chat.hidden&&threshold.style.display!=="none";}

    });
  }
  // a colour swatch replaces the photo backdrop (the photo is kept, so "choose photo" is one tap back… only if re-picked)
  document.querySelectorAll(".bd-swatch").forEach(b=>b.addEventListener("click",()=>{saveProfile({bg:b.dataset.bg});renderProfile();}));
  $("visionInput").addEventListener("input",()=>{clearTimeout(visionTimer);visionTimer=setTimeout(()=>{if(saveProfile({vision:$("visionInput").value}))profNoteSay(t("profile.saved"));},500);});
  syncSettings();setActive("home");

  /* ---- SETTINGS: sync code + history ---- */
  const syncNote=$("syncNote");let noteTimer=null,deleteArmed=null;
  function note(t){syncNote.textContent=t;clearTimeout(noteTimer);noteTimer=setTimeout(()=>{syncNote.textContent="";},5000);}
  function afterHistoryChange(){syncSettings();if(!historyEl.hidden)renderHistory();}
  $("syncCopy").addEventListener("click",async()=>{
    const code=syncCode(false);if(!code){note(t("note.noCode"));return;}
    try{await navigator.clipboard.writeText(code);note(t("note.copied"));}catch(e){note(t("note.copyFailed"));}
  });
  async function applyCode(){
    const code=normCode($("syncInput").value);
    if(!code){note(t("note.invalid"));return;}
    note(t("note.loading"));
    try{
      const best=await pullHistory(code,true);
      store(K_SYNC,code);$("syncInput").value="";afterHistoryChange();
      note(best?t("note.loaded",{name:NAMES[best.persona]}):t("note.empty"));
    }catch(e){note(t(e.status===429?"note.tooMany":"note.loadFailed"));}
  }
  $("syncApply").addEventListener("click",applyCode);
  $("syncInput").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();applyCode();}});
  $("historyDelete").addEventListener("click",async()=>{
    const btn=$("historyDelete");
    if(!deleteArmed){btn.textContent=t("settings.deleteConfirm");deleteArmed=setTimeout(()=>{deleteArmed=null;btn.textContent=t("settings.delete");},4000);return;}
    clearTimeout(deleteArmed);deleteArmed=null;btn.textContent=t("settings.delete");
    const code=syncCode(false);
    try{if(code)await historyCall(code,"delete");}catch(e){note(t("note.deleteFailed"));return;}
    try{localStorage.removeItem(K_CHATS);localStorage.removeItem(K_GONE);}catch(e){}
    afterHistoryChange();note(t("note.deleted"));
  });

  /* ---- SAFETY ---- */
  $("infoDot").addEventListener("click",()=>$("safety").classList.add("on"));
  const privacyEl=$("privacy"),privacyBtn=$("privacyToggle"),safetyCard=document.querySelector(".safety-card");
  function setPrivacy(open){privacyEl.hidden=!open;safetyCard.classList.toggle("wide",open);privacyBtn.textContent=t(open?"safety.hidePrivacy":"safety.privacy");privacyBtn.setAttribute("aria-expanded",String(open));if(open)privacyEl.scrollTop=0;}
  privacyBtn.addEventListener("click",()=>setPrivacy(privacyEl.hidden));
  $("safetyClose").addEventListener("click",()=>{$("safety").classList.remove("on");setPrivacy(false);});

  /* ---- wiring ---- */
  document.querySelectorAll("#threshold [data-persona]").forEach(el=>el.addEventListener("click",()=>enterChat(el.getAttribute("data-persona"))));
  $("mirrorBtn").addEventListener("click",openMirror);
  $("mClose").addEventListener("click",closeMirror);
  backBtn.addEventListener("click",backToGate);
  sendBtn.addEventListener("click",send);
  mSendBtn.addEventListener("click",mSend);
  input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}});
  mInput.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();mSend();}});
  input.addEventListener("input",()=>{input.style.height="2.7em";input.style.height=Math.min(input.scrollHeight,128)+"px";});
  document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(mirror.classList.contains("open"))closeMirror();else if(!moreSheet.hidden)toggleMore(false);else if(openPageAnyOpen())closePages();else if($("safety").classList.contains("on")){$("safety").classList.remove("on");setPrivacy(false);}}});
})();
</script>
</body>
</html>
