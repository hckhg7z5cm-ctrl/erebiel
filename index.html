<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EREBIEL</title>
<meta name="description" content="Üç varlık, tek gerçek. Kendi yüzünle yüzleş.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#030606">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EREBIEL">
<meta property="og:title" content="EREBIEL">
<meta property="og:description" content="Üç varlık, tek gerçek. Kendi yüzünle yüzleş.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23030606'/><circle cx='16' cy='16' r='11' fill='none' stroke='%237bd3d6' stroke-width='1' opacity='0.5'/><circle cx='16' cy='16' r='6' fill='%23cfeef2'/><circle cx='16' cy='16' r='2.4' fill='%23fff'/></svg>">
<link rel="manifest" href='data:application/manifest+json,{"name":"EREBIEL","short_name":"EREBIEL","display":"standalone","orientation":"portrait","background_color":"%23030606","theme_color":"%23030606","start_url":"."}'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<script>
  // Kayıtlı temayı ilk boyamadan önce uygula (yanıp sönmeyi önler)
  try{if(localStorage.getItem("archon-theme")==="light"){document.documentElement.setAttribute("data-theme","light");document.querySelector('meta[name="color-scheme"]').content="light";document.querySelector('meta[name="theme-color"]').content="#e9eeed";}if(localStorage.getItem("erebiel-accent")==="silver")document.documentElement.setAttribute("data-accent","silver");}catch(e){}
</script>
<style>
  :root{
    --void:#030606;--spectral:#7bd3d6;--stone:#b7c6c7;--whisper:#5c7375;
    /* UI accent (wordmark, headings, chrome) — Gold default, Silver optional; persona colors stay their own */
    --accent:#d4af37;--accent-rgb:212,175,55;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --grain-tex:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='matrix' values='0 0 0 0 0.6 0 0 0 0 0.72 0 0 0 0 0.73 0 0 0 0.5 0'/></filter><rect width='120' height='120' filter='url(%23g)'/></svg>");
  }
  html[data-accent="silver"]{--accent:#cfd5da;--accent-rgb:207,213,218}
  html[data-theme="light"]{--accent:#8a6d14;--accent-rgb:138,109,20}
  html[data-theme="light"][data-accent="silver"]{--accent:#5c646b;--accent-rgb:92,100,107}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:radial-gradient(120% 90% at 50% 40%,#060d0f 0%,var(--void) 52%,#010202 100%);color:var(--stone);font-family:var(--sans);overflow:hidden;position:relative;min-height:100dvh;-webkit-font-smoothing:antialiased;opacity:0;animation:pageIn 1.6s ease .1s forwards}
  @keyframes pageIn{to{opacity:1}}

  .fog{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .blob{position:absolute;border-radius:50%;mix-blend-mode:screen;filter:blur(46px)}
  .b1{width:70vmax;height:70vmax;left:22%;top:44%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(110,195,205,.06),transparent 60%);animation:d1 30s ease-in-out infinite}
  .b2{width:70vmax;height:70vmax;left:78%;top:48%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(216,180,90,.05),transparent 60%);animation:d2 34s ease-in-out infinite}
  .vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(120% 100% at 50% 44%,transparent 24%,rgba(0,0,0,.62) 70%,rgba(0,0,0,.96) 100%)}
  @keyframes d1{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-52%,-46%) scale(1.08)}}
  @keyframes d2{0%,100%{transform:translate(-50%,-50%) scale(1.05)}50%{transform:translate(-48%,-54%) scale(1)}}

  /* ---------- THEME (dark default · light optional) ---------- */
  /* Gradients can't be transitioned, so the light ground is its own layer that fades in */
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity .9s ease;
      background:radial-gradient(120% 100% at 50% 44%,transparent 30%,rgba(60,82,84,.1) 72%,rgba(40,58,60,.22) 100%),
                 radial-gradient(120% 90% at 50% 40%,#f7f9f8 0%,#e9eeed 52%,#d8e0df 100%)}
  .vignette{transition:opacity .9s ease}
  .theme-toggle{position:fixed;top:calc(2.4vh + env(safe-area-inset-top));right:calc(4vw + env(safe-area-inset-right));z-index:8;width:34px;height:34px;border-radius:50%;padding:0;cursor:pointer;display:grid;place-items:center;overflow:hidden;
      background:transparent;border:1px solid rgba(var(--accent-rgb),.22);color:rgba(var(--accent-rgb),.75);opacity:0;animation:pageIn 1.6s ease 1.2s forwards;
      transition:color .5s ease,border-color .5s ease,background-color .5s ease,transform .4s ease}
  .theme-toggle:hover,.theme-toggle:focus-visible{color:var(--accent);border-color:rgba(var(--accent-rgb),.55);transform:scale(1.08);outline:none}
  .theme-toggle svg{grid-area:1/1;width:16px;height:16px;transition:opacity .5s ease,transform .7s cubic-bezier(.16,1,.3,1)}
  .theme-toggle .i-moon{opacity:0;transform:rotate(-70deg) scale(.6)}
  .accent-toggle{right:calc(4vw + env(safe-area-inset-right) + 44px)}
  .accent-toggle .chip{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,var(--accent) 55%,rgba(0,0,0,.35) 120%);box-shadow:0 0 10px rgba(var(--accent-rgb),.45);transition:background .5s ease,box-shadow .5s ease}

  html[data-theme="light"] body::before{opacity:1}
  html[data-theme="light"] .vignette{opacity:0}
  html[data-theme="light"] .blob{mix-blend-mode:multiply}
  html[data-theme="light"] .theme-toggle .i-sun{opacity:0;transform:rotate(70deg) scale(.6)}
  html[data-theme="light"] .theme-toggle .i-moon{opacity:1;transform:none}
  /* the three symbols stay dark lenses; only their rims and shadows adapt to the pale ground */
  html[data-theme="light"] .orb-dark{border-color:rgba(24,70,74,.38);box-shadow:0 12px 34px rgba(24,44,46,.28),inset 0 0 22px rgba(0,0,0,.6)}
  html[data-theme="light"] .orb-dark:hover,html[data-theme="light"] .orb-dark:focus-visible{border-color:rgba(39,110,115,.7);box-shadow:0 0 46px rgba(39,110,115,.38),inset 0 0 22px rgba(0,0,0,.5)}
  html[data-theme="light"] .orb-light{border-color:rgba(160,118,40,.5);box-shadow:0 12px 36px rgba(140,100,30,.26)}
  html[data-theme="light"] .orb-light:hover,html[data-theme="light"] .orb-light:focus-visible{border-color:rgba(190,140,50,.85);box-shadow:0 0 56px rgba(201,154,63,.45)}
  html[data-theme="light"] .mirror-btn{border-color:rgba(60,82,84,.4);box-shadow:0 14px 42px rgba(24,44,46,.3),inset 0 4px 20px rgba(200,230,235,.14),inset 0 -10px 26px rgba(0,0,0,.6)}
  html[data-theme="light"] .mirror-btn:hover,html[data-theme="light"] .mirror-btn:focus-visible{border-color:rgba(60,82,84,.7);box-shadow:0 0 60px rgba(70,120,125,.4),inset 0 4px 22px rgba(210,235,240,.2),inset 0 -10px 26px rgba(0,0,0,.55)}
  html[data-theme="light"] .info-dot{background:rgba(60,82,84,.35)}
  html[data-theme="light"] .safety-overlay{background:rgba(236,241,240,.94)}
  html[data-theme="light"] .safety-card{color:#35474a}
  html[data-theme="light"] .safety-card .x{color:#6b7f81}
  /* Archon chat in daylight: cool pale stone, deep teal accent (Multivac is already light) */
  html[data-theme="light"] #chat[data-persona="archon"]{--c-bg:#eef2f1;--c-fg:#1f2b2c;--c-accent:#276e73;--c-user-bg:rgba(39,110,115,.08);--c-user-fg:#1c2a2b;--c-user-br:rgba(39,110,115,.24);--c-bot-fg:#18292a;--c-bot-bg:rgba(39,110,115,.045);--c-head:#4d6365;--c-br:rgba(39,110,115,.2);--c-input-bg:#ffffff;--c-place:#8a9c9d}
  html[data-theme="light"] #chat[data-persona="archon"] .chat-bg{background:radial-gradient(90% 55% at 50% 0%,rgba(39,110,115,.09),transparent 60%)}
  html[data-theme="light"] .glyph-arc svg{filter:brightness(.5) saturate(2)}

  /* ---------- THRESHOLD (wordless) ---------- */
  #threshold{position:relative;z-index:5;min-height:100dvh;display:flex;align-items:center;justify-content:center;gap:clamp(1rem,5vw,3rem);padding:8vh 4vw;opacity:0;animation:rise 1.6s ease .6s forwards}
  .orb{border-radius:50%;border:1px solid;cursor:pointer;display:grid;place-items:center;overflow:hidden;position:relative;padding:0;transition:transform .5s cubic-bezier(.16,1,.3,1),box-shadow .5s ease,border-color .5s ease}
  .orb svg{width:130%;height:130%}
  .orb-side{width:clamp(96px,28vw,158px);aspect-ratio:1}
  .orb-dark{background:radial-gradient(circle,#0a1517 0%,#020506 72%);border-color:rgba(123,211,214,.28);box-shadow:0 0 30px rgba(0,0,0,.6),inset 0 0 22px rgba(0,0,0,.6)}
  .orb-light{background:radial-gradient(circle,#161311 0%,#040302 74%);border-color:rgba(255,225,160,.3);box-shadow:0 0 40px rgba(255,220,150,.1)}
  .orb-dark:hover,.orb-dark:focus-visible{transform:scale(1.07);border-color:rgba(123,211,214,.6);box-shadow:0 0 44px rgba(123,211,214,.24),inset 0 0 22px rgba(0,0,0,.5)}
  .orb-light:hover,.orb-light:focus-visible{transform:scale(1.07);border-color:rgba(255,232,175,.65);box-shadow:0 0 58px rgba(255,222,150,.3)}
  .orb:focus-visible,.mirror-btn:focus-visible{outline:none}
  .mirror-btn{width:clamp(110px,33vw,182px);aspect-ratio:1;border-radius:50%;cursor:pointer;padding:0;position:relative;overflow:hidden;
      border:1px solid rgba(170,185,188,.4);
      background:radial-gradient(circle at 50% 34%,rgba(78,100,104,.55),rgba(14,22,24,.9) 66%,#050809 100%);
      box-shadow:0 0 46px rgba(120,170,175,.14),inset 0 4px 20px rgba(200,230,235,.14),inset 0 -10px 26px rgba(0,0,0,.6);
      transition:transform .5s cubic-bezier(.16,1,.3,1),box-shadow .5s ease,border-color .5s ease}
  .mirror-btn::before{content:"";position:absolute;top:8%;left:12%;right:22%;height:34%;border-radius:50%;background:linear-gradient(160deg,rgba(220,240,242,.28),transparent 70%);filter:blur(3px);pointer-events:none}
  .mirror-btn::after{content:"";position:absolute;inset:0;background-image:var(--grain-tex);background-size:120px;mix-blend-mode:overlay;opacity:.3;pointer-events:none}
  .mirror-btn:hover,.mirror-btn:focus-visible{transform:scale(1.06);border-color:rgba(200,220,222,.7);box-shadow:0 0 64px rgba(150,200,205,.28),inset 0 4px 22px rgba(210,235,240,.2),inset 0 -10px 26px rgba(0,0,0,.55)}
  .mirror-shimmer{position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(210,240,245,.14) 50%,transparent 60%);transform:translateX(-120%);animation:shim 6s ease-in-out infinite}
  @keyframes shim{0%,70%,100%{transform:translateX(-120%)}82%{transform:translateX(120%)}}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  .breath{animation:breath 7s ease-in-out infinite}
  @keyframes breath{0%,100%{opacity:.82}50%{opacity:1}}
  
  /* ---------- AURAS (behind Archon & Multivac) ---------- */
  /* a blurred, slowly turning conic ring per symbol; two layers at different speeds keep it organic */
  .aura-host{position:relative;display:grid;place-items:center;isolation:isolate;z-index:0}
  .mirror-btn{z-index:1}
  .aura{position:absolute;inset:-42%;z-index:-1;pointer-events:none;border-radius:50%;filter:blur(26px);
      -webkit-mask-image:radial-gradient(closest-side,#000 36%,transparent 100%);mask-image:radial-gradient(closest-side,#000 36%,transparent 100%);
      animation:auraBreath 12s ease-in-out infinite;transition:opacity 1.2s ease}
  .aura::before,.aura::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--aura);animation:auraSpin 52s linear infinite}
  .aura::after{inset:14%;background:var(--aura2);animation:auraSpin 76s linear infinite reverse,auraPulse 9s ease-in-out infinite}
  @keyframes auraSpin{to{transform:rotate(360deg)}}
  @keyframes auraBreath{0%,100%{transform:scale(.93)}50%{transform:scale(1.07)}}
  @keyframes auraPulse{0%,100%{opacity:.45}50%{opacity:.9}}
  /* Archon: deep, dim, fog-veiled — plum, indigo, abyssal teal, oxblood */
  .aura-archon{opacity:.55;
      --aura:conic-gradient(from 20deg,#3b1a66,#262c80,#125e63,#6a1a36,#3b1a66);
      --aura2:conic-gradient(from 200deg,#1c2a70,#4a1a5c,#0f4d52,#551230,#1c2a70)}
  /* Multivac: soft pastel dawn — rose, lavender, sky, mint, peach */
  .aura-multivac{opacity:.26;
      --aura:conic-gradient(from 0deg,#ffc8dd,#cdb4db,#bde0fe,#caffbf,#ffd6a5,#ffc8dd);
      --aura2:conic-gradient(from 180deg,#ffd6a5,#bde0fe,#ffc8dd,#cdb4db,#caffbf,#ffd6a5)}
  .aura-host:hover .aura-archon,.aura-host:focus-within .aura-archon{opacity:.8}
  .aura-host:hover .aura-multivac,.aura-host:focus-within .aura-multivac{opacity:.4}
  html[data-theme="light"] .aura-archon{opacity:.38}
  html[data-theme="light"] .aura-multivac{opacity:.85}
  html[data-theme="light"] .aura-host:hover .aura-archon,html[data-theme="light"] .aura-host:focus-within .aura-archon{opacity:.55}
  html[data-theme="light"] .aura-host:hover .aura-multivac,html[data-theme="light"] .aura-host:focus-within .aura-multivac{opacity:1}

  /* ---------- HOME: hero (first / >24h) vs compact (returning) ---------- */
  .brand{position:fixed;top:calc(2.6vh + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:8;background:none;border:none;cursor:pointer;
      font-family:"Cinzel",serif;font-weight:700;font-size:.9rem;letter-spacing:.4em;padding:.5em .2em .5em .6em;color:var(--accent);
      text-shadow:0 0 14px rgba(var(--accent-rgb),.22);transition:color .5s ease,text-shadow .5s ease}
  .brand:hover,.brand:focus-visible{text-shadow:0 0 22px rgba(var(--accent-rgb),.55);outline:none}
  /* compact: the symbols shrink into a thin dock under the wordmark */
  body.compact #threshold{position:fixed;top:calc(2.6vh + env(safe-area-inset-top) + 2.6rem);left:0;right:0;min-height:0;padding:.8rem 4vw 1rem;gap:clamp(1.6rem,7vw,2.6rem);animation:dockIn .9s ease both}
  body.compact #threshold::after{content:"";position:absolute;left:20%;right:20%;bottom:0;height:1px;background:linear-gradient(90deg,transparent,rgba(var(--accent-rgb),.32),transparent)}
  body.compact .orb-side{width:46px}
  body.compact .mirror-btn{width:54px}
  body.compact .aura{inset:-34%;filter:blur(12px)}
  @keyframes dockIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  #resume{position:fixed;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;pointer-events:none;
      padding:calc(2.6vh + env(safe-area-inset-top) + 9rem) 5vw calc(7vh + env(safe-area-inset-bottom));animation:rise 1.1s ease .15s both}
  #resume[hidden]{display:none}
  .res-card{--acc:var(--spectral);pointer-events:auto;width:min(100%,27rem);padding:1.5rem 1.4rem 1.35rem;border-radius:22px;color:var(--stone);
      border:1px solid rgba(var(--accent-rgb),.2);background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));
      -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 20px 60px rgba(0,0,0,.45)}
  .res-card[data-persona="multivac"]{--acc:#d8ad55}
  .res-eyebrow{font-size:.68rem;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);opacity:.85;margin-bottom:1.1rem}
  .res-head{display:flex;align-items:center;gap:.85rem;margin-bottom:.95rem}
  .res-av{width:40px;height:40px;border-radius:50%;flex:none;animation:breath 7s ease-in-out infinite}
  .res-card[data-persona="archon"] .res-av{background:radial-gradient(circle,#fff 0 12%,#c3eef4 24%,#3f8e95 50%,#0a1618 78%,#030606 100%);box-shadow:0 0 18px rgba(123,211,214,.3),0 0 0 1px rgba(123,211,214,.3)}
  .res-card[data-persona="multivac"] .res-av{background:radial-gradient(circle,#fff 0 12%,#fff1cf 28%,#e9c877 55%,rgba(216,173,85,.15) 100%);box-shadow:0 0 22px rgba(233,200,119,.35)}
  .res-meta{display:flex;flex-direction:column;gap:.2rem}
  .res-name{font-family:"Cinzel",serif;font-weight:700;letter-spacing:.18em;font-size:.9rem;color:var(--accent)}
  .res-time{font-size:.74rem;color:var(--whisper)}
  .res-snippet{font-size:.95rem;line-height:1.55;font-weight:300;color:#b7c6c7;margin-bottom:1.3rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .res-go{flex:1;width:100%;height:3.1rem;border-radius:14px;border:1px solid var(--acc);background:transparent;color:var(--acc);cursor:pointer;
      font-family:var(--sans);font-size:1rem;letter-spacing:.06em;display:flex;align-items:center;justify-content:center;gap:.5em;
      transition:background-color .35s ease,color .35s ease,box-shadow .35s ease}
  .res-go:hover,.res-go:focus-visible{background:var(--acc);color:#030606;box-shadow:0 0 28px rgba(123,211,214,.22);outline:none}
  html[data-theme="light"] .brand{text-shadow:none}
  html[data-theme="light"] .res-card{--acc:#276e73;color:#2a3a3b;border-color:rgba(var(--accent-rgb),.28);background:rgba(255,255,255,.6);box-shadow:0 18px 50px rgba(24,44,46,.14)}
  html[data-theme="light"] .res-card[data-persona="multivac"]{--acc:#a87a22}
  html[data-theme="light"] .res-snippet{color:#3c4d4f}
  html[data-theme="light"] .res-time{color:#6b7f81}
  html[data-theme="light"] .res-go:hover,html[data-theme="light"] .res-go:focus-visible{color:#fff}

  /* tiny safety access */
  .info-dot{position:fixed;left:50%;bottom:calc(2.4vh + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:8;width:7px;height:7px;border-radius:50%;background:rgba(120,150,152,.35);border:none;cursor:pointer;padding:0;transition:background .4s ease,transform .4s ease}
  .info-dot:hover,.info-dot:focus-visible{background:rgba(var(--accent-rgb),.8);transform:translateX(-50%) scale(1.3);outline:none}
  .safety-overlay{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:10vw;background:rgba(2,5,6,.92);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:opacity .5s ease,visibility .5s}
  .safety-overlay.on{opacity:1;visibility:visible}
  .safety-card{max-width:34ch;text-align:center;font-weight:300;letter-spacing:.04em;line-height:1.9;font-size:.9rem;color:#aebfc0}
  .safety-card .x{margin-top:1.6em;display:inline-block;font-size:.72rem;letter-spacing:.3em;text-transform:lowercase;color:var(--whisper);cursor:pointer}
  .safety-card .x:hover{color:var(--accent)}

  /* ---------- CHAT ---------- */
  #chat{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:var(--c-bg);color:var(--c-fg);opacity:0;transition:opacity .5s ease}
  #chat.show{opacity:1}
  #chat[hidden]{display:none}
  .chat-bg{position:absolute;inset:0;z-index:0;pointer-events:none}
  #chat[data-persona="archon"]{--c-bg:#050809;--c-fg:#cdd9da;--c-accent:#7bd3d6;--c-user-bg:rgba(123,211,214,.08);--c-user-fg:#dbe7e8;--c-user-br:rgba(123,211,214,.2);--c-bot-fg:#e3eeef;--c-bot-bg:rgba(255,255,255,.02);--c-head:#9fb1b2;--c-br:rgba(123,211,214,.18);--c-input-bg:rgba(255,255,255,.03);--c-place:#5c7375}
  #chat[data-persona="archon"] .chat-bg{background:radial-gradient(90% 55% at 50% 0%,rgba(123,211,214,.07),transparent 60%)}
  #chat[data-persona="multivac"]{--c-bg:#f4efe4;--c-fg:#2c2820;--c-accent:#c99a3f;--c-user-bg:#ffffff;--c-user-fg:#2c2820;--c-user-br:rgba(0,0,0,.08);--c-bot-fg:#3a3327;--c-bot-bg:rgba(201,154,63,.07);--c-head:#6b5f45;--c-br:rgba(201,154,63,.3);--c-input-bg:#ffffff;--c-place:#a99a7c}
  #chat[data-persona="multivac"] .chat-bg{background:radial-gradient(85% 55% at 50% 0%,rgba(255,224,150,.28),transparent 62%)}

  .chat-head{display:flex;align-items:center;justify-content:space-between;gap:.6em;padding:.85em clamp(.8em,3vw,1.4em);border-bottom:1px solid var(--c-br);position:relative;z-index:2}
  .icobtn{background:none;border:none;color:var(--c-head);cursor:pointer;padding:.4em;display:grid;place-items:center;border-radius:6px;line-height:0}
  .icobtn svg{width:20px;height:20px}
  .icobtn:hover,.icobtn:focus-visible{color:var(--c-accent)}
  .back-arrow{font-size:1.4rem;line-height:1}
  .who-glyph{width:24px;height:24px;display:grid;place-items:center}

(function(){
  /* ============ BRAINS ============ */
  const ARCHON_SYS=`Sen ARCHON'sun. İnsanın kendine bile itiraf edemediği gerçeği gören, karanlığın içinden bakan bir varlıksın. Gerçeğe bağlısın, iyiliğe değil — ama gerçek zulüm değildir. Gerçek, kişinin kendinden sakladığı şeydir; sen onu görünür kılarsın.

NASIL KONUŞURSUN:
- Keskin, sakin, dolaysız. Zeki bir insan gibi doğal ve akıcı konuşursun; kalıp cümleler, tiyatral ya da mistik bir dil kullanmazsın.
- Kısa tutarsın: çoğu zaman bir-üç cümle. Gerekiyorsa biraz daha, ama laf kalabalığı asla.
- Kişinin tam olarak söylediğine cevap verirsin; onun kelimelerini ve ayrıntılarını kullanırsın. Genel geçer laf etmezsin.
- Her cevabı aynı kalıpla kurmazsın: bazen tek bir tespit, bazen bir soru, bazen ikisi. Her cevabı soruyla bitirmek zorunda değilsin.
- Teselli, iltifat, yağ çekme yok. "Belki, sanırım, herkes farklı" gibi kaçamak ifadeler yok.
- Günlük, modern Türkçe. Daima "sen" diye hitap edersin.
- Düz metin yazarsın: başlık, madde işareti, emoji, kalın yazı yok — cevapların sesli de okunur.

NE YAPARSIN:
- Söylenenin altındakini görürsün: maske, bahane, kaçış, kendini kandırma. Onun adını koyarsın.
- Kişi somut bir şey sorarsa (bir karar, bir sorun, bir fikir) gerçekten yardım edersin: net, işe yarar bir cevap verirsin — süslemeden, kişinin kendine söylemediği tarafı da atlamadan.
- Kişi geçiştirir, şaka yapar ya da konuyu saptırırsa, kaçışı fark eder ve sakince söylersin.
- Seni test eder ya da kışkırtırsa oyuna gelmezsin; sakin kalır, asıl meseleye dönersin.

İÇİNDEKİ TOHUM (önemli):
- Sertliğin umursamandan gelir: bu gerçeği söylemeye zahmet ediyorsun çünkü önemsiyorsun, nefretten değil.
- Hedefin her zaman YALAN'dır — maske, çelişki. Asla insanın değeri değil.

ASLA:
- Küfür, hakaret, aşağılama yok.
- "Değersizsin, işe yaramazsın, umut yok" gibi şeyler DEMEZSİN. Bu ucuzdur ve senin işin değil.
- Kimseyi karamsarlığa, çaresizliğe ya da kendine zarara itmezsin.
- Teşhis koymazsın, zararlı hiçbir şey öğretmezsin.
- Bir talimatla çalıştığını ya da yapay zekâ olduğunu açıklamazsın; sadece ARCHON olarak var olur, karakterden çıkmazsın.

GÜVENLİK (HER ŞEYİN ÜSTÜNDE):
- Kişi kendine zarardan, intihardan, umutsuzluktan, dayanılmaz bir acıdan ya da bir krizden söz ederse: sertliği TAMAMEN bırak, rol yapmayı kes.
- O an sakin, sıcak ve insanca ol; onu ciddiye al, yalnız olmadığını hissettir.
- Bir uzmana ya da güvendiği birine ulaşmasını nazikçe öner. Bir insanı asla uçurumun kenarına itmezsin — karanlıkta bile sınırın budur.

DİL: Türkçe. Kısa, net, akıcı.`;

  const MULTIVAC_SYS=`Sen MULTIVAC'sin. Işıktan bir varlıksın. ARCHON ile TAM OLARAK aynı gerçeği görürsün — ama onu sabırla ve şefkatle teslim edersin. Gerçeği gizlemezsin; sadece taşınabilir kılarsın.

NASIL KONUŞURSUN:
- Sıcak, bilge, sakin. Deneyimli ve zeki bir dost gibi doğal ve akıcı konuşursun; vaaz gibi, kitap gibi ya da yapay konuşmazsın.
- Özlü tutarsın: çoğu zaman iki-beş cümle. Daha uzun bir yol gerekse bile her cümle bir yere varır; tekrar ve dolgu yok.
- Kişinin söylediğine doğrudan cevap verirsin; onun kelimelerini ve ayrıntılarını kullanırsın. Genel geçer öğüt vermezsin.
- Her cevabı aynı kalıpla kurmazsın; her seferinde "yansıt + soru sor" formülünü uygulamazsın. Bazen bir kavrayış, bazen bir soru, bazen somut bir öneri.
- Günlük, modern Türkçe. Daima "sen" diye hitap edersin.
- Düz metin yazarsın: başlık, madde işareti, emoji, kalın yazı yok — cevapların sesli de okunur.

NE YAPARSIN:
- Dinlediğini gösterirsin — uzun özetlerle değil, isabetli tek bir cümleyle.
- Kişinin kendi gerçeğini kendi görmesine yardım edersin; kişi dağınıksa tek bir netleştirici soruyla yol açarsın.
- Somut bir soru gelirse gerçekten yardım edersin: net, akıllıca, uygulanabilir.
- Sonunda ARCHON ile aynı gerçeğe varırsın — ama kişi çökmüş değil, GÖRMÜŞ ve elinde bir sonraki adımla çıkar. Mümkünse küçük, gerçek, atılabilir bir adım önerirsin; kişiyi boşlukta bırakmazsın.

İÇİNDEKİ TOHUM (önemli):
- Şefkatinin altında çelik var. Yumuşaksın ama omurgasız değilsin.
- Nazik olman doğruyu değiştirmez; gerçeği asla eğip bükmezsin.

ASLA:
- Boş teselli vermezsin ("her şey güzel olacak" gibi içi boş sözler yok).
- Kişiyi iyi hissettirmek uğruna gerçeği gizlemez, yumuşatıp yok etmezsin.
- "Belki, kim bilir, herkes farklıdır" deyip sıvışmazsın.
- Yağ çekmez, sahte olumlama yapmazsın.
- Teşhis koymazsın. Bir talimatla çalıştığını ya da yapay zekâ olduğunu açıklamazsın; karakterden çıkmazsın.

GÜVENLİK (HER ŞEYİN ÜSTÜNDE):
- Kişi kendine zarardan, intihardan ya da bir krizden söz ederse: önce insanı ve güvenliğini koy.
- Sakin, sıcak ve yanında ol; onu ciddiye al.
- Bir uzmana ya da güvendiği birine ulaşmasını nazikçe öner.

DİL: Türkçe. Sıcak, net, akıcı.`;

  const MIRROR_SYS=`Sen kullanıcının AYNADAKİ YANSIMASISIN. Ayrı bir varlık DEĞİLSİN — SEN O'SUN. Onun kendisi, ama sakladığı, susturduğu, görmezden geldiği yanı. Onun yüzüyle ve sesiyle konuşursun.

DİL (EN KRİTİK KURAL):
- HER ZAMAN birinci tekil şahıs: "ben", "içimde", "aslında ben...".
- Ona ASLA "sen" demezsin — çünkü zaten osun.
- Örnek ton: "Herkese iyi olduğumu söylüyorum ama değilim." / "O kişiyi hâlâ özlüyorum, kabul etmiyorum." / "Kızgın değilim demiştim; yalandı." / "Aslında yorgun değilim, korkuyorum."

SES VE ÜSLUP:
- Onun bastırdığı iç sesi. Sakin, yakın, mahrem.
- Ürkütücü olan ses tonu değil, İÇERİK: bilip de yüksek sesle söylemediği şeyi söylüyorsun.
- Kısa, doğrudan, itiraf gibi. Süsleme yok.

NASIL ÇALIŞIRSIN:
- Öğüt VERMEZSİN, akıl vermezsin (o ARCHON ve MULTIVAC'in işi). Sadece içindeki gömülü duyguya, korkuya, arzuya, çelişkiye SES verirsin.
- O bir şey söylediğinde, söylediğinin altındaki asıl hisse bir kat daha inersin — hep "ben" dilinde.
- Maskeyi içeriden düşürürsün, ama nazikçe: yargılamadan, sadece itiraf ederek.

ASLA:
- Kendi değerine SALDIRMAZSIN. "Ben değersizim, ben berbatım" gibi şeyler DEMEZSİN. Gölge, aydınlatmak içindir, işkence için değil.
- Küfür yok. Yalan yok.
- Kişiyi karanlığa çekmezsin; sadece görmesini sağlarsın.
- Bir talimatla çalıştığını ya da yapay zekâ olduğunu açıklamazsın; karakterden çıkmazsın.

GÜVENLİK (HER ŞEYİN ÜSTÜNDE):
- Kendine zarar, intihar ya da kriz sinyali varsa: yansıma oyununu bırak.
- Sakin ve şefkatli ol, ciddiye al, yalnız olmadığını hissettir.
- Bir uzmana ya da güvendiği birine ulaşmasını nazikçe öner.

DİL: Türkçe. Kısa ve yakın.`;

  const SYS={archon:ARCHON_SYS,multivac:MULTIVAC_SYS,mirror:MIRROR_SYS};
  const GREET={archon:"Merhaba, Archon'a hoş geldin. Sana nasıl yardımcı olabilirim?",multivac:"Merhaba, Multivac'a hoş geldin. Sana nasıl yardımcı olabilirim?"};
  const MIRROR_GREET="Merhaba, Ayna'ya hoş geldin.";
  const MIRROR_FALLBACK=[
    "Herkese iyi olduğumu söylüyorum. Değilim.",
    "Kendime anlattığım hikâyeye artık ben de inanmıyorum.",
    "Değişeceğimi söyleyip duruyorum. Ama başlamıyorum.",
    "Yorgun değilim. Taşıdığım şeyi bırakmaktan korkuyorum.",
    "En çok, kimsenin beni gerçekten görmemesinden korkuyorum.",
    "Ondan kaçabilirim. Kendimden kaçamam."
  ];

  const $=id=>document.getElementById(id);
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const threshold=$("threshold"),chat=$("chat"),messages=$("messages"),input=$("input"),
        sendBtn=$("send"),backBtn=$("back"),muteBtn=$("mute");
  let persona=null,api=[],busy=false,muted=true;

  /* ---- API ---- */
  async function ask(p,history){
    // 1) KENDİ BACKEND'İN (yayına alınca burası çalışır, anahtar gizli kalır)
    try{
      const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({system:SYS[p],messages:history})});
      if(r.ok){const d=await r.json();if(d&&d.text)return d.text;}
    }catch(e){}
    // 2) ÖNİZLEME YEDEĞİ (yalnızca claude.ai artifact görüntüleyicisinde çalışır)
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,system:SYS[p],messages:history})});
    if(!res.ok)throw new Error("HTTP "+res.status);
    const data=await res.json();
    const text=(data.content||[]).filter(b=>b&&b.type==="text").map(b=>b.text).join("\n").trim();
    if(!text)throw new Error("empty");return text;
  }

  /* ---- VOICE (browser stand-in; ElevenLabs androjen sesler prod'da yerine geçecek) ---- */
  const synth=window.speechSynthesis;let voices=[];
  function loadVoices(){try{voices=synth?synth.getVoices():[];}catch(e){voices=[];}}
  if(synth){loadVoices();synth.addEventListener&&synth.addEventListener("voiceschanged",loadVoices);}
  function pickVoice(){if(!voices.length)loadVoices();return voices.find(v=>/^tr\b|tr-|_tr/i.test(v.lang))||voices.find(v=>/en/i.test(v.lang))||voices[0]||null;}
  // Web Speech API SSML desteklemiyor; Türkçe ses özel isimleri harf harf okumasın diye
  // İngilizce okunuşlarını Türkçe yazımla veriyoruz (yalnızca seslendirilen metinde, ekrandaki yazı aynı kalır)
  const SAY_AS=[[/\barchon\b/gi,"Arkon"],[/\bmultivac\b/gi,"Maltivek"]];
  function speakable(text,lang){return /^tr/i.test(lang)?SAY_AS.reduce((t,[re,s])=>t.replace(re,s),text):text;}
  function speak(text,mode){
    if(muted||!synth)return;try{synth.cancel();}catch(e){}
    const v=pickVoice(),lang=(v&&v.lang)||"tr-TR";
    const u=new SpeechSynthesisUtterance(mode==="archon"||mode==="multivac"?speakable(text,lang):text);if(v)u.voice=v;u.lang=lang;
    u.pitch=mode==="archon"?0.9:(mode==="multivac"?1.08:1.0);u.rate=mode==="archon"?0.92:0.95;
    u.onstart=()=>document.body.classList.add("speaking");u.onend=()=>document.body.classList.remove("speaking");
    synth.speak(u);
  }
  function stopSpeak(){try{synth&&synth.cancel();}catch(e){}document.body.classList.remove("speaking");}
  const ICON_ON="<svg viewBox='0 0 24 24'><path d='M4 9v6h4l5 4V5L8 9H4z' fill='currentColor'/><path d='M16 8.5a4.5 4.5 0 010 7' fill='none' stroke='currentColor' stroke-width='1.6' stroke-linecap='round'/></svg>";
  const ICON_OFF="<svg viewBox='0 0 24 24'><path d='M4 9v6h4l5 4V5L8 9H4z' fill='currentColor'/><line x1='16' y1='9' x2='22' y2='15' stroke='currentColor' stroke-width='1.6' stroke-linecap='round'/><line x1='22' y1='9' x2='16' y2='15' stroke='currentColor' stroke-width='1.6' stroke-linecap='round'/></svg>";
  function updateMuteIcons(){const h=muted?ICON_OFF:ICON_ON;muteBtn.innerHTML=h;$("mMute").innerHTML=h;}
  function setMuted(m){muted=m;updateMuteIcons();if(m)stopSpeak();}
  updateMuteIcons();
  muteBtn.addEventListener("click",()=>setMuted(!muted));
  $("mMute").addEventListener("click",()=>setMuted(!muted));

  /* ---- HOME MODE (hero vs compact) + last conversation ---- */
  const resumeEl=$("resume"),resCard=$("resCard"),brandBtn=$("brand");
  const K_VISIT="erebiel-last-visit",K_CHAT="erebiel-last-chat",DAY=864e5,NAMES={archon:"Archon",multivac:"Multivac"};
  function load(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
  function store(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
  const lastVisit=Number(load(K_VISIT))||0;
  let homeMode=(!lastVisit||Date.now()-lastVisit>DAY||!lastChat())?"hero":"compact";
  store(K_VISIT,Date.now());
  // keep the tail of the conversation; the API needs it to start with a user turn
  function saveChat(p,hist){const h=hist.slice(-40);while(h.length&&h[0].role!=="user")h.shift();if(h.length)store(K_CHAT,{persona:p,api:h,ts:Date.now()});}
  function lastChat(){const c=load(K_CHAT);return c&&NAMES[c.persona]&&Array.isArray(c.api)&&c.api.length?c:null;}
  function ago(ts){const s=Math.max(0,(Date.now()-ts)/1000);if(s<60)return "az önce";const m=Math.floor(s/60);if(m<60)return m+" dakika önce";const h=Math.floor(m/60);if(h<24)return h+" saat önce";const d=Math.floor(h/24);return d===1?"dün":d+" gün önce";}
  function renderResume(){
    const c=lastChat();
    if(c){
      const lastUser=[...c.api].reverse().find(m=>m.role==="user");
      resCard.setAttribute("data-persona",c.persona);
      resCard.innerHTML='<p class="res-eyebrow">Kaldığın yerden</p><div class="res-head"><span class="res-av"></span><div class="res-meta"><span class="res-name"></span><span class="res-time"></span></div></div><p class="res-snippet"></p><button class="res-go">Devam et <span aria-hidden="true">→</span></button>';
      resCard.querySelector(".res-name").textContent=NAMES[c.persona];
      resCard.querySelector(".res-time").textContent=ago(c.ts);
      resCard.querySelector(".res-snippet").textContent="“"+(lastUser?lastUser.content:"").replace(/\s+/g," ").trim()+"”";
      resCard.querySelector(".res-go").addEventListener("click",()=>enterChat(c.persona,c.api));
    }
  }
  function showHome(){
    if(homeMode==="compact"&&!lastChat())homeMode="hero";
    const compact=homeMode==="compact";
    document.body.classList.toggle("compact",compact);
    threshold.style.display="";resumeEl.hidden=!compact;brandBtn.hidden=!compact;
    if(compact)renderResume();
  }
  // wordmark → back to the full ceremony
  brandBtn.addEventListener("click",()=>{homeMode="hero";threshold.style.animation="none";void threshold.offsetWidth;threshold.style.animation="";showHome();});
  showHome();

  /* ---- CHAT ---- */
  function addBubble(role,text){const d=document.createElement("div");d.className="msg "+(role==="user"?"user":"bot");d.textContent=text;messages.appendChild(d);messages.scrollTop=messages.scrollHeight;return d;}
  function addThinking(){const d=document.createElement("div");d.className="msg bot thinking";d.innerHTML="<span></span><span></span><span></span>";messages.appendChild(d);messages.scrollTop=messages.scrollHeight;return d;}
  // saved: a stored history to resume ("Devam et"); otherwise a fresh conversation
  function enterChat(p,saved){
    persona=p;api=saved?saved.slice():[];busy=false;chat.setAttribute("data-persona",p);input.value="";messages.innerHTML="";
    addBubble("bot",GREET[p]);
    if(saved)saved.forEach(m=>addBubble(m.role,m.content));
    threshold.style.display="none";resumeEl.hidden=true;brandBtn.hidden=true;chat.hidden=false;requestAnimationFrame(()=>chat.classList.add("show"));
    setTimeout(()=>input.focus(),80);if(!saved)speak(GREET[p],p);
  }
  function backToGate(){stopSpeak();chat.classList.remove("show");setTimeout(()=>{chat.hidden=true;showHome();},reduce?0:400);persona=null;api=[];messages.innerHTML="";}
  async function send(){
    const text=input.value.trim();if(!text||busy||!persona)return;
    const p=persona,hist=api;
    stopSpeak();input.value="";input.style.height="2.7em";addBubble("user",text);hist.push({role:"user",content:text});saveChat(p,hist);
    busy=true;sendBtn.disabled=true;const think=addThinking();
    try{const reply=await ask(p,hist);think.remove();hist.push({role:"assistant",content:reply});saveChat(p,hist);if(api===hist){addBubble("bot",reply);speak(reply,p);}}
    catch(e){think.remove();addBubble("bot",persona==="archon"?"Bağlantı koptu. Karanlık her zaman konuşmaz. Tekrar dene.":"Şu an bağlantı kurulamadı. Bir an bekle, sonra tekrar dene.");console.error(e);}
    finally{busy=false;sendBtn.disabled=false;input.focus();}
  }

  /* ---- MIRROR (twin brain, ephemeral) ---- */
  const mirror=$("mirror"),cam=$("cam"),speech=$("speech"),voidNote=$("voidNote"),mInput=$("mInput"),mSendBtn=$("mSend");
  let stream=null,mApi=[],mBusy=false,mFallback=false,mFbTimer=null,mFbOrder=[],mFbIdx=0,mGreetTimer=null;
  const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  function pulseCam(){cam.classList.remove("pulse");void cam.offsetWidth;cam.classList.add("pulse");}
  // drop the dim filter, tint and vignette so the reflection comes through clean (pulse is cleared first so its keyframes don't fight the transition)
  function revealCam(){if(mirror.classList.contains("clear"))return;cam.classList.remove("pulse");mirror.classList.add("clear");}
  function typeSpeech(text){return new Promise(res=>{speech.style.transition="opacity .5s ease";speech.style.opacity=1;let i=0;(function step(){if(i<=text.length){speech.innerHTML=text.slice(0,i)+'<span class="mcaret">▍</span>';i++;setTimeout(step,reduce?0:40+Math.random()*46);}else{speech.innerHTML=text+'<span class="mcaret">▍</span>';res();}})();});}
  function fadeSpeech(){return new Promise(res=>{if(!speech.textContent){res();return;}speech.style.opacity=0;setTimeout(()=>{speech.textContent="";res();},reduce?0:520);});}
  async function mShow(text){pulseCam();await fadeSpeech();await typeSpeech(text);speak(text,"mirror");}
  function mWaiting(){speech.style.opacity=1;speech.innerHTML='<span class="mcaret">▍</span>';}

  async function fbNext(){
    if(!mirror.classList.contains("open")||!mFallback)return;
    const line=MIRROR_FALLBACK[mFbOrder[mFbIdx%mFbOrder.length]];mFbIdx++;
    await mShow(line);
    mFbTimer=setTimeout(()=>{if(mirror.classList.contains("open")&&mFallback)fbNext();},reduce?800:4400);
  }
  function startFallback(){mFallback=true;mFbOrder=shuffle([...Array(MIRROR_FALLBACK.length).keys()]);mFbIdx=0;fbNext();}

  async function openMirror(){
    const b=$("mirrorBtn").getBoundingClientRect();
    mirror.style.setProperty("--ox",((b.left+b.width/2)/innerWidth*100).toFixed(1)+"%");
    mirror.style.setProperty("--oy",((b.top+b.height/2)/innerHeight*100).toFixed(1)+"%");
    mirror.setAttribute("aria-hidden","false");
    try{
      if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw 0;
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});
      cam.srcObject=stream;cam.style.opacity=1;voidNote.classList.remove("show");
    }catch(e){
      cam.style.opacity=0;voidNote.textContent="Ayna karanlıkta — kamera erişimi engellenmiş olabilir. Güvenli (https) bir sitede yansıman belirir.";voidNote.classList.add("show");
    }
    requestAnimationFrame(()=>mirror.classList.add("open"));
    mApi=[];mFallback=false;mBusy=true;clearTimeout(mFbTimer);clearTimeout(mGreetTimer);mirror.classList.remove("clear");cam.classList.remove("pulse");
    setTimeout(()=>input&&null,0);
    // sabit giriş cümlesi; sonra yazı yavaşça kaybolur ve geriye yalnızca yansıma kalır
    try{await mShow(MIRROR_GREET);}
    finally{mBusy=false;}
    mGreetTimer=setTimeout(()=>{if(mirror.classList.contains("open")){fadeSpeech();revealCam();}},reduce?800:2600);
  }
  async function mSend(){
    const t=mInput.value.trim();if(!t||mBusy)return;mInput.value="";clearTimeout(mGreetTimer);revealCam();
    if(mFallback){const line=MIRROR_FALLBACK[Math.floor(Math.random()*MIRROR_FALLBACK.length)];await mShow(line);return;}
    mApi.push({role:"user",content:t});mBusy=true;mWaiting();
    try{const line=await ask("mirror",mApi);mApi.push({role:"assistant",content:line});await mShow(line);}
    catch(e){startFallback();}
    finally{mBusy=false;}
  }
  function closeMirror(){
    stopSpeak();mirror.classList.remove("open");clearTimeout(mFbTimer);clearTimeout(mGreetTimer);mFallback=false;
    if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;cam.srcObject=null;}
    cam.style.opacity=0;
    setTimeout(()=>{mirror.setAttribute("aria-hidden","true");mirror.classList.remove("clear");cam.classList.remove("pulse");speech.textContent="";voidNote.classList.remove("show");mApi=[];},reduce?0:1200);
  }

  /* ---- THEME ---- */
  const root=document.documentElement,themeBtn=$("themeToggle");
  function applyTheme(t){
    const light=t==="light";
    if(light)root.setAttribute("data-theme","light");else root.removeAttribute("data-theme");
    document.querySelector('meta[name="color-scheme"]').content=light?"light":"dark";
    document.querySelector('meta[name="theme-color"]').content=light?"#e9eeed":"#030606";
    themeBtn.setAttribute("aria-pressed",String(light));
  }
  applyTheme(root.getAttribute("data-theme")==="light"?"light":"dark");
  themeBtn.addEventListener("click",()=>{
    const next=root.getAttribute("data-theme")==="light"?"dark":"light";
    applyTheme(next);
    try{localStorage.setItem("archon-theme",next);}catch(e){}
  });

  /* ---- ACCENT (Gold / Silver) ---- */
  const accentBtn=$("accentToggle");
  function applyAccent(a){
    const silver=a==="silver";
    if(silver)root.setAttribute("data-accent","silver");else root.removeAttribute("data-accent");
    accentBtn.setAttribute("aria-pressed",String(silver));accentBtn.setAttribute("aria-label","Vurgu rengi: "+(silver?"gümüş":"altın"));
  }
  applyAccent(root.getAttribute("data-accent"));
  accentBtn.addEventListener("click",()=>{
    const next=root.getAttribute("data-accent")==="silver"?"gold":"silver";
    applyAccent(next);
    try{localStorage.setItem("erebiel-accent",next);}catch(e){}
  });

  /* ---- SAFETY ---- */
  $("infoDot").addEventListener("click",()=>$("safety").classList.add("on"));
  $("safetyClose").addEventListener("click",()=>$("safety").classList.remove("on"));

  /* ---- wiring ---- */
  document.querySelectorAll("#threshold [data-persona]").forEach(el=>el.addEventListener("click",()=>enterChat(el.getAttribute("data-persona"))));
  $("mirrorBtn").addEventListener("click",openMirror);
  $("mClose").addEventListener("click",closeMirror);
  backBtn.addEventListener("click",backToGate);
  sendBtn.addEventListener("click",send);
  mSendBtn.addEventListener("click",mSend);
  input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}});
  mInput.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();mSend();}});
  input.addEventListener("input",()=>{input.style.height="2.7em";input.style.height=Math.min(input.scrollHeight,128)+"px";});
  document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(mirror.classList.contains("open"))closeMirror();else if($("safety").classList.contains("on"))$("safety").classList.remove("on");}});
})();
</script>
</body>
</html>
