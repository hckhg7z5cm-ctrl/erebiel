<script>
(function(){
  /* ============ BRAINS ============ */
  const t=i18n.t;
  i18n.apply();



  // greetings and the Mirror's offline lines come from i18n.js (current UI language)
  const greet=p=>t("greet."+p);
  const mirrorFallback=()=>t("mirror.fallback");

  const $=id=>document.getElementById(id);
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const threshold=$("threshold"),chat=$("chat"),messages=$("messages"),input=$("input"),
        sendBtn=$("send"),backBtn=$("back"),muteBtn=$("mute");
  let persona=null,api=[],busy=false,muted=true;

  /* ---- API ---- */
  async function ask(p,history){
    // Karakter promptları sunucuda (api/chat.js); tarayıcı sadece hangi karakter olduğunu gönderir
    // sunucu en fazla 40 mesaj kabul eder; son kısmı gönder, kullanıcı mesajıyla başlasın
    const msgs=history.slice(-40);while(msgs.length&&msgs[0].role!=="user")msgs.shift();
    const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({persona:p,messages:msgs,code:p==="mirror"?undefined:syncCode(true),lang:i18n.lang()})});
    if(!r.ok){const e=new Error("HTTP "+r.status);e.status=r.status;throw e;}
    const d=await r.json();
    if(!d||!d.text)throw new Error("empty");
    return {text:d.text,lang:d.lang||null};
  }

  /* ---- VOICE (browser stand-in; ElevenLabs androjen sesler prod'da yerine geçecek) ---- */
  const synth=window.speechSynthesis;let voices=[];
  function loadVoices(){try{voices=synth?synth.getVoices():[];}catch(e){voices=[];}}
  if(synth){loadVoices();synth.addEventListener&&synth.addEventListener("voiceschanged",loadVoices);}
  // characters answer in the user's language, so choose the voice from the text itself
  function guessLang(text){
    if(/[ğışİĞŞ]/.test(text))return "tr";
    if(/[äßÄ]/.test(text))return "de";
    if(/[\u3040-\u30ff\u4e00-\u9faf]/.test(text))return "ja";
    if(/[çöüÇÖÜ]/.test(text)&&i18n.lang()==="tr")return "tr";
    return "en";
  }
  function pickVoice(lang){if(!voices.length)loadVoices();const re=new RegExp("^"+lang+"\\b|^"+lang+"[-_]","i");return voices.find(v=>re.test(v.lang))||voices.find(v=>/^en/i.test(v.lang))||voices[0]||null;}
  // Web Speech API SSML desteklemiyor; Türkçe ses özel isimleri harf harf okumasın diye
  // İngilizce okunuşlarını Türkçe yazımla veriyoruz (yalnızca seslendirilen metinde, ekrandaki yazı aynı kalır)
  const SAY_AS=[[/\barchon\b/gi,"Arkon"],[/\bmultivac\b/gi,"Maltivek"]];
  function speakable(text,lang){return /^tr/i.test(lang)?SAY_AS.reduce((t,[re,s])=>t.replace(re,s),text):text;}
  // langHint: the reply language reported by the server (or the UI language for greetings)
  function speak(text,mode,langHint){
    if(muted||!synth)return;try{synth.cancel();}catch(e){}
    const want=langHint?String(langHint).split("-")[0]:guessLang(text),v=pickVoice(want),lang=(v&&v.lang)||want;
    const u=new SpeechSynthesisUtterance(mode==="archon"||mode==="multivac"?speakable(text,lang):text);if(v)u.voice=v;u.lang=lang;
    u.pitch=mode==="archon"?0.9:(mode==="multivac"?1.08:1.0);u.rate=mode==="archon"?0.92:0.95;
    u.onstart=()=>document.body.classList.add("speaking");u.onend=()=>document.body.classList.remove("speaking");
    synth.speak(u);
  }
  function stopSpeak(){try{synth&&synth.cancel();}catch(e){}document.body.classList.remove("speaking");}
  const ICON_ON="<svg viewBox='0 0 24 24'><path d='M4 9v6h4l5 4V5L8 9H4z' fill='currentColor'/><path d='M16 8.5a4.5 4.5 0 010 7' fill='none' stroke='currentColor' stroke-width='1.6' stroke-linecap='round'/></svg>";
  const ICON_OFF="<svg viewBox='0 0 24 24'><path d='M4 9v6h4l5 4V5L8 9H4z' fill='currentColor'/><line x1='16' y1='9' x2='22' y2='15' stroke='currentColor' stroke-width='1.6' stroke-linecap='round'/><line x1='22' y1='9' x2='16' y2='15' stroke='currentColor' stroke-width='1.6' stroke-linecap='round'/></svg>";
  function updateMuteIcons(){const h=muted?ICON_OFF:ICON_ON;muteBtn.innerHTML=h;$("mMute").innerHTML=h;}
  function setMuted(m){muted=m;updateMuteIcons();if(m)stopSpeak();}
  updateMuteIcons();
  muteBtn.addEventListener("click",()=>setMuted(!muted));
  $("mMute").addEventListener("click",()=>setMuted(!muted));

  /* ---- HOME + conversations ---- */
  const brandBtn=$("brand"),inviteEl=$("invite");
  const K_VISIT="erebiel-last-visit",K_CHATS="erebiel-chats",K_CHAT_OLD="erebiel-last-chat",NAMES={archon:"Archon",multivac:"Multivac"};
  const MAX_CHATS=40,K_GONE="erebiel-chats-deleted";
  function load(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
  function store(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}
  store(K_VISIT,Date.now());
  // every conversation is kept in this browser as {id, persona, api, ts}; the server keeps each persona's latest (sync code)
  function newId(){return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8);}
  function validConv(c){return c&&NAMES[c.persona]&&Array.isArray(c.api)&&c.api.length&&c.id;}
  function loadChats(){const l=load(K_CHATS);return Array.isArray(l)?l.filter(validConv):[];}
  function saveChats(list){list.sort((a,b)=>b.ts-a.ts);store(K_CHATS,list.slice(0,MAX_CHATS));}
  (function migrate(){const old=load(K_CHAT_OLD);if(old&&NAMES[old.persona]&&Array.isArray(old.api)&&old.api.length){const l=loadChats();if(!l.length)saveChats([{id:newId(),persona:old.persona,api:old.api,ts:old.ts||Date.now()}]);}try{localStorage.removeItem(K_CHAT_OLD);}catch(e){}})();
  // keep the tail of the conversation; the API needs it to start with a user turn
  function saveChat(id,p,hist){const h=hist.slice(-40);while(h.length&&h[0].role!=="user")h.shift();if(!h.length)return;const all=loadChats(),prev=all.find(c=>c.id===id),l=all.filter(c=>c.id!==id);const conv={id,persona:p,api:h,ts:Date.now()};if(prev&&prev.title)conv.title=prev.title;l.push(conv);saveChats(l);}
  function lastChat(){return loadChats()[0]||null;}
  function chatsFor(p){return loadChats().filter(c=>c.persona===p);}

  /* ---- server history, keyed by a private sync code (Crockford base32, 20 chars ≈ 100 bits) ---- */
  const K_SYNC="erebiel-sync-code",CODE_ABC="0123456789ABCDEFGHJKMNPQRSTVWXYZ";
  function genCode(){const b=crypto.getRandomValues(new Uint8Array(20));let s="";for(const x of b)s+=CODE_ABC[x&31];return s.match(/.{4}/g).join("-");}
  function normCode(v){const s=String(v||"").toUpperCase().replace(/[^0-9A-Z]/g,"").replace(/O/g,"0").replace(/[IL]/g,"1");return /^[0-9A-HJKMNP-TV-Z]{20}$/.test(s)?s.match(/.{4}/g).join("-"):null;}
  function syncCode(create){let c=load(K_SYNC);if(!normCode(c))c=null;if(!c&&create){c=genCode();store(K_SYNC,c);}return c;}
  async function historyCall(code,action,persona){
    const r=await fetch("/api/history",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code,action,persona})});
    if(!r.ok){const e=new Error("HTTP "+r.status);e.status=r.status;throw e;}
    return r.json();
  }
  function newestOf(chats){let best=null;for(const p of Object.keys(NAMES)){const c=chats&&chats[p];if(c&&Array.isArray(c.api)&&c.api.length&&(!best||c.ts>best.ts))best={persona:p,api:c.api,ts:c.ts};}return best;}
  const firstUser=api=>(api.find(m=>m.role==="user")||{}).content||"";
  // merge the server's latest conversation per persona into the local list (replace: the list becomes the server's copy)
  async function pullHistory(code,replace){
    const {chats}=await historyCall(code,"get");
    let list=replace?[]:loadChats();
    for(const p of Object.keys(NAMES)){
      const c=chats&&chats[p];if(!c||!Array.isArray(c.api)||!c.api.length)continue;
      const gone=(load(K_GONE)||{})[p+"|"+firstUser(c.api)];if(gone&&c.ts<=gone)continue;
      const same=list.find(x=>x.persona===p&&firstUser(x.api)===firstUser(c.api));
      if(same){if(c.ts>same.ts){same.api=c.api;same.ts=c.ts;}}
      else list.push({id:"srv-"+p+"-"+c.ts,persona:p,api:c.api,ts:c.ts});
    }
    saveChats(list);
    return newestOf(chats);
  }
  function onHome(){return chat.hidden&&threshold.style.display!=="none";}
  function ago(ts){const s=Math.max(0,(Date.now()-ts)/1000);if(s<60)return t("ago.now");const m=Math.floor(s/60);if(m<60)return t("ago.min",{n:m});const h=Math.floor(m/60);if(h<24)return h===1?t("ago.hour1"):t("ago.hours",{n:h});const d=Math.floor(h/24);return d===1?t("ago.yesterday"):t("ago.days",{n:d});}
  function showHome(){
    document.body.classList.remove("compact");
    threshold.style.display="";brandBtn.hidden=false;inviteEl.hidden=false;
  }
  // wordmark → replay the opening
  brandBtn.addEventListener("click",()=>{threshold.style.animation="none";void threshold.offsetWidth;threshold.style.animation="";showHome();});
  showHome();
  // quietly merge the server copy (another device may have newer chats)
  (async()=>{const code=syncCode(false);if(!code)return;try{await pullHistory(code,false);}catch(e){return;}if(!historyEl.hidden)renderHistory();})();

  /* ---- CHAT ---- */
  function addBubble(role,text){const d=document.createElement("div");d.className="msg "+(role==="user"?"user":"bot");d.dir="auto";d.textContent=text;messages.appendChild(d);messages.scrollTop=messages.scrollHeight;return d;}
  function addThinking(){const d=document.createElement("div");d.className="msg bot thinking";d.innerHTML="<span></span><span></span><span></span>";messages.appendChild(d);messages.scrollTop=messages.scrollHeight;return d;}
  // conv: a stored conversation {id, api} to reopen; otherwise a fresh one
  let convId=null;
  function enterChat(p,conv){
    persona=p;convId=conv?conv.id:newId();api=conv?conv.api.slice():[];busy=false;chat.setAttribute("data-persona",p);input.value="";messages.innerHTML="";
    addBubble("bot",greet(p));
    if(conv)conv.api.forEach(m=>addBubble(m.role,m.content));
    threshold.style.display="none";inviteEl.hidden=true;brandBtn.hidden=true;chat.hidden=false;requestAnimationFrame(()=>chat.classList.add("show"));
    setTimeout(()=>input.focus(),80);if(!conv)speak(greet(p),p,i18n.lang());
  }
  // back from a chat: home, or the history list if the chat was opened from there
  function backToGate(){stopSpeak();chat.classList.remove("show");setTimeout(()=>{chat.hidden=true;showHome();if(!historyEl.hidden)renderHistory();},reduce?0:400);persona=null;api=[];convId=null;messages.innerHTML="";}
  async function send(){
    const text=input.value.trim();if(!text||busy||!persona)return;
    const p=persona,hist=api,id=convId;
    stopSpeak();input.value="";input.style.height="2.7em";addBubble("user",text);hist.push({role:"user",content:text});saveChat(id,p,hist);
    busy=true;sendBtn.disabled=true;const think=addThinking();
    try{const {text:reply,lang:replyLang}=await ask(p,hist);think.remove();hist.push({role:"assistant",content:reply});saveChat(id,p,hist);if(api===hist){addBubble("bot",reply);speak(reply,p,replyLang);}}
    catch(e){think.remove();addBubble("bot",t((e.status===429?"err.rate.":"err.net.")+(persona==="archon"?"archon":"multivac")));console.error(e);}
    finally{busy=false;sendBtn.disabled=false;input.focus();}
  }

  /* ---- MIRROR (twin brain, ephemeral) ---- */
  const mirror=$("mirror"),cam=$("cam"),speech=$("speech"),voidNote=$("voidNote"),mInput=$("mInput"),mSendBtn=$("mSend");
  let stream=null,mApi=[],mBusy=false,mFallback=false,mFbTimer=null,mFbOrder=[],mFbIdx=0,mGreetTimer=null;
  const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  function pulseCam(){cam.classList.remove("pulse");void cam.offsetWidth;cam.classList.add("pulse");}
  // drop the dim filter, tint and vignette so the reflection comes through clean (pulse is cleared first so its keyframes don't fight the transition)
  function revealCam(){if(mirror.classList.contains("clear"))return;cam.classList.remove("pulse");mirror.classList.add("clear");}
  function typeSpeech(text){return new Promise(res=>{speech.style.transition="opacity .5s ease";speech.style.opacity=1;let i=0;(function step(){if(i<=text.length){speech.innerHTML=text.slice(0,i)+'<span class="mcaret">▍</span>';i++;setTimeout(step,reduce?0:40+Math.random()*46);}else{speech.innerHTML=text+'<span class="mcaret">▍</span>';res();}})();});}
  function fadeSpeech(){return new Promise(res=>{if(!speech.textContent){res();return;}speech.style.opacity=0;setTimeout(()=>{speech.textContent="";res();},reduce?0:520);});}
  async function mShow(text,lang){pulseCam();await fadeSpeech();await typeSpeech(text);speak(text,"mirror",lang);}
  function mWaiting(){speech.style.opacity=1;speech.innerHTML='<span class="mcaret">▍</span>';}

  async function fbNext(){
    if(!mirror.classList.contains("open")||!mFallback)return;
    const lines=mirrorFallback(),line=lines[mFbOrder[mFbIdx%mFbOrder.length]%lines.length];mFbIdx++;
    await mShow(line);
    mFbTimer=setTimeout(()=>{if(mirror.classList.contains("open")&&mFallback)fbNext();},reduce?800:4400);
  }
  function startFallback(){mFallback=true;mFbOrder=shuffle([...Array(mirrorFallback().length).keys()]);mFbIdx=0;fbNext();}

  async function openMirror(){
    const b=$("mirrorBtn").querySelector(".glyph").getBoundingClientRect();
    mirror.style.setProperty("--ox",((b.left+b.width/2)/innerWidth*100).toFixed(1)+"%");
    mirror.style.setProperty("--oy",((b.top+b.height/2)/innerHeight*100).toFixed(1)+"%");
    mirror.setAttribute("aria-hidden","false");
    try{
      if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw 0;
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});
      cam.srcObject=stream;cam.style.opacity=1;voidNote.classList.remove("show");
    }catch(e){
      cam.style.opacity=0;voidNote.textContent=t("mirror.dark");voidNote.classList.add("show");
    }
    requestAnimationFrame(()=>mirror.classList.add("open"));
    mApi=[];mFallback=false;mBusy=true;clearTimeout(mFbTimer);clearTimeout(mGreetTimer);mirror.classList.remove("clear");cam.classList.remove("pulse");
    setTimeout(()=>input&&null,0);
    // sabit giriş cümlesi; sonra yazı yavaşça kaybolur ve geriye yalnızca yansıma kalır
    try{await mShow(greet("mirror"),i18n.lang());}
    finally{mBusy=false;}
    mGreetTimer=setTimeout(()=>{if(mirror.classList.contains("open")){fadeSpeech();revealCam();}},reduce?800:2600);
  }
  async function mSend(){
    const t=mInput.value.trim();if(!t||mBusy)return;mInput.value="";clearTimeout(mGreetTimer);revealCam();
    if(mFallback){const lines=mirrorFallback(),line=lines[Math.floor(Math.random()*lines.length)];await mShow(line);return;}
    mApi.push({role:"user",content:t});mBusy=true;mWaiting();
    try{const {text:line,lang:lineLang}=await ask("mirror",mApi);mApi.push({role:"assistant",content:line});await mShow(line,lineLang);}
    catch(e){startFallback();}
    finally{mBusy=false;}
  }
  function closeMirror(){
    stopSpeak();mirror.classList.remove("open");clearTimeout(mFbTimer);clearTimeout(mGreetTimer);mFallback=false;
    if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;cam.srcObject=null;}
    cam.style.opacity=0;
    setTimeout(()=>{mirror.setAttribute("aria-hidden","true");mirror.classList.remove("clear");cam.classList.remove("pulse");speech.textContent="";voidNote.classList.remove("show");mApi=[];},reduce?0:1200);
  }

  /* ---- THEME ---- */
  const root=document.documentElement,themeBtn=$("themeToggle");
  function applyTheme(t){
    const light=t==="light";
    if(light)root.setAttribute("data-theme","light");else root.removeAttribute("data-theme");
    document.querySelector('meta[name="color-scheme"]').content=light?"light":"dark";
    document.querySelector('meta[name="theme-color"]').content=light?"#faf8f5":"#0a0806";
    themeBtn.setAttribute("aria-pressed",String(light));
  }
  applyTheme(root.getAttribute("data-theme")==="light"?"light":"dark");
  function setTheme(t){applyTheme(t);try{localStorage.setItem("archon-theme",t);}catch(e){}syncSettings();}
  themeBtn.addEventListener("click",()=>setTheme(root.getAttribute("data-theme")==="light"?"dark":"light"));

  /* ---- ACCENT (Gold / Silver) ---- */
  const accentBtn=$("accentToggle");
  function applyAccent(a){
    const silver=a==="silver";
    if(silver)root.setAttribute("data-accent","silver");else root.removeAttribute("data-accent");
    accentBtn.setAttribute("aria-pressed",String(silver));accentBtn.setAttribute("aria-label",t("aria.accent",{c:t(silver?"silver":"gold")}));

  const IDB=(()=>{
    let dbp=null;
    function db(){
      if(!dbp)dbp=new Promise((res,rej)=>{

  /* ---- colour ---- */
  function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0,s=0;

  // one-off palette per image: 48×48 sample, weighted k-means (k=4); near-black/white and grey pixels count less
  function extractPalette(src,w,h){
    const S=48,c=document.createElement("canvas");c.width=S;c.height=S;const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(src,0,0,w,h,0,0,S,S);
    const d=x.getImageData(0,0,S,S).data,px=[];let L=0,Sat=0,n=0,hash=2166136261;
    for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2];hash=Math.imul(hash^((r>>3)<<10|(g>>3)<<5|(b>>3)),16777619);
      if(d[i+3]<128)continue;const hs=rgb2hsl(r,g,b),s=hs[1],l=hs[2];L+=l;Sat+=s;n++;

    const K=4,cent=[px.reduce((a,p)=>p[3]>a[3]?p:a,px[0]).slice(0,3)],dist=(p,c0)=>(p[0]-c0[0])**2+(p[1]-c0[1])**2+(p[2]-c0[2])**2;

     One page ("main"). Every item keeps the original image untouched; its shape is a mask drawn at render time.
     item = {id, boardId:"main", type:"photo" (later "sticker" | "text" | "drawing"), x, y, w, h (fractions of the page width), rotation, z,
             shape, shapeParams {crop, points, feather, seed, lock, flip}, outline {enabled, width, color}, imageId, filter:null, note, createdAt}

  const boardEl=$("board"),REF_W=960;   // outline / feather widths are defined for a 960px-wide page and scale with it
  let board=null,editMode=false,sel=null,renderSeq=0;
  const pageW=()=>boardEl.clientWidth||1;
  const SHAPES=["original","square","rect","circle","oval","rounded","heart","triangle","star","flower","torn","lasso"];
  const SQUARE={square:1,circle:1,rounded:1,heart:1,triangle:1,star:1,flower:1};
  function shapeAspect(shape,rec,sp){if(SQUARE[shape])return 1;if(shape==="oval")return 1.28;
    if(shape==="lasso"&&sp&&sp.crop)return (sp.crop.h*rec.h)/(sp.crop.w*rec.w);return rec.h/rec.w;}   // h / w
  function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let q=Math.imul(a^a>>>15,1|a);q=q+Math.imul(q^q>>>7,61|q)^q;return((q^q>>>14)>>>0)/4294967296;};}

  const polyCache=new Map();

    else if(shape==="flower")for(let i=0;i<144;i++){const a=i/144*Math.PI*2,r=.5*(.8+.2*Math.cos(6*a));pts.push([.5+r*Math.cos(a),.5+r*Math.sin(a)]);}
    else if(shape==="torn"){const rnd=mulberry32(seed||1),j=()=>.012+rnd()*.03,st=.03;
      for(let x=0;x<1;x+=st)pts.push([x,j()]);for(let y=0;y<1;y+=st)pts.push([1-j(),y]);for(let x=1;x>0;x-=st)pts.push([x,1-j()]);for(let y=1;y>0;y-=st)pts.push([j(),y]);}

  const HEART=[["M",.5,.95],["C",.2,.74,0,.54,0,.3],["C",0,.13,.13,0,.29,0],["C",.39,0,.46,.05,.5,.13],["C",.54,.05,.61,0,.71,0],["C",.87,0,1,.13,1,.3],["C",1,.54,.8,.74,.5,.95]];
  const f1=v=>(Math.round(v*10)/10);
  // closed Catmull-Rom through the lasso points → cubic Béziers
  function smoothD(pts,w,h){const n=pts.length;if(n<3)return "";const P=i=>pts[(i+n)%n];let d=`M${f1(P(0)[0]*w)} ${f1(P(0)[1]*h)}`;

      d+=`C${f1((p1[0]+(p2[0]-p0[0])/6)*w)} ${f1((p1[1]+(p2[1]-p0[1])/6)*h)} ${f1((p2[0]-(p3[0]-p1[0])/6)*w)} ${f1((p2[1]-(p3[1]-p1[1])/6)*h)} ${f1(p2[0]*w)} ${f1(p2[1]*h)}`;}return d+"Z";}
  // the mask element for a shape at w×h pixels (null = plain rectangle)
  function shapeMarkup(it,w,h,attrs){
    const sp=it.shapeParams||{},sh=it.shape;

    if(sh==="rounded")return `<rect width="${f1(w)}" height="${f1(h)}" rx="${f1(Math.min(w,h)*.18)}"${attrs}/>`;
    if(sh==="heart")return `<path d="${HEART.map(([c,...n])=>c+n.map((v,i)=>f1(v*(i%2?h:w))).join(" ")).join("")}Z"${attrs}/>`;

  // one item as SVG: image (cropped to the lasso box, covering the frame) → mask (shape, optional soft edge) → optional white die-cut edge (feMorphology)
  function itemSVG(it,rec,w,h,idp,scale){

    const pad=Math.ceil(ow+fe*2+3),cr=sp.crop||{x:0,y:0,w:1,h:1},k=Math.max(w/(cr.w*rec.w),h/(cr.h*rec.h)),iw=rec.w*k,ih=rec.h*k,ix=w/2-(cr.x+cr.w/2)*iw,iy=h/2-(cr.y+cr.h/2)*ih;

    if(ow)defs+=`<filter id="o${idp}" filterUnits="userSpaceOnUse" x="${-pad}" y="${-pad}" width="${f1(w+2*pad)}" height="${f1(h+2*pad)}" color-interpolation-filters="sRGB"><feMorphology in="SourceAlpha" operator="dilate" radius="${ow.toFixed(2)}" result="d"/><feFlood flood-color="${ol.color||"#ffffff"}"/><feComposite in2="d" operator="in" result="o"/><feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;

      `<g${ow?` filter="url(#o${idp})"`:""}><g${sp.flip?` transform="translate(${f1(w)} 0) scale(-1 1)"`:""}><g${geom?` mask="url(#m${idp})"`:""}>${img}</g></g></g></svg>`;
  }

  /* ---- board state, saving, undo / redo (last 30) ---- */
  function newBoard(){return {id:"main",height:1.1,updatedAt:Date.now(),items:[]};}
  let saveT=null;
  function saveBoard(now){if(!board)return;board.updatedAt=Date.now();clearTimeout(saveT);const go=()=>IDB.put("boards",board).catch(e=>pfSay(errText(e)));if(now)go();else saveT=setTimeout(go,300);}
  let undoStack=[],redoStack=[],snap="";
  const snapshot=()=>JSON.stringify({h:board.height,items:board.items});
  function growBoard(){const w=pageW(),margin=400/w;let bottom=0;
    for(const it of board.items){const a=it.rotation*Math.PI/180,eh=Math.abs(it.w*Math.sin(a))+Math.abs(it.h*Math.cos(a));bottom=Math.max(bottom,it.y+it.h/2+eh/2);}
    if(bottom>board.height-margin)board.height=bottom+margin;}
  function commit(){growBoard();const s=snapshot();if(s===snap)return;if(snap){undoStack.push(snap);if(undoStack.length>30)undoStack.shift();}redoStack=[];snap=s;saveBoard();updateUndo();boardEl.style.height=boardPx()+"px";}
  function restore(s){const o=JSON.parse(s);board.height=o.h;board.items=o.items;snap=s;sel=board.items.find(i=>i.id===sel)?sel:null;saveBoard();renderBoard();updateUndo();}
  function updateUndo(){$("clUndo").disabled=!undoStack.length;$("clRedo").disabled=!redoStack.length;}
  $("clUndo").addEventListener("click",()=>{if(!undoStack.length)return;redoStack.push(snap);restore(undoStack.pop());});
  $("clRedo").addEventListener("click",()=>{if(!redoStack.length)return;undoStack.push(snap);restore(redoStack.pop());});
  const maxZ=()=>board.items.reduce((m,i)=>Math.max(m,i.z),0),minZ=()=>board.items.reduce((m,i)=>Math.min(m,i.z),0);
  const curItem=()=>sel&&board?board.items.find(i=>i.id===sel)||null:null;
  // centres stay on the page so nothing gets lost
  function clampItem(it){const cx=Math.min(1,Math.max(0,it.x+it.w/2)),cy=Math.min(board.height,Math.max(0,it.y+it.h/2));it.x=cx-it.w/2;it.y=cy-it.h/2;}
  // images nobody uses any more (after editing ends) are removed from the device
  async function gcImages(){const used=new Set(board.items.map(i=>i.imageId));for(const rec of images.filter(i=>i.kind==="photo"&&!used.has(i.id)))await removeImage(rec.id);}

  /* ---- rendering ---- */
  const boardPx=()=>Math.max(board.height*pageW(),editMode?520:0,board.items.length?0:520);
  function renderBoard(){
    if(!board)return;boardEl.style.height=boardPx()+"px";boardEl.classList.toggle("is-edit",editMode);
    boardEl.querySelectorAll(".bitem").forEach(n=>n.remove());$("boardEmpty").hidden=board.items.length>0;
    const frag=document.createDocumentFragment();board.items.slice().sort((a,b)=>a.z-b.z).forEach(it=>frag.appendChild(itemNode(it)));boardEl.appendChild(frag);
    showTools();
  }
  function itemNode(it){
    const el=document.createElement("div");el.className="bitem"+(editMode&&it.id===sel?" is-sel":"");el.dataset.id=it.id;el.tabIndex=0;el.setAttribute("role","button");
    el.setAttribute("aria-label",t("photos.alt",{date:fmtDate(it.createdAt)})+(it.note?" — "+it.note:""));
    for(const h of ["nw","ne","se","sw","rot"]){const k=document.createElement("span");k.className="bh bh-"+h;k.dataset.h=h;k.setAttribute("aria-hidden","true");el.appendChild(k);}
    paintItem(el,it);return el;
  }
  function paintItem(el,it){
    const w=pageW(),pw=it.w*w,ph=it.h*w,rec=imageById(it.imageId);
    el.style.width=pw+"px";el.style.height=ph+"px";el.style.zIndex=String(1000+it.z);el.style.transform=`translate(${it.x*w}px,${it.y*w}px) rotate(${it.rotation}deg)`;
    if(!rec)return;

  }
  function repaint(it){const el=boardEl.querySelector(`.bitem[data-id="${it.id}"]`);if(el)paintItem(el,it);}

  /* ---- adding photos: every photo gets a shape (sheet with live previews; "apply to all" + remembered last shape) ---- */
  function newItem(rec,shape,sp){
    const w=pageW(),a=shapeAspect(shape,rec,sp);let iw=.42,ih=iw*a;if(ih>.6){ih=.6;iw=ih/a;}
    const r=boardEl.getBoundingClientRect(),vt=Math.max(r.top,0),vb=Math.min(r.bottom,innerHeight);
    let cy=(vb-vt>80?(vt+vb)/2-r.top:Math.min(r.height,innerHeight)/2)/w;const cx=.5+(Math.random()-.5)*.24;cy+=(Math.random()-.5)*.16;

      shape,shapeParams:Object.assign({lock:true,seed:(Math.random()*1e9)|0},sp),outline:{enabled:false,width:6,color:"#ffffff"},imageId:rec.id,filter:null,note:"",createdAt:Date.now()};
    if(it.y+it.h>board.height)board.height=it.y+it.h+.1;clampItem(it);return it;
  }
  async function addFlow(files){
    files=[...files];if(!files.length)return;await init();askPersist();const n=files.length;let shapeAll=null;let added=0;
    for(let i=0;i<n;i++){
      pfSay(t("photos.adding",{i:i+1,n}),true);
      let rec;try{rec=await ingest(files[i],"photo");await IDB.put("images",rec);images.push(rec);}catch(e){pfSay(errText(e));if(isQuota(e))return;continue;}
      let shape=shapeAll;
      if(!shape){const r=await openSheet({rec,index:i+1,total:n});if(!r){await removeImage(rec.id);break;}shape=r.shape;if(r.all&&n-i>1)shapeAll=shape;saveProfile({lastShape:shape});}
      let sp={};
      if(shape==="lasso"){const L=await openLasso(rec);if(L)sp={crop:L.crop,points:L.points,feather:L.feather};else shape="original";}
      board.items.push(newItem(rec,shape,sp));commit();renderBoard();added++;

    if(added){pfSay(t("photos.adding",{i:n,n}),true);pfDone();checkQuota();}
  }
  $("clAdd").addEventListener("click",()=>$("photoFile").click());
  $("photoFile").addEventListener("change",()=>{const f=$("photoFile").files,l=f?[...f]:[];$("photoFile").value="";addFlow(l);});

  /* ---- shape sheet ---- */
  const sheetEl=$("sheet");let sheetState=null;
  function openSheet({rec,index,total,current}){return new Promise(res=>{
    const last=current||getProfile().lastShape||"original",multi=total>1&&index<total;
    sheetState={res,prevFocus:document.activeElement};
    $("sheetSub").textContent=total>1?t("sheet.count",{i:index,n:total}):"";$("sheetAllWrap").hidden=!multi;
    const grid=$("sheetGrid");grid.replaceChildren(...SHAPES.map(sh=>{
      const b=document.createElement("button");b.className="sh-opt";b.setAttribute("aria-pressed",String(sh===last));b.dataset.shape=sh;
      const pv=document.createElement("span");pv.className="sh-prev";
      if(sh==="lasso")pv.innerHTML=`<svg viewBox="0 0 58 58" width="58" height="58" style="left:0;top:0" aria-hidden="true"><path d="M14 30c-2-11 8-19 19-18s15 9 11 17-13 12-21 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="3 3" stroke-linecap="round"/><path d="M19 39c-4 3-4 8 0 10 3 1 6-1 6-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`;
      else{const a=shapeAspect(sh,rec,null);let w=58,h=58*a;if(h>58){h=58;w=58/a;}const fake={shape:sh,shapeParams:{seed:7},outline:{enabled:false}};
        pv.insertAdjacentHTML("beforeend",itemSVG(fake,rec,w,h,"s"+sh+(++renderSeq),.05).replace('style="left:','style="margin-left:'+f1((58-w)/2)+'px;margin-top:'+f1((58-h)/2)+'px;left:'));}
      const lb=document.createElement("span");lb.textContent=t("shape."+sh);b.append(pv,lb);
      b.addEventListener("click",()=>closeSheet({shape:sh,all:$("sheetAll").checked}));return b;}));
    sheetEl.hidden=false;requestAnimationFrame(()=>{sheetEl.classList.add("show");(grid.querySelector('[aria-pressed="true"]')||grid.firstChild).focus();});
  });}
  function closeSheet(result){if(!sheetState)return;const {res,prevFocus}=sheetState;sheetState=null;sheetEl.classList.remove("show");setTimeout(()=>{if(!sheetState)sheetEl.hidden=true;},reduce?0:350);
    if(prevFocus&&prevFocus.isConnected)prevFocus.focus();res(result);}
  $("sheetCancel").addEventListener("click",()=>closeSheet(null));
  sheetEl.addEventListener("click",e=>{if(e.target===sheetEl)closeSheet(null);});
  sheetEl.addEventListener("keydown",e=>{if(e.key==="Escape"){e.stopPropagation();closeSheet(null);}});

  /* ---- view mode ↔ edit mode ---- */
  function setEdit(on){
    editMode=on;$("collage").classList.toggle("is-editing",on);$("clEdit").hidden=on;$("clDone").hidden=!on;$("clUndo").hidden=!on;$("clRedo").hidden=!on;

  }
  $("clEdit").addEventListener("click",()=>setEdit(true));
  $("clDone").addEventListener("click",()=>setEdit(false));
  function selectItem(id){sel=id;boardEl.querySelectorAll(".bitem").forEach(n=>n.classList.toggle("is-sel",n.dataset.id===id));showTools();}
  // the floating tools only show while the page itself is on screen
  let boardOnScreen=true;
  if("IntersectionObserver" in window)new IntersectionObserver(es=>{boardOnScreen=es[0].isIntersecting;showTools();},{threshold:.05}).observe(boardEl);
  function showTools(){
    const it=editMode&&boardOnScreen?curItem():null;$("clTools").hidden=!it;if(!it){$("clEdge").hidden=true;$("clConfirm").hidden=true;$("tEdge").setAttribute("aria-expanded","false");return;}
    $("tLock").setAttribute("aria-pressed",String(it.shapeParams.lock!==false));$("tFlip").setAttribute("aria-pressed",String(!!it.shapeParams.flip));
    $("edgeOn").checked=!!it.outline.enabled;$("edgeWidth").value=it.outline.width;$("edgeFeather").value=it.shapeParams.feather||0;
  }

  /* ---- pointer: view mode taps open the viewer; edit mode moves, resizes (ratio lock), rotates, pinches ---- */

  boardEl.addEventListener("pointerdown",e=>{
    const el=e.target.closest(".bitem");
    if(!editMode){tap=el?{id:el.dataset.id,x:e.clientX,y:e.clientY,t:performance.now()}:null;return;}
    if(gesture&&bPtrs.size===1){   // a second finger turns the drag into pinch + rotate

    if(!el){if(sel){sel=null;boardEl.querySelectorAll(".bitem.is-sel").forEach(n=>n.classList.remove("is-sel"));showTools();}return;}
    const it=board.items.find(i=>i.id===el.dataset.id);if(!it)return;
    e.preventDefault();if(sel!==it.id)selectItem(it.id);el.focus({preventScroll:true});
    boardEl.setPointerCapture(e.pointerId);bPtrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const h=e.target.dataset&&e.target.dataset.h;gesture=gestureStart(h==="rot"?"rot":h?"resize":"move",it,el,{handle:h,px:e.clientX,py:e.clientY});el.classList.add("is-drag");
  });
  boardEl.addEventListener("pointermove",e=>{
    if(!gesture||!bPtrs.has(e.pointerId))return;bPtrs.set(e.pointerId,{x:e.clientX,y:e.clientY});const g=gesture,it=g.it,s=g.s,MIN=.05;
    if(g.type==="pinch"){if(bPtrs.size<2)return;const [p1,p2]=[...bPtrs.values()],k=Math.max(.15,Math.hypot(p2.x-p1.x,p2.y-p1.y)/g.d),a=Math.atan2(p2.y-p1.y,p2.x-p1.x);
      const cx=g.x+g.w/2+((p1.x+p2.x)/2-g.mx)/s,cy=g.y+g.h/2+((p1.y+p2.y)/2-g.my)/s;it.w=Math.max(MIN,g.w*k);it.h=it.w*g.h/g.w;it.x=cx-it.w/2;it.y=cy-it.h/2;it.rotation=snapRot(g.rot+(a-g.a)*180/Math.PI);}

      const sx=g.handle.includes("e")?1:-1,sy=g.handle.includes("s")?1:-1;let w=Math.max(MIN,g.w+sx*lx),h=Math.max(MIN,g.h+sy*ly);
      if(it.shapeParams.lock!==false){const k=Math.max(w/g.w,h/g.h);w=Math.max(MIN,g.w*k);h=w*g.h/g.w;}
      const fx=-sx*g.w/2,fy=-sy*g.h/2,ncx=fx+sx*w/2,ncy=fy+sy*h/2,wx=ncx*Math.cos(th)-ncy*Math.sin(th),wy=ncx*Math.sin(th)+ncy*Math.cos(th);

  });
  const bUp=e=>{
    if(!editMode){if(tap&&e.type==="pointerup"&&Math.hypot(e.clientX-tap.x,e.clientY-tap.y)<8&&performance.now()-tap.t<600)openViewer(tap.id);tap=null;return;}
    if(!bPtrs.has(e.pointerId))return;bPtrs.delete(e.pointerId);if(!gesture)return;
    if(bPtrs.size===1){const p=[...bPtrs.values()][0];gesture=gestureStart("move",gesture.it,gesture.el,{px:p.x,py:p.y});}
    else if(!bPtrs.size){gesture.el.classList.remove("is-drag");gesture=null;commit();}
  };
  boardEl.addEventListener("pointerup",bUp);boardEl.addEventListener("pointercancel",e=>{tap=null;bUp(e);});
  boardEl.addEventListener("focusin",e=>{const el=e.target.closest(".bitem");if(editMode&&el&&sel!==el.dataset.id)selectItem(el.dataset.id);});
  let keyCommitT=null;
  boardEl.addEventListener("keydown",e=>{
    const el=e.target.closest(".bitem");if(!el)return;
    if(!editMode){if(e.key==="Enter"||e.key===" "){e.preventDefault();openViewer(el.dataset.id);}return;}
    const it=curItem();if(!it)return;const st=e.shiftKey?.02:.005;let used=true;
    const scale=k=>{const cx=it.x+it.w/2,cy=it.y+it.h/2;it.w=Math.max(.05,it.w*k);it.h=Math.max(.05,it.h*k);it.x=cx-it.w/2;it.y=cy-it.h/2;};
    switch(e.key){case"ArrowLeft":it.x-=st;break;case"ArrowRight":it.x+=st;break;case"ArrowUp":it.y-=st;break;case"ArrowDown":it.y+=st;break;
      case"+":case"=":scale(1.06);break;case"-":scale(1/1.06);break;case"[":it.rotation=snapRot(it.rotation-3);break;case"]":it.rotation=snapRot(it.rotation+3);break;
      case"Delete":case"Backspace":$("tDelete").click();break;case"Escape":e.stopPropagation();sel=null;el.blur();renderBoard();return;default:used=false;}
    if(used){e.preventDefault();clampItem(it);paintItem(el,it);clearTimeout(keyCommitT);keyCommitT=setTimeout(commit,350);}   // one undo step per burst of key presses
  });

  /* ---- edit tools ---- */
  async function changeShape(){
    const it=curItem(),rec=it&&imageById(it.imageId);if(!rec)return;
    const r=await openSheet({rec,index:1,total:1,current:it.shape});if(!r)return;let shape=r.shape,sp=Object.assign({},it.shapeParams);
    if(shape==="lasso"){const L=await openLasso(rec,sp.points?sp:null);if(!L)return;Object.assign(sp,{crop:L.crop,points:L.points,feather:L.feather});}
    else{delete sp.crop;delete sp.points;}
    const area=it.w*it.h,a=shapeAspect(shape,rec,sp),cx=it.x+it.w/2,cy=it.y+it.h/2;it.shape=shape;it.shapeParams=sp;it.w=Math.sqrt(area/a);it.h=it.w*a;it.x=cx-it.w/2;it.y=cy-it.h/2;
    clampItem(it);repaint(it);commit();saveProfile({lastShape:shape});
  }
  $("tShape").addEventListener("click",changeShape);
  $("tEdge").addEventListener("click",()=>{const p=$("clEdge"),open=p.hidden;p.hidden=!open;$("tEdge").setAttribute("aria-expanded",String(open));});
  $("edgeOn").addEventListener("change",()=>{const it=curItem();if(!it)return;it.outline=Object.assign({},it.outline,{enabled:$("edgeOn").checked});repaint(it);commit();});
  $("edgeWidth").addEventListener("input",()=>{const it=curItem();if(!it)return;it.outline=Object.assign({},it.outline,{width:+$("edgeWidth").value,enabled:true});$("edgeOn").checked=true;repaint(it);});
  $("edgeWidth").addEventListener("change",commit);
  $("edgeFeather").addEventListener("input",()=>{const it=curItem();if(!it)return;it.shapeParams=Object.assign({},it.shapeParams,{feather:+$("edgeFeather").value});repaint(it);});
  $("edgeFeather").addEventListener("change",commit);
  $("tLock").addEventListener("click",()=>{const it=curItem();if(!it)return;it.shapeParams=Object.assign({},it.shapeParams,{lock:it.shapeParams.lock===false});showTools();commit();});
  $("tFront").addEventListener("click",()=>{const it=curItem();if(!it)return;it.z=maxZ()+1;repaint(it);commit();});
  $("tBack").addEventListener("click",()=>{const it=curItem();if(!it)return;it.z=minZ()-1;repaint(it);commit();});
  $("tDup").addEventListener("click",()=>{const it=curItem();if(!it)return;const c=JSON.parse(JSON.stringify(it));Object.assign(c,{id:uid("e"),x:it.x+.04,y:it.y+.04,z:maxZ()+1,createdAt:Date.now()});
    clampItem(c);board.items.push(c);sel=c.id;commit();renderBoard();});
  $("tFlip").addEventListener("click",()=>{const it=curItem();if(!it)return;it.shapeParams=Object.assign({},it.shapeParams,{flip:!it.shapeParams.flip});repaint(it);showTools();commit();});
  $("tDelete").addEventListener("click",()=>{if(!curItem())return;$("clConfirm").hidden=false;$("clNo").focus();});
  $("clNo").addEventListener("click",()=>{$("clConfirm").hidden=true;});
  $("clYes").addEventListener("click",()=>{board.items=board.items.filter(i=>i.id!==sel);sel=null;commit();renderBoard();});

  /* ---- viewer (view mode): swipe between items, date, note, delete (asks first) ---- */
  const viewer=$("viewer");let vwList=[],vwIndex=0,vwNoteTimer=null,vwPrevFocus=null;
  function openViewer(id){
    vwList=board.items.slice().sort((a,b)=>(a.y+a.h/2)-(b.y+b.h/2)||(a.x-b.x));const i=vwList.findIndex(x=>x.id===id);if(i<0)return;
    vwPrevFocus=document.activeElement;viewer.hidden=false;requestAnimationFrame(()=>viewer.classList.add("show"));showViewer(i);$("vwClose").focus();
  }
  function closeViewer(){flushVwNote();viewer.classList.remove("show");setTimeout(()=>{viewer.hidden=true;$("vwImg").removeAttribute("src");},reduce?0:350);if(vwPrevFocus&&vwPrevFocus.isConnected)vwPrevFocus.focus();}
  function showViewer(i){
    flushVwNote();if(!vwList.length){closeViewer();return;}
    vwIndex=Math.max(0,Math.min(i,vwList.length-1));const it=vwList[vwIndex],rec=imageById(it.imageId);
    if(rec)$("vwImg").src=urlOf(rec);$("vwImg").alt=t("photos.alt",{date:fmtDate(it.createdAt)});$("vwCount").textContent=(vwIndex+1)+" / "+vwList.length;
    $("vwDate").textContent=fmtDate(it.createdAt);$("vwCaption").value=it.note||"";
    $("vwPrev").disabled=vwIndex===0;$("vwNext").disabled=vwIndex===vwList.length-1;$("vwConfirm").hidden=true;$("vwActions").hidden=false;
  }
  function flushVwNote(){if(!vwNoteTimer)return;clearTimeout(vwNoteTimer);vwNoteTimer=null;const it=vwList[vwIndex];if(!it)return;it.note=$("vwCaption").value.trim();saveBoard();
    const el=boardEl.querySelector(`.bitem[data-id="${it.id}"]`);if(el)el.setAttribute("aria-label",t("photos.alt",{date:fmtDate(it.createdAt)})+(it.note?" — "+it.note:""));}
  $("vwCaption").addEventListener("input",()=>{clearTimeout(vwNoteTimer);vwNoteTimer=setTimeout(flushVwNote,600);});
  $("vwCaption").addEventListener("blur",flushVwNote);
  $("vwClose").addEventListener("click",closeViewer);
  $("vwPrev").addEventListener("click",()=>showViewer(vwIndex-1));
  $("vwNext").addEventListener("click",()=>showViewer(vwIndex+1));
  $("vwDelete").addEventListener("click",()=>{$("vwActions").hidden=true;$("vwConfirm").hidden=false;$("vwNo").focus();});
  $("vwNo").addEventListener("click",()=>{$("vwConfirm").hidden=true;$("vwActions").hidden=false;$("vwDelete").focus();});
  $("vwYes").addEventListener("click",async()=>{
    const it=vwList[vwIndex];clearTimeout(vwNoteTimer);vwNoteTimer=null;
    board.items=board.items.filter(i=>i.id!==it.id);saveBoard(true);
    if(!board.items.some(i=>i.imageId===it.imageId))await removeImage(it.imageId);
    vwList.splice(vwIndex,1);renderBoard();pfSay(t("photos.deleted"));
    if(vwList.length)showViewer(Math.min(vwIndex,vwList.length-1));else closeViewer();
  });
  document.addEventListener("keydown",e=>{
    if(viewer.hidden)return;
    if(e.key==="Escape"){e.stopPropagation();e.preventDefault();if(!$("vwConfirm").hidden)$("vwNo").click();else closeViewer();return;}
    if(e.target===$("vwCaption"))return;const rtl=root.dir==="rtl";
    if(e.key==="ArrowRight"){e.preventDefault();showViewer(vwIndex+(rtl?-1:1));}
    if(e.key==="ArrowLeft"){e.preventDefault();showViewer(vwIndex+(rtl?1:-1));}
  },true);
  let swX=null;
  $("vwStage").addEventListener("pointerdown",e=>{if(e.pointerType!=="mouse")swX=e.clientX;});
  $("vwStage").addEventListener("pointerup",e=>{if(swX===null)return;const dx=e.clientX-swX;swX=null;if(Math.abs(dx)<50)return;const rtl=root.dir==="rtl";showViewer(vwIndex+((dx<0)!==rtl?1:-1));});
  $("vwStage").addEventListener("pointercancel",()=>{swX=null;});

  /* ---- lasso: draw a closed line → simplified (Ramer–Douglas–Peucker) → smoothed (Catmull-Rom) at render time;
     closes itself when the end comes within 24px of the start or the finger lifts; stored as a 0..1 path (the photo is never cut) ---- */
  const editorEl=$("editor"),edImg=$("edImg"),edLasso=$("edLasso");let ed=null,drawing=false;
  function openLasso(rec,prev){return new Promise(res=>{
    ed={res,cur:[],hist:[],closed:null,prevFocus:document.activeElement};$("edHint").textContent=t("lasso.hint");$("edFeather").value=prev&&prev.feather!=null?prev.feather:1.5;
    edImg.onload=()=>{editorEl.hidden=false;requestAnimationFrame(()=>{if(!ed)return;sizeLasso();$("edApply").focus();});};edImg.src=urlOf(rec);});}
  function closeLasso(result){if(!ed)return;const {res,prevFocus}=ed;ed=null;editorEl.hidden=true;edImg.removeAttribute("src");if(prevFocus&&prevFocus.isConnected)prevFocus.focus();res(result);}
  function sizeLasso(){const dpr=Math.min(2,devicePixelRatio||1);edLasso.width=Math.round(edImg.clientWidth*dpr);edLasso.height=Math.round(edImg.clientHeight*dpr);drawLasso();}
  function rdp(pts,eps){if(pts.length<3)return pts.slice();const a=pts[0],b=pts[pts.length-1],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1;let dmax=0,idx=0;
    for(let i=1;i<pts.length-1;i++){const d=Math.abs(dy*pts[i][0]-dx*pts[i][1]+b[0]*a[1]-b[1]*a[0])/L;if(d>dmax){dmax=d;idx=i;}}
    if(dmax>eps){const l=rdp(pts.slice(0,idx+1),eps),r=rdp(pts.slice(idx),eps);return l.slice(0,-1).concat(r);}return [a,b];}
  const polyArea=p=>Math.abs(p.reduce((s,q,i)=>{const r=p[(i+1)%p.length];return s+q[0]*r[1]-r[0]*q[1];},0))/2;
  function drawLasso(){
    const x=edLasso.getContext("2d"),W=edLasso.width,H=edLasso.height;x.clearRect(0,0,W,H);if(!ed)return;
    const accent=getComputedStyle(root).getPropertyValue("--accent").trim()||"#d4af6a",k=W/(edLasso.clientWidth||1);
    if(ed.closed){x.fillStyle="rgba(0,0,0,.58)";x.fillRect(0,0,W,H);x.globalCompositeOperation="destination-out";const p=new Path2D(smoothD(ed.closed,W,H));x.fill(p);x.globalCompositeOperation="source-over";
      x.strokeStyle=accent;x.lineWidth=2*k;x.stroke(p);}
    if(ed.cur.length>1){x.strokeStyle=accent;x.lineWidth=2*k;x.setLineDash([6*k,4*k]);x.beginPath();ed.cur.forEach((p,i)=>i?x.lineTo(p[0]*W,p[1]*H):x.moveTo(p[0]*W,p[1]*H));x.stroke();x.setLineDash([]);
      const s=ed.cur[0];x.beginPath();x.arc(s[0]*W,s[1]*H,5*k,0,7);x.fillStyle=accent;x.fill();}
  }
  function finishStroke(){
    drawing=false;const r=edLasso.getBoundingClientRect(),pts=ed.cur;ed.cur=[];
    if(pts.length<6){drawLasso();return;}
    const px=pts.map(p=>[p[0]*r.width,p[1]*r.height]),simple=rdp(px,1.6);
    if(simple.length<4||polyArea(simple)<r.width*r.height*.012){$("edHint").textContent=t("lasso.tooSmall");drawLasso();return;}
    if(ed.closed)ed.hist.push(ed.closed);ed.closed=simple.map(p=>[p[0]/r.width,p[1]/r.height]);$("edHint").textContent=t("lasso.hint");drawLasso();
  }
  const lassoPt=e=>{const r=edLasso.getBoundingClientRect();return [Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))];};
  edLasso.addEventListener("pointerdown",e=>{if(!ed)return;e.preventDefault();edLasso.setPointerCapture(e.pointerId);drawing=true;ed.cur=[lassoPt(e)];drawLasso();});
  edLasso.addEventListener("pointermove",e=>{if(!drawing||!ed)return;const r=edLasso.getBoundingClientRect(),p=lassoPt(e),l=ed.cur[ed.cur.length-1],s=ed.cur[0];
    if(Math.hypot((p[0]-l[0])*r.width,(p[1]-l[1])*r.height)<2.5)return;ed.cur.push(p);
    let len=0;for(let i=1;i<ed.cur.length;i++)len+=Math.hypot((ed.cur[i][0]-ed.cur[i-1][0])*r.width,(ed.cur[i][1]-ed.cur[i-1][1])*r.height);
    if(len>120&&Math.hypot((p[0]-s[0])*r.width,(p[1]-s[1])*r.height)<24){finishStroke();return;}
    drawLasso();});
  edLasso.addEventListener("pointerup",()=>{if(drawing&&ed)finishStroke();});
  edLasso.addEventListener("pointercancel",()=>{if(drawing&&ed)finishStroke();});
  $("edUndo").addEventListener("click",()=>{if(!ed)return;ed.closed=ed.hist.pop()||null;drawLasso();});
  $("edClear").addEventListener("click",()=>{if(!ed)return;if(ed.closed)ed.hist.push(ed.closed);ed.closed=null;ed.cur=[];drawLasso();});
  $("edCancel").addEventListener("click",()=>closeLasso(null));
  editorEl.addEventListener("keydown",e=>{if(e.key==="Escape"){e.stopPropagation();closeLasso(null);}});
  $("edApply").addEventListener("click",()=>{
    if(!ed)return;if(!ed.closed){$("edHint").animate&&$("edHint").animate([{opacity:.3},{opacity:1}],{duration:600,easing:"cubic-bezier(.4,0,.2,1)"});return;}
    const pts=ed.closed,xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),x0=Math.min(...xs),y0=Math.min(...ys),bw=Math.max(...xs)-x0,bh=Math.max(...ys)-y0;
    closeLasso({crop:{x:x0,y:y0,w:bw,h:bh},points:pts.map(p=>[+((p[0]-x0)/bw).toFixed(4),+((p[1]-y0)/bh).toFixed(4)]),feather:+$("edFeather").value});
  });

  /* ---- render + keep in sync ---- */
  async function renderProfile(){
    await init();const p=getProfile();
    if(document.activeElement!==$("visionInput")){$("visionInput").value=p.vision||"";autosize($("visionInput"));}
    if(document.activeElement!==$("nameInput"))$("nameInput").value=p.name||"";
    renderAiLine();renderSwatches();renderAvatar();await renderCover();renderBoard();positionHalo();
  }
  function relayoutProfile(){if(profileEl.hidden)return;layoutCover();drawReflection(false);layoutAvatar();positionHalo();renderBoard();}
  let pfResizeT=null;addEventListener("resize",()=>{clearTimeout(pfResizeT);pfResizeT=setTimeout(()=>{relayoutProfile();if(pos)sizePosFrame();if(ed)sizeLasso();},120);});
  // theme switch: presets, halo and tints are drawn differently in dark and light
  new MutationObserver(()=>{if(profileEl.hidden){coverKey="";return;}renderSwatches();renderCover();}).observe(root,{attributes:true,attributeFilter:["data-theme"]});
  document.addEventListener("i18n:change",()=>{if(profileEl.hidden)return;renderAiLine();renderAvatar();renderBoard();});
  syncSettings();setActive("home");

  /* ---- SETTINGS: sync code + history ---- */
  const syncNote=$("syncNote");let noteTimer=null,deleteArmed=null;
  function note(t){syncNote.textContent=t;clearTimeout(noteTimer);noteTimer=setTimeout(()=>{syncNote.textContent="";},5000);}
  function afterHistoryChange(){syncSettings();if(!historyEl.hidden)renderHistory();}
  $("syncCopy").addEventListener("click",async()=>{
    const code=syncCode(false);if(!code){note(t("note.noCode"));return;}
    try{await navigator.clipboard.writeText(code);note(t("note.copied"));}catch(e){note(t("note.copyFailed"));}
  });
  async function applyCode(){
    const code=normCode($("syncInput").value);
    if(!code){note(t("note.invalid"));return;}
    note(t("note.loading"));
    try{
      const best=await pullHistory(code,true);
      store(K_SYNC,code);$("syncInput").value="";afterHistoryChange();
      note(best?t("note.loaded",{name:NAMES[best.persona]}):t("note.empty"));
    }catch(e){note(t(e.status===429?"note.tooMany":"note.loadFailed"));}
  }
  $("syncApply").addEventListener("click",applyCode);
  $("syncInput").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();applyCode();}});
  $("historyDelete").addEventListener("click",async()=>{
    const btn=$("historyDelete");
    if(!deleteArmed){btn.textContent=t("settings.deleteConfirm");deleteArmed=setTimeout(()=>{deleteArmed=null;btn.textContent=t("settings.delete");},4000);return;}
    clearTimeout(deleteArmed);deleteArmed=null;btn.textContent=t("settings.delete");
    const code=syncCode(false);
    try{if(code)await historyCall(code,"delete");}catch(e){note(t("note.deleteFailed"));return;}
    try{localStorage.removeItem(K_CHATS);localStorage.removeItem(K_GONE);}catch(e){}
    afterHistoryChange();note(t("note.deleted"));
  });

  /* ---- SAFETY ---- */
  $("infoDot").addEventListener("click",()=>$("safety").classList.add("on"));
  const privacyEl=$("privacy"),privacyBtn=$("privacyToggle"),safetyCard=document.querySelector(".safety-card");
  function setPrivacy(open){privacyEl.hidden=!open;safetyCard.classList.toggle("wide",open);privacyBtn.textContent=t(open?"safety.hidePrivacy":"safety.privacy");privacyBtn.setAttribute("aria-expanded",String(open));if(open)privacyEl.scrollTop=0;}
  privacyBtn.addEventListener("click",()=>setPrivacy(privacyEl.hidden));
  $("safetyClose").addEventListener("click",()=>{$("safety").classList.remove("on");setPrivacy(false);});

  /* ---- wiring ---- */
  document.querySelectorAll("#threshold [data-persona]").forEach(el=>el.addEventListener("click",()=>enterChat(el.getAttribute("data-persona"))));
  $("mirrorBtn").addEventListener("click",openMirror);
  $("mClose").addEventListener("click",closeMirror);
  backBtn.addEventListener("click",backToGate);
  sendBtn.addEventListener("click",send);
  mSendBtn.addEventListener("click",mSend);
  input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}});
  mInput.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();mSend();}});
  input.addEventListener("input",()=>{input.style.height="2.7em";input.style.height=Math.min(input.scrollHeight,128)+"px";});
  document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(mirror.classList.contains("open"))closeMirror();else if(!moreSheet.hidden)toggleMore(false);else if(openPageAnyOpen())closePages();else if($("safety").classList.contains("on")){$("safety").classList.remove("on");setPrivacy(false);}}});
})();
</script>
