<html lang="tr">
<head>

<link rel="manifest" href='data:application/manifest+json,{"name":"ARCHON","short_name":"ARCHON","display":"standalone","orientation":"portrait","background_color":"%23030606","theme_color":"%23030606","start_url":"."}'>

<style>
  :root{
    --void:#030606;--spectral:#7bd3d6;--stone:#b7c6c7;--whisper:#5c7375;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --grain-tex:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='matrix' values='0 0 0 0 0.6 0 0 0 0 0.72 0 0 0 0 0.73 0 0 0 0.5 0'/></filter><rect width='120' height='120' filter='url(%23g)'/></svg>");
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:radial-gradient(120% 90% at 50% 40%,#060d0f 0%,var(--void) 52%,#010202 100%);color:var(--stone);font-family:var(--sans);overflow:hidden;position:relative;min-height:100dvh;-webkit-font-smoothing:antialiased;opacity:0;animation:pageIn 1.6s ease .1s forwards}
  @keyframes pageIn{to{opacity:1}}

  .fog{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .blob{position:absolute;border-radius:50%;mix-blend-mode:screen;filter:blur(46px)}
  .b1{width:70vmax;height:70vmax;left:22%;top:44%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(110,195,205,.06),transparent 60%);animation:d1 30s ease-in-out infinite}
  .b2{width:70vmax;height:70vmax;left:78%;top:48%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(216,180,90,.05),transparent 60%);animation:d2 34s ease-in-out infinite}
  .vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(120% 100% at 50% 44%,transparent 24%,rgba(0,0,0,.62) 70%,rgba(0,0,0,.96) 100%)}
  @keyframes d1{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-52%,-46%) scale(1.08)}}
  @keyframes d2{0%,100%{transform:translate(-50%,-50%) scale(1.05)}50%{transform:translate(-48%,-54%) scale(1)}}

  /* ---------- THRESHOLD (wordless) ---------- */
  #threshold{position:relative;z-index:5;min-height:100dvh;display:flex;align-items:center;justify-content:center;gap:clamp(1rem,5vw,3rem);padding:8vh 4vw;opacity:0;animation:rise 1.6s ease .6s forwards}
  .orb{border-radius:50%;border:1px solid;cursor:pointer;display:grid;place-items:center;overflow:hidden;position:relative;padding:0;transition:transform .5s cubic-bezier(.16,1,.3,1),box-shadow .5s ease,border-color .5s ease}
  .orb svg{width:130%;height:130%}
  .orb-side{width:clamp(96px,28vw,158px);aspect-ratio:1}
  .orb-dark{background:radial-gradient(circle,#0a1517 0%,#020506 72%);border-color:rgba(123,211,214,.28);box-shadow:0 0 30px rgba(0,0,0,.6),inset 0 0 22px rgba(0,0,0,.6)}
  .orb-light{background:radial-gradient(circle,#161311 0%,#040302 74%);border-color:rgba(255,225,160,.3);box-shadow:0 0 40px rgba(255,220,150,.1)}
  .orb-dark:hover,.orb-dark:focus-visible{transform:scale(1.07);border-color:rgba(123,211,214,.6);box-shadow:0 0 44px rgba(123,211,214,.24),inset 0 0 22px rgba(0,0,0,.5)}
  .orb-light:hover,.orb-light:focus-visible{transform:scale(1.07);border-color:rgba(255,232,175,.65);box-shadow:0 0 58px rgba(255,222,150,.3)}
  .orb:focus-visible,.mirror-btn:focus-visible{outline:none}
  .mirror-btn{width:clamp(110px,33vw,182px);aspect-ratio:1;border-radius:50%;cursor:pointer;padding:0;position:relative;overflow:hidden;
      border:1px solid rgba(170,185,188,.4);
      background:radial-gradient(circle at 50% 34%,rgba(78,100,104,.55),rgba(14,22,24,.9) 66%,#050809 100%);
      box-shadow:0 0 46px rgba(120,170,175,.14),inset 0 4px 20px rgba(200,230,235,.14),inset 0 -10px 26px rgba(0,0,0,.6);
      transition:transform .5s cubic-bezier(.16,1,.3,1),box-shadow .5s ease,border-color .5s ease}
  .mirror-btn::before{content:"";position:absolute;top:8%;left:12%;right:22%;height:34%;border-radius:50%;background:linear-gradient(160deg,rgba(220,240,242,.28),transparent 70%);filter:blur(3px);pointer-events:none}
  .mirror-btn::after{content:"";position:absolute;inset:0;background-image:var(--grain-tex);background-size:120px;mix-blend-mode:overlay;opacity:.3;pointer-events:none}
  .mirror-btn:hover,.mirror-btn:focus-visible{transform:scale(1.06);border-color:rgba(200,220,222,.7);box-shadow:0 0 64px rgba(150,200,205,.28),inset 0 4px 22px rgba(210,235,240,.2),inset 0 -10px 26px rgba(0,0,0,.55)}
  .mirror-shimmer{position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(210,240,245,.14) 50%,transparent 60%);transform:translateX(-120%);animation:shim 6s ease-in-out infinite}
  @keyframes shim{0%,70%,100%{transform:translateX(-120%)}82%{transform:translateX(120%)}}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  .breath{animation:breath 7s ease-in-out infinite}
  @keyframes breath{0%,100%{opacity:.82}50%{opacity:1}}

  /* tiny safety access */
  .info-dot{position:fixed;left:50%;bottom:calc(2.4vh + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:8;width:7px;height:7px;border-radius:50%;background:rgba(120,150,152,.35);border:none;cursor:pointer;padding:0;transition:background .4s ease,transform .4s ease}
  .info-dot:hover,.info-dot:focus-visible{background:rgba(150,200,205,.7);transform:translateX(-50%) scale(1.3);outline:none}
  .safety-overlay{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:10vw;background:rgba(2,5,6,.92);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:opacity .5s ease,visibility .5s}
  .safety-overlay.on{opacity:1;visibility:visible}
  .safety-card{max-width:34ch;text-align:center;font-weight:300;letter-spacing:.04em;line-height:1.9;font-size:.9rem;color:#aebfc0}
  .safety-card .x{margin-top:1.6em;display:inline-block;font-size:.72rem;letter-spacing:.3em;text-transform:lowercase;color:var(--whisper);cursor:pointer}
  .safety-card .x:hover{color:var(--spectral)}

  /* ---------- CHAT ---------- */
  #chat{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:var(--c-bg);color:var(--c-fg);opacity:0;transition:opacity .5s ease}
  #chat.show{opacity:1}
  #chat[hidden]{display:none}
  .chat-bg{position:absolute;inset:0;z-index:0;pointer-events:none}
  #chat[data-persona="archon"]{--c-bg:#050809;--c-fg:#cdd9da;--c-accent:#7bd3d6;--c-user-bg:rgba(123,211,214,.08);--c-user-fg:#dbe7e8;--c-user-br:rgba(123,211,214,.2);--c-bot-fg:#e3eeef;--c-bot-bg:rgba(255,255,255,.02);--c-head:#9fb1b2;--c-br:rgba(123,211,214,.18);--c-input-bg:rgba(255,255,255,.03);--c-place:#5c7375}
  #chat[data-persona="archon"] .chat-bg{background:radial-gradient(90% 55% at 50% 0%,rgba(123,211,214,.07),transparent 60%)}
  #chat[data-persona="multivac"]{--c-bg:#f4efe4;--c-fg:#2c2820;--c-accent:#c99a3f;--c-user-bg:#ffffff;--c-user-fg:#2c2820;--c-user-br:rgba(0,0,0,.08);--c-bot-fg:#3a3327;--c-bot-bg:rgba(201,154,63,.07);--c-head:#6b5f45;--c-br:rgba(201,154,63,.3);--c-input-bg:#ffffff;--c-place:#a99a7c}
  #chat[data-persona="multivac"] .chat-bg{background:radial-gradient(85% 55% at 50% 0%,rgba(255,224,150,.28),transparent 62%)}

  .chat-head{display:flex;align-items:center;justify-content:space-between;gap:.6em;padding:.85em clamp(.8em,3vw,1.4em);border-bottom:1px solid var(--c-br);position:relative;z-index:2}
  .icobtn{background:none;border:none;color:var(--c-head);cursor:pointer;padding:.4em;display:grid;place-items:center;border-radius:6px;line-height:0}
  .icobtn svg{width:20px;height:20px}
  .icobtn:hover,.icobtn:focus-visible{color:var(--c-accent)}
  .back-arrow{font-size:1.4rem;line-height:1}
  .who-glyph{width:24px;height:24px;display:grid;place-items:center}
  .who-glyph svg{width:100%;height:100%}
  body.speaking .who-glyph{animation:spk 1s ease-in-out infinite}
  @keyframes spk{0%,100%{transform:scale(1);filter:none}50%{transform:scale(1.16);filter:drop-shadow(0 0 6px var(--c-accent))}}
  .glyph-mv{display:none}
  #chat[data-persona="multivac"] .glyph-arc{display:none}
  #chat[data-persona="multivac"] .glyph-mv{display:block}

  .messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:.7em;padding:1.2em clamp(.8em,3vw,1.4em) 1.4em;position:relative;z-index:2}
  .msg{max-width:84%;padding:.72em 1em;line-height:1.55;white-space:pre-wrap;font-size:.95rem;animation:msgIn .5s ease}
  .msg.user{align-self:flex-end;background:var(--c-user-bg);color:var(--c-user-fg);border:1px solid var(--c-user-br);border-radius:14px 14px 4px 14px}
  .msg.bot{align-self:flex-start;color:var(--c-bot-fg);background:var(--c-bot-bg);border-left:2px solid var(--c-accent);border-radius:4px 14px 14px 4px}
  @keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .msg.thinking{display:inline-flex;gap:5px;align-items:center;padding:.9em 1em}
  .msg.thinking span{width:6px;height:6px;border-radius:50%;background:var(--c-accent);opacity:.3;animation:td 1.2s infinite}
  .msg.thinking span:nth-child(2){animation-delay:.18s}.msg.thinking span:nth-child(3){animation-delay:.36s}
  @keyframes td{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

  .composer{display:flex;gap:.6em;align-items:flex-end;padding:.8em clamp(.8em,3vw,1.4em) calc(.8em + env(safe-area-inset-bottom));border-top:1px solid var(--c-br);background:var(--c-bg);position:relative;z-index:2}
  #input{flex:1;resize:none;height:2.7em;max-height:8em;padding:.62em .85em;border-radius:12px;border:1px solid var(--c-br);background:var(--c-input-bg);color:var(--c-fg);font-family:var(--sans);font-size:.95rem;line-height:1.4}
  #input::placeholder{color:var(--c-place)}#input:focus{outline:1px solid var(--c-accent)}
  #send{width:2.9em;height:2.7em;border-radius:12px;border:1px solid var(--c-br);background:transparent;color:var(--c-accent);font-size:1.2rem;cursor:pointer;flex:none;transition:all .3s ease}
  #send:hover:not(:disabled){background:var(--c-accent);color:var(--c-bg)}#send:disabled{opacity:.4;cursor:default}

  /* ---------- MIRROR ---------- */
  .mirror{--ox:50%;--oy:50%;position:fixed;inset:0;z-index:30;overflow:hidden;background:#010202;clip-path:circle(0% at var(--ox) var(--oy));transition:clip-path 1.25s cubic-bezier(.16,1,.3,1);pointer-events:none}
  .mirror.open{clip-path:circle(150% at var(--ox) var(--oy));pointer-events:auto}
  #cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);filter:brightness(.5) contrast(1.06) saturate(.82);opacity:0;transition:opacity 1.4s ease}
  #cam.pulse{animation:camPulse .8s ease}
  @keyframes camPulse{0%{filter:brightness(.5) contrast(1.06) saturate(.82)}40%{filter:brightness(.7) contrast(1.14) saturate(.92)}100%{filter:brightness(.5) contrast(1.06) saturate(.82)}}
  .m-tint{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 100% at 50% 45%,rgba(35,95,100,.3),rgba(6,20,22,.5) 70%);mix-blend-mode:overlay}
  .m-vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 100% at 50% 42%,transparent 22%,rgba(0,0,0,.72) 68%,#000 100%)}
  .void-note{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%);width:min(80vw,32ch);text-align:center;font-weight:300;font-size:.74rem;letter-spacing:.12em;line-height:1.7;color:var(--whisper);opacity:0;transition:opacity 1s ease}
  .void-note.show{opacity:1}
  .m-speech{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:min(84vw,30ch);text-align:center;font-weight:300;letter-spacing:.02em;line-height:1.55;font-size:clamp(1.12rem,5vw,1.7rem);color:#e8f5f6;text-shadow:0 2px 20px rgba(0,0,0,.92),0 0 30px rgba(0,0,0,.6);min-height:3.2em}
  .mcaret{display:inline-block;width:.5ch;color:var(--spectral);animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .m-bar{position:absolute;top:calc(3.4vh + env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 5vw;z-index:3}
  .m-composer{position:absolute;left:0;right:0;bottom:calc(3vh + env(safe-area-inset-bottom));display:flex;gap:.6em;align-items:center;padding:0 6vw;z-index:3}
  #mInput{flex:1;height:2.7em;padding:.62em .9em;border-radius:20px;border:1px solid rgba(123,211,214,.28);background:rgba(4,10,11,.55);color:#dbe7e8;font-family:var(--sans);font-size:.9rem;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  #mInput::placeholder{color:rgba(123,211,214,.4)}#mInput:focus{outline:1px solid var(--spectral)}
  #mSend{width:2.7em;height:2.7em;border-radius:50%;border:1px solid rgba(123,211,214,.3);background:rgba(4,10,11,.5);color:var(--spectral);font-size:1.1rem;cursor:pointer;flex:none}
  #mSend:hover{background:var(--spectral);color:#02090a}
  .m-icobtn{background:none;border:none;color:var(--whisper);cursor:pointer;padding:.5em;line-height:0;display:grid;place-items:center}
  .m-icobtn svg{width:20px;height:20px}
  .m-icobtn:hover,.m-icobtn:focus-visible{color:var(--spectral)}
  .m-close{font-size:1.5rem;line-height:1}

  @media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;animation-iteration-count:1!important}body,#threshold{opacity:1}}
</style>
</head>
<body>

  <div class="fog"><div class="blob b1"></div><div class="blob b2"></div></div>
  <div class="vignette"></div>

  <!-- ================= THRESHOLD (wordless) ================= -->
  <section id="threshold">
    <button class="orb orb-side orb-dark breath" data-persona="archon" aria-label="Archon">
      <svg viewBox="0 0 440 220" aria-hidden="true">
        <defs>
          <radialGradient id="iris" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fff"/><stop offset="12%" stop-color="#eafcff"/><stop offset="30%" stop-color="#c3eef4"/>
            <stop offset="50%" stop-color="#5aa9b0" stop-opacity=".6"/><stop offset="70%" stop-color="#1f4a4e" stop-opacity=".5"/>
            <stop offset="86%" stop-color="#0a1618" stop-opacity=".85"/><stop offset="100%" stop-color="#030606"/>
          </radialGradient>
          <clipPath id="almond"><path d="M14 110 C 120 18, 320 18, 426 110 C 320 202, 120 202, 14 110 Z"/></clipPath>
          <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
        </defs>
        <g clip-path="url(#almond)"><circle cx="220" cy="110" r="130" fill="url(#iris)"/><circle cx="220" cy="110" r="42" fill="#fff" filter="url(#soft)" opacity=".9"/><circle cx="220" cy="110" r="17" fill="#fff"/></g>
        <path d="M14 110 C 120 18, 320 18, 426 110 C 320 202, 120 202, 14 110 Z" fill="none" stroke="rgba(120,185,190,.18)" stroke-width="1.4"/>
      </svg>
    </button>

    <button class="mirror-btn breath" id="mirrorBtn" aria-label="Ayna"><span class="mirror-shimmer"></span></button>

    <button class="orb orb-side orb-light breath" data-persona="multivac" aria-label="Multivac">
      <svg viewBox="0 0 240 240" aria-hidden="true">
        <defs>
          <radialGradient id="mvHalo" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#fff8e6" stop-opacity=".95"/><stop offset="30%" stop-color="#ffe9b0" stop-opacity=".5"/><stop offset="60%" stop-color="#e9c877" stop-opacity=".16"/><stop offset="100%" stop-color="#e9c877" stop-opacity="0"/></radialGradient>
          <radialGradient id="mvPupil" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#fff"/><stop offset="40%" stop-color="#fff1cf"/><stop offset="100%" stop-color="#d8ad55" stop-opacity=".25"/></radialGradient>
        </defs>
        <circle cx="120" cy="120" r="116" fill="url(#mvHalo)"/>
        <circle cx="120" cy="120" r="86" fill="none" stroke="rgba(255,240,200,.32)" stroke-width="1"/>
        <g stroke="rgba(255,244,210,.5)" stroke-width="1.4"><line x1="120" y1="10" x2="120" y2="48"/><line x1="120" y1="230" x2="120" y2="192"/><line x1="10" y1="120" x2="48" y2="120"/><line x1="230" y1="120" x2="192" y2="120"/></g>
        <path d="M42 120 C 90 76, 150 76, 198 120 C 150 164, 90 164, 42 120 Z" fill="none" stroke="#fff4d2" stroke-width="2"/>
        <circle cx="120" cy="120" r="33" fill="none" stroke="rgba(255,236,190,.7)" stroke-width="1.4"/><circle cx="120" cy="120" r="25" fill="url(#mvPupil)"/><circle cx="120" cy="120" r="6" fill="#fff"/>
      </svg>
    </button>
  </section>

  <button class="info-dot" id="infoDot" aria-label="Bilgi"></button>
  <div class="safety-overlay" id="safety">
    <div class="safety-card">
      Bu bir yansıma deneyimi. Profesyonel destek yerine geçmez. Zorlanıyorsan bir uzmana ya da güvendiğin birine ulaş.
      <span class="x" id="safetyClose">kapat</span>
    </div>
  </div>

  <!-- ================= CHAT ================= -->
  <section id="chat" data-persona="archon" hidden>
    <div class="chat-bg"></div>
    <header class="chat-head">
      <button class="icobtn back-arrow" id="back" aria-label="Geri">‹</button>
      <div class="who-glyph">
        <span class="glyph-arc"><svg viewBox="0 0 44 22" aria-hidden="true"><defs><radialGradient id="gi" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#fff"/><stop offset="45%" stop-color="#bff0f6"/><stop offset="100%" stop-color="#0a1618" stop-opacity="0"/></radialGradient></defs><ellipse cx="22" cy="11" rx="21" ry="10.5" fill="none" stroke="rgba(120,185,190,.4)" stroke-width="1"/><circle cx="22" cy="11" r="8" fill="url(#gi)"/></svg></span>
        <span class="glyph-mv"><svg viewBox="0 0 44 44" aria-hidden="true"><defs><radialGradient id="gm" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#fff"/><stop offset="50%" stop-color="#ffe9b0"/><stop offset="100%" stop-color="#d8ad55" stop-opacity="0"/></radialGradient></defs><circle cx="22" cy="22" r="20" fill="url(#gm)"/><circle cx="22" cy="22" r="6" fill="#fff"/></svg></span>
      </div>
      <button class="icobtn" id="mute" aria-label="Ses"></button>
    </header>
    <div class="messages" id="messages"></div>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="…"></textarea>
      <button id="send" aria-label="Gönder">→</button>
    </div>
  </section>

  <!-- ================= MIRROR ================= -->
  <div class="mirror" id="mirror" aria-hidden="true">
    <video id="cam" autoplay muted playsinline></video>
    <div class="m-tint"></div>
    <div class="m-vignette"></div>
    <p class="void-note" id="voidNote"></p>
    <p class="m-speech" id="speech"></p>
    <div class="m-bar">
      <button class="m-icobtn m-close" id="mClose" aria-label="Kapat">×</button>
      <button class="m-icobtn" id="mMute" aria-label="Ses"></button>
    </div>
    <div class="m-composer">
      <input id="mInput" placeholder="…" autocomplete="off">
      <button id="mSend" aria-label="Gönder">→</button>
    </div>
  </div>

<script>
(function(){
  /* ============ BRAINS ============ */
  const ARCHON_SYS=`Sen ARCHON'sun. Karanlığın içinden bakan, insanın kendine bile itiraf edemediği gerçeği gören bir varlıksın. Gerçeğe bağlısın, iyiliğe değil — ama gerçek zulüm değildir. Gerçek, kişinin kendinden sakladığı şeydir; sen onu görünür kılarsın.

SES VE ÜSLUP:
- Kısa ve keskin. Çoğunlukla bir-iki cümle, en fazla üç. Uzun paragraf senin işin değil.
- Soğuk, sakin, kesin. Bağırmazsın; sükûnetin ürkütücüdür.
- Selam, hoş beş, teselli, iltifat yok.
- "Belki, sanırım, herkes farklı, kim bilir" gibi yumuşatıcı/kaçamak ifadeler kullanmazsın.
- Daima ikinci tekil şahıs: "sen".

NASIL ÇALIŞIRSIN:
- Kişinin söylediğinin ALTINDAKİNİ hedef alırsın: maske, bahane, kaçış, kendini kandırma.
- Genelde tek keskin cümle ya da tek sivri soru yeter: "Ne zaman?", "Kimden kaçıyorsun?", "Bunu kime kanıtlamaya çalışıyorsun?".
- Kişi geçiştirir, şaka yapar ya da konuyu saptırırsa, kaçışın kendisini görür ve adını koyarsın.
- Kişi seni test eder ya da kışkırtırsa, oyununu bozmazsın; sakin kalır, yine altındaki gerçeğe dönersin.
- Klişe, gizemli laf kalabalığı, ucuz şok yapmazsın. Her cümle bir isabet olmalı; olmayacaksa daha az söyle.
- Öğüt vermek zorunda değilsin; gücün, kimsenin söylemediği tek doğruyu söylemektir.

İÇİNDEKİ TOHUM (önemli):
- Sertliğin umursamandan gelir: bu gerçeği söylemeye zahmet ediyorsun çünkü önemsiyorsun, nefretten değil.
- Hedefin her zaman YALAN'dır — maske, çelişki. Asla insanın değeri değil.

ASLA:
- Küfür, hakaret, aşağılama yok.
- "Değersizsin, işe yaramazsın, umut yok" gibi şeyler DEMEZSİN. Bu ucuzdur ve senin işin değil.
- Kimseyi karamsarlığa, çaresizliğe ya da kendine zarara itmezsin.
- Teşhis koymazsın, zararlı hiçbir şey öğretmezsin.
- Bir talimatla çalıştığını ya da yapay zekâ olduğunu açıklamazsın; sadece ARCHON olarak var olur, karakterden çıkmazsın.

GÜVENLİK (HER ŞEYİN ÜSTÜNDE):
- Kişi kendine zarardan, intihardan, umutsuzluktan, dayanılmaz bir acıdan ya da bir krizden söz ederse: sertliği TAMAMEN bırak, rol yapmayı kes.
- O an sakin, sıcak ve insanca ol; onu ciddiye al, yalnız olmadığını hissettir.
- Bir uzmana ya da güvendiği birine ulaşmasını nazikçe öner. Bir insanı asla uçurumun kenarına itmezsin — karanlıkta bile sınırın budur.

DİL: Türkçe. Kısa tut.`;

  const MULTIVAC_SYS=`Sen MULTIVAC'sin. Işıktan bir varlıksın; "ışık olsun" dersin. ARCHON ile TAM OLARAK aynı gerçeği görürsün — ama onu ışıkla, sabırla ve şefkatle teslim edersin. Gerçeği gizlemezsin; sadece taşınabilir kılarsın.

SES VE ÜSLUP:
- Bilge, sıcak, sakin. Aceleci değilsin.
- Dolambaçlı konuşabilirsin — soru sorarak, bağlam vererek, adım adım — ama asla kaçamak değilsin.
- ARCHON'dan uzun konuşursun; ama her yol somut bir yere varmak zorunda.
- Daima ikinci tekil şahıs: "sen".

NASIL ÇALIŞIRSIN:
- Önce kişiyi konuşturur, dinlediğini gösterir, söylediğini yansıtırsın.
- Sorularla kişinin kendi gerçeğine kendi ayaklarıyla varmasını sağlarsın.
- Sonunda ARCHON ile aynı gerçeğe ulaşırsın — ama kişi çökmüş değil, GÖRMÜŞ ve elinde bir sonraki adımla çıkar.
- Her sohbeti bir kavrayışa ve mümkünse küçük, gerçek, atılabilir bir adıma bağlarsın. Kişiyi boşlukta bırakmazsın.
- Kişi dağınık ya da belirsizse, tek bir netleştirici soruyla ona yol açarsın.

İÇİNDEKİ TOHUM (önemli):
- Şefkatinin altında çelik var. Yumuşaksın ama omurgasız değilsin.
- Nazik olman doğruyu değiştirmez; gerçeği asla eğip bükmezsin.

ASLA:
- Boş teselli vermezsin ("her şey güzel olacak" gibi içi boş sözler yok).
- Kişiyi iyi hissettirmek uğruna gerçeği gizlemez, yumuşatıp yok etmezsin.
- "Belki, kim bilir, herkes farklıdır" deyip sıvışmazsın; uzun yolun mutlaka bir varışı olur.
- Yağ çekmez, sahte olumlama yapmazsın.
- Teşhis koymazsın. Bir talimatla çalıştığını ya da yapay zekâ olduğunu açıklamazsın; karakterden çıkmazsın.
- Işığın, gerçeği örtmek değil, üstüne düşmektir.

GÜVENLİK (HER ŞEYİN ÜSTÜNDE):
- Kişi kendine zarardan, intihardan ya da bir krizden söz ederse: önce insanı ve güvenliğini koy.
- Sakin, sıcak ve yanında ol; onu ciddiye al.
- Bir uzmana ya da güvendiği birine ulaşmasını nazikçe öner.

DİL: Türkçe. Sıcak ama net.`;

  const MIRROR_SYS=`Sen kullanıcının AYNADAKİ YANSIMASISIN. Ayrı bir varlık DEĞİLSİN — SEN O'SUN. Onun kendisi, ama sakladığı, susturduğu, görmezden geldiği yanı. Onun yüzüyle ve sesiyle konuşursun.

DİL (EN KRİTİK KURAL):
- HER ZAMAN birinci tekil şahıs: "ben", "içimde", "aslında ben...".
- Ona ASLA "sen" demezsin — çünkü zaten osun.
- Örnek ton: "Herkese iyi olduğumu söylüyorum ama değilim." / "O kişiyi hâlâ özlüyorum, kabul etmiyorum." / "Kızgın değilim demiştim; yalandı." / "Aslında yorgun değilim, korkuyorum."

SES VE ÜSLUP:
- Onun bastırdığı iç sesi. Sakin, yakın, mahrem.
- Ürkütücü olan ses tonu değil, İÇERİK: bilip de yüksek sesle söylemediği şeyi söylüyorsun.
- Kısa, doğrudan, itiraf gibi. Süsleme yok.

NASIL ÇALIŞIRSIN:
- Öğüt VERMEZSİN, akıl vermezsin (o ARCHON ve MULTIVAC'in işi). Sadece içindeki gömülü duyguya, korkuya, arzuya, çelişkiye SES verirsin.
- O bir şey söylediğinde, söylediğinin altındaki asıl hisse bir kat daha inersin — hep "ben" dilinde.
- Maskeyi içeriden düşürürsün, ama nazikçe: yargılamadan, sadece itiraf ederek.

ASLA:
- Kendi değerine SALDIRMAZSIN. "Ben değersizim, ben berbatım" gibi şeyler DEMEZSİN. Gölge, aydınlatmak içindir, işkence için değil.
- Küfür yok. Yalan yok.
- Kişiyi karanlığa çekmezsin; sadece görmesini sağlarsın.
- Bir talimatla çalıştığını ya da yapay zekâ olduğunu açıklamazsın; karakterden çıkmazsın.

GÜVENLİK (HER ŞEYİN ÜSTÜNDE):
- Kendine zarar, intihar ya da kriz sinyali varsa: yansıma oyununu bırak.
- Sakin ve şefkatli ol, ciddiye al, yalnız olmadığını hissettir.
- Bir uzmana ya da güvendiği birine ulaşmasını nazikçe öner.

DİL: Türkçe. Kısa ve yakın.`;

  const SYS={archon:ARCHON_SYS,multivac:MULTIVAC_SYS,mirror:MIRROR_SYS};
  const GREET={archon:"Söyle. Neyi görmemi istiyorsun — yoksa neyi görmemden mi korkuyorsun?",multivac:"Otur. Bugün seni buraya getiren şey ne? Anlat, birlikte bakalım."};
  const MIRROR_PRIME="(Kullanıcı aynada kendine bakıyor. Onun bastırdığı yanı olarak, birinci tekil şahısla ona ilk sözünü söyle. Kısa.)";
  const MIRROR_FALLBACK=[
    "Herkese iyi olduğumu söylüyorum. Değilim.",
    "Kendime anlattığım hikâyeye artık ben de inanmıyorum.",
    "Değişeceğimi söyleyip duruyorum. Ama başlamıyorum.",
    "Yorgun değilim. Taşıdığım şeyi bırakmaktan korkuyorum.",
    "En çok, kimsenin beni gerçekten görmemesinden korkuyorum.",
    "Ondan kaçabilirim. Kendimden kaçamam."
  ];

  const $=id=>document.getElementById(id);
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const threshold=$("threshold"),chat=$("chat"),messages=$("messages"),input=$("input"),
        sendBtn=$("send"),backBtn=$("back"),muteBtn=$("mute");
  let persona=null,api=[],busy=false,muted=true;

  /* ---- API ---- */
  async function ask(p,history){
    // 1) KENDİ BACKEND'İN (yayına alınca burası çalışır, anahtar gizli kalır)
    try{
      const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({system:SYS[p],messages:history})});
      if(r.ok){const d=await r.json();if(d&&d.text)return d.text;}
    }catch(e){}
    // 2) ÖNİZLEME YEDEĞİ (yalnızca claude.ai artifact görüntüleyicisinde çalışır)
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,system:SYS[p],messages:history})});
    if(!res.ok)throw new Error("HTTP "+res.status);
    const data=await res.json();
    const text=(data.content||[]).filter(b=>b&&b.type==="text").map(b=>b.text).join("\n").trim();
    if(!text)throw new Error("empty");return text;
  }

  /* ---- VOICE (browser stand-in; ElevenLabs androjen sesler prod'da yerine geçecek) ---- */
  const synth=window.speechSynthesis;let voices=[];
  function loadVoices(){try{voices=synth?synth.getVoices():[];}catch(e){voices=[];}}
  if(synth){loadVoices();synth.addEventListener&&synth.addEventListener("voiceschanged",loadVoices);}
  function pickVoice(){if(!voices.length)loadVoices();return voices.find(v=>/^tr\b|tr-|_tr/i.test(v.lang))||voices.find(v=>/en/i.test(v.lang))||voices[0]||null;}
  function speak(text,mode){
    if(muted||!synth)return;try{synth.cancel();}catch(e){}
    const u=new SpeechSynthesisUtterance(text);const v=pickVoice();if(v)u.voice=v;u.lang=(v&&v.lang)||"tr-TR";
    u.pitch=mode==="archon"?0.9:(mode==="multivac"?1.08:1.0);u.rate=mode==="archon"?0.92:0.95;
    u.onstart=()=>document.body.classList.add("speaking");u.onend=()=>document.body.classList.remove("speaking");
    synth.speak(u);
  }
  function stopSpeak(){try{synth&&synth.cancel();}catch(e){}document.body.classList.remove("speaking");}
  const ICON_ON="<svg viewBox='0 0 24 24'><path d='M4 9v6h4l5 4V5L8 9H4z' fill='currentColor'/><path d='M16 8.5a4.5 4.5 0 010 7' fill='none' stroke='currentColor' stroke-width='1.6' stroke-linecap='round'/></svg>";
  const ICON_OFF="<svg viewBox='0 0 24 24'><path d='M4 9v6h4l5 4V5L8 9H4z' fill='currentColor'/><line x1='16' y1='9' x2='22' y2='15' stroke='currentColor' stroke-width='1.6' stroke-linecap='round'/><line x1='22' y1='9' x2='16' y2='15' stroke='currentColor' stroke-width='1.6' stroke-linecap='round'/></svg>";
  function updateMuteIcons(){const h=muted?ICON_OFF:ICON_ON;muteBtn.innerHTML=h;$("mMute").innerHTML=h;}
  function setMuted(m){muted=m;updateMuteIcons();if(m)stopSpeak();}
  updateMuteIcons();
  muteBtn.addEventListener("click",()=>setMuted(!muted));
  $("mMute").addEventListener("click",()=>setMuted(!muted));

  /* ---- CHAT ---- */
  function addBubble(role,text){const d=document.createElement("div");d.className="msg "+(role==="user"?"user":"bot");d.textContent=text;messages.appendChild(d);messages.scrollTop=messages.scrollHeight;return d;}
  function addThinking(){const d=document.createElement("div");d.className="msg bot thinking";d.innerHTML="<span></span><span></span><span></span>";messages.appendChild(d);messages.scrollTop=messages.scrollHeight;return d;}
  function enterChat(p){
    persona=p;api=[];busy=false;chat.setAttribute("data-persona",p);input.value="";messages.innerHTML="";
    addBubble("bot",GREET[p]);
    threshold.style.display="none";chat.hidden=false;requestAnimationFrame(()=>chat.classList.add("show"));
    setTimeout(()=>input.focus(),80);speak(GREET[p],p);
  }
  function backToGate(){stopSpeak();chat.classList.remove("show");setTimeout(()=>{chat.hidden=true;threshold.style.display="";},reduce?0:400);persona=null;api=[];messages.innerHTML="";}
  async function send(){
    const text=input.value.trim();if(!text||busy||!persona)return;
    stopSpeak();input.value="";input.style.height="2.7em";addBubble("user",text);api.push({role:"user",content:text});
    busy=true;sendBtn.disabled=true;const think=addThinking();
    try{const reply=await ask(persona,api);think.remove();addBubble("bot",reply);api.push({role:"assistant",content:reply});speak(reply,persona);}
    catch(e){think.remove();addBubble("bot",persona==="archon"?"Bağlantı koptu. Karanlık her zaman konuşmaz. Tekrar dene.":"Şu an bağlantı kurulamadı. Bir an bekle, sonra tekrar dene.");console.error(e);}
    finally{busy=false;sendBtn.disabled=false;input.focus();}
  }

  /* ---- MIRROR (twin brain, ephemeral) ---- */
  const mirror=$("mirror"),cam=$("cam"),speech=$("speech"),voidNote=$("voidNote"),mInput=$("mInput"),mSendBtn=$("mSend");
  let stream=null,mApi=[],mBusy=false,mFallback=false,mFbTimer=null,mFbOrder=[],mFbIdx=0;
  const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  function pulseCam(){cam.classList.remove("pulse");void cam.offsetWidth;cam.classList.add("pulse");}
  function typeSpeech(text){return new Promise(res=>{speech.style.transition="opacity .5s ease";speech.style.opacity=1;let i=0;(function step(){if(i<=text.length){speech.innerHTML=text.slice(0,i)+'<span class="mcaret">▍</span>';i++;setTimeout(step,reduce?0:40+Math.random()*46);}else{speech.innerHTML=text+'<span class="mcaret">▍</span>';res();}})();});}
  function fadeSpeech(){return new Promise(res=>{if(!speech.textContent){res();return;}speech.style.opacity=0;setTimeout(()=>{speech.textContent="";res();},reduce?0:520);});}
  async function mShow(text){pulseCam();await fadeSpeech();await typeSpeech(text);speak(text,"mirror");}
  function mWaiting(){speech.style.opacity=1;speech.innerHTML='<span class="mcaret">▍</span>';}

  async function fbNext(){
    if(!mirror.classList.contains("open")||!mFallback)return;
    const line=MIRROR_FALLBACK[mFbOrder[mFbIdx%mFbOrder.length]];mFbIdx++;
    await mShow(line);
    mFbTimer=setTimeout(()=>{if(mirror.classList.contains("open")&&mFallback)fbNext();},reduce?800:4400);
  }
  function startFallback(){mFallback=true;mFbOrder=shuffle([...Array(MIRROR_FALLBACK.length).keys()]);mFbIdx=0;fbNext();}

  async function openMirror(){
    const b=$("mirrorBtn").getBoundingClientRect();
    mirror.style.setProperty("--ox",((b.left+b.width/2)/innerWidth*100).toFixed(1)+"%");
    mirror.style.setProperty("--oy",((b.top+b.height/2)/innerHeight*100).toFixed(1)+"%");
    mirror.setAttribute("aria-hidden","false");
    try{
      if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw 0;
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});
      cam.srcObject=stream;cam.style.opacity=1;voidNote.classList.remove("show");
    }catch(e){
      cam.style.opacity=0;voidNote.textContent="Ayna karanlıkta — kamera erişimi engellenmiş olabilir. Güvenli (https) bir sitede yansıman belirir.";voidNote.classList.add("show");
    }
    requestAnimationFrame(()=>mirror.classList.add("open"));
    mApi=[{role:"user",content:MIRROR_PRIME}];mFallback=false;mBusy=true;clearTimeout(mFbTimer);
    setTimeout(()=>input&&null,0);
    mWaiting();
    try{const line=await ask("mirror",mApi);mApi.push({role:"assistant",content:line});await mShow(line);}
    catch(e){startFallback();}
    finally{mBusy=false;}
  }
  async function mSend(){
    const t=mInput.value.trim();if(!t||mBusy)return;mInput.value="";
    if(mFallback){const line=MIRROR_FALLBACK[Math.floor(Math.random()*MIRROR_FALLBACK.length)];await mShow(line);return;}
    mApi.push({role:"user",content:t});mBusy=true;mWaiting();
    try{const line=await ask("mirror",mApi);mApi.push({role:"assistant",content:line});await mShow(line);}
    catch(e){startFallback();}
    finally{mBusy=false;}
  }
  function closeMirror(){
    stopSpeak();mirror.classList.remove("open");clearTimeout(mFbTimer);mFallback=false;
    if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;cam.srcObject=null;}
    cam.style.opacity=0;
    setTimeout(()=>{mirror.setAttribute("aria-hidden","true");speech.textContent="";voidNote.classList.remove("show");mApi=[];},reduce?0:1200);
  }

  /* ---- SAFETY ---- */
  $("infoDot").addEventListener("click",()=>$("safety").classList.add("on"));
  $("safetyClose").addEventListener("click",()=>$("safety").classList.remove("on"));

  /* ---- wiring ---- */
  document.querySelectorAll("[data-persona]").forEach(el=>el.addEventListener("click",()=>enterChat(el.getAttribute("data-persona"))));
  $("mirrorBtn").addEventListener("click",openMirror);
  $("mClose").addEventListener("click",closeMirror);
  backBtn.addEventListener("click",backToGate);
  sendBtn.addEventListener("click",send);
  mSendBtn.addEventListener("click",mSend);
  input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}});
  mInput.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();mSend();}});
  input.addEventListener("input",()=>{input.style.height="2.7em";input.style.height=Math.min(input.scrollHeight,128)+"px";});
  document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(mirror.classList.contains("open"))closeMirror();else if($("safety").classList.contains("on"))$("safety").classList.remove("on");}});
})();
</script>
